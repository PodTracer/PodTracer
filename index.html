<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pod Tracer</title>
<!-- installable, works offline: manifest + icons + service worker (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Pod Tracer">
<meta name="description" content="Track the podcast episodes you've listened to.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#efeadf; --wood:#8a6a4f; --ink:#2b2620; --muted:#8a8378;
    --panel:#ffffff; --unread:#e3ddce; --red:#aa3333; --line:#000;
    --lines:repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 4px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); min-height:100vh;
    padding:calc(var(--header-h,50px) + 4px) 4px calc(var(--footer-h,0px) + 4px);}
  button,input{font:inherit; color:inherit;}
  button{cursor:pointer;}
  #app{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:4px;}

  /* ---- frozen header: page tabs edge to edge, then a row of controls ---- */
  #app-header{position:fixed; top:0; left:0; right:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:0 0 4px; background:var(--bg); border-bottom:3px solid #000;}
  #app-header.bare{padding-bottom:0;}
  #tabs{display:flex; padding-top:env(safe-area-inset-top); border-bottom:3px solid #000;}
  #app-header.bare #tabs{border-bottom:none;}
  #tabs .tab{flex:1 1 0; height:42px; display:flex; align-items:center; justify-content:center; background:var(--bg);
    font-family:Arial,sans-serif; font-size:.85rem; font-weight:600; letter-spacing:.3px; cursor:pointer; user-select:none;}
  #tabs .tab + .tab{border-left:3px solid #000;}
  #tabs .tab.active{background:var(--ink); color:#fff;}
  #tabs[hidden]{display:none;}
  /* a show's own window: Back | name | Edit, like Stack Tracker's page headers */
  #ttl-bar{display:flex; padding-top:env(safe-area-inset-top); border-bottom:3px solid #000;}
  #ttl-bar[hidden]{display:none;}
  #app-header.bare #ttl-bar{border-bottom:none;}   /* nothing under the bar (edit mode): one line, not two */
  #ttl-bar button{flex:0 0 25%; height:42px; margin:0; padding:0 2px; border:0; border-radius:0; background:var(--ink); color:#fff;
    font:600 .85rem Arial,sans-serif; letter-spacing:.3px; cursor:pointer;}
  #ttl-bar button:active{filter:brightness(1.3);}
  #ttl-bar #tb-edit.on{background:#5b6633;}
  #ttl-bar #tb-back.cancel{background:var(--red);}
  #ttl-bar #tb-edit.blank{display:none;}           /* Add Podcast: no right-hand button */
  #ttl-bar:has(#tb-edit.blank) h2{border-right:none; padding-right:calc(25% + 11px);}   /* no right button: pad by Back's width so the title centers on the whole window */
  /* header text in capitals: the Library/Data tabs and the Back | title | Edit bar */
  #tabs .tab, #ttl-bar button, #ttl-bar h2{text-transform:uppercase; letter-spacing:.6px;}
  #ttl-bar h2{flex:1; min-width:0; margin:0; height:42px; padding:0 8px; background:#d9d0be; text-align:center;
    border-left:3px solid #000; border-right:3px solid #000; font:600 .95rem/42px Georgia,serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* tag tabs in a show: All, then each tag in use */
  .tabs.tagtabs{height:45px; flex:none;}
  /* search + sort/filter card (second header row of a show's window), like Stack Tracker's */
  #sf-card{flex:1; position:relative; display:flex; align-items:center; justify-content:center; gap:5px; height:45px; padding:0 40px;
    border:3px solid #000; border-radius:8px; cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden;
    --l:var(--panel); --r:var(--panel);
    background:linear-gradient(to right, var(--l) 0 39px, var(--panel) 39px calc(100% - 39px), var(--r) calc(100% - 39px)) border-box;
    font:700 min(.74rem,2.95vw) Arial,sans-serif; text-transform:uppercase;}
  #sf-card .sk{color:var(--muted);} #sf-card .sv{color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
  #sf-card .sl{display:flex; gap:5px; min-width:0;}
  /* a show's second header row: still 45px. A 45px photo square on the left; beside it two thin 21px cards, stacked
     (name and publisher on top, search + sort/filter below), like Stack Tracker's two-row header */
  .hdr-row.show-row{height:45px;}
  .photo-card{flex:none; width:45px; height:45px; position:relative; border-radius:8px; overflow:hidden; background:var(--unread);}
  .photo-card::after{content:''; position:absolute; inset:0; border:3px solid #000; border-radius:8px; pointer-events:none;}   /* border drawn over the art */
  .photo-card .art-sec{width:100%; height:100%; border-right:0;}
  .show-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .title-card{height:21px; display:flex; align-items:center; justify-content:center; gap:5px; padding:0 8px; background:var(--panel); border:3px solid #000; border-radius:6px;
    white-space:nowrap; overflow:hidden;}
  .title-card .t{min-width:0; max-width:100%; font:700 .72rem/1 Georgia,serif; letter-spacing:.5px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis;}   /* just the name, centered, in capitals */
  .title-card .a{min-width:0; font:.6rem/1 Arial,sans-serif; color:rgba(43,38,32,.7); overflow:hidden; text-overflow:ellipsis;}
  #sf-card.compact{flex:none; height:21px; border-radius:6px; padding:0 30px; gap:4px; font-size:min(.6rem,2.5vw); line-height:1;
    background:linear-gradient(to right, var(--l) 0 27px, var(--panel) 27px calc(100% - 27px), var(--r) calc(100% - 27px)) border-box;}
  #sf-card.compact .sl{gap:4px;}
  #sf-card.compact #sf-search, #sf-card.compact #sf-close{width:24px;}
  #sf-card.compact #sf-search svg, #sf-card.compact #sf-close svg{width:11px; height:11px;}
  #sf-card.compact #sfq{left:24px; right:24px; padding:0 6px; font-size:.74rem;}
  #sf-search, #sf-close{position:absolute; top:0; bottom:0; width:36px; display:flex; align-items:center; justify-content:center;}
  #sf-search{left:0; border-right:3px solid #000;} #sf-close{right:0; border-left:3px solid #000; display:none;}
  #sf-search svg, #sf-close svg{width:16px; height:16px; display:block;}
  #sfq{position:absolute; left:36px; right:36px; top:0; bottom:0; display:none; margin:0; padding:0 8px; border:0; outline:0; background:transparent;
    font:600 .9rem Georgia,serif; text-transform:none;}
  #sf-card.searching{--l:var(--ink); --r:#7a2f2b; cursor:text;}
  #sf-card.searching .sk, #sf-card.searching .sv{visibility:hidden;}
  #sf-card.searching #sf-search svg{stroke:#fff;}
  #sf-card.searching #sf-close{display:flex;}
  #sf-card.searching #sfq{display:block;}
  /* the Sort and Filter page */
  #so-page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;}
  #so-page[hidden]{display:none;}
  /* the cover lifted out as a framed photo (3D) */
  #f3-back{position:fixed; inset:0; z-index:30; background:rgba(20,16,12,.45); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity 1050ms cubic-bezier(.37,0,.63,1), visibility 0s linear 1050ms;}
  #f3-back.on{opacity:1; visibility:visible; transition:opacity 1050ms cubic-bezier(.37,0,.63,1), visibility 0s;}
  #f3-back.quick{transition-duration:780ms, 0s;}
  #f3-canvas{position:fixed; inset:0; z-index:31; display:none; touch-action:none; cursor:pointer;}
  #f3-canvas.on{display:block;}
  body.f3-open{overflow:hidden; touch-action:none;}
  .photo-card{cursor:pointer;} .photo-card.lifted{visibility:hidden;}
  .gear-card{flex:none; width:45px; height:45px; margin:0; padding:5px; box-sizing:border-box; border:3px solid #000; border-radius:8px; background:var(--panel); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .gear-card svg{width:100%; height:100%; display:block; transition:transform .25s;}
  .gear-card:active svg{transform:rotate(30deg);}
  #st-page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;}
  #st-page[hidden]{display:none;}
  .st-name{max-width:760px; margin:4px auto 0; padding:0 4px;}
  .st-name span{display:block; height:30px; box-sizing:border-box; padding:0 8px; text-align:center; border:3px solid #000; border-radius:8px; background:var(--panel);
    font:700 .78rem/24px Georgia,serif; letter-spacing:.5px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #st-body{display:flex; flex-direction:column; gap:4px; padding:0 4px calc(16px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto;}
  .st-tog{position:relative; padding-right:48px;}
  .st-tog i{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:24px; height:24px; box-sizing:border-box; border:3px solid #000; border-radius:6px; background:#fff;
    font:900 .8rem/18px Arial,sans-serif; font-style:normal; text-align:center; color:var(--ink);}
  .st-tog.on i{border-color:#fff;}
  .st-sum{height:30px; display:flex; align-items:center; justify-content:center; font:.72rem Arial,sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .st-sum b{color:var(--ink); margin:0 4px;}
  #st-rm b{color:var(--red);}
  #tg-page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;}
  #tg-page[hidden]{display:none;}
  #tg-body{display:flex; flex-direction:column; gap:4px; padding:4px 4px calc(16px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto;}
  .tg-row{display:flex; gap:4px;} .tg-row .so-opt{flex:1; min-width:0;}
  .tg-del{flex:0 0 45px; height:45px; margin:0; padding:0; box-sizing:border-box; border:3px solid #000; border-radius:8px; background:#fff; color:var(--red); font:700 1.3rem/1 Arial,sans-serif; cursor:pointer;}
  .tg-none{height:45px; display:flex; align-items:center; justify-content:center; box-sizing:border-box; border:3px dashed rgba(0,0,0,.35); border-radius:8px; font:.72rem Arial,sans-serif; color:var(--muted);}
  .tg-add{display:flex; gap:4px; height:45px; margin-top:8px;}
  #tg-new{flex:1; min-width:0; box-sizing:border-box; border:3px solid #000; border-radius:8px; padding:0 10px; background:#fff; font:600 .9rem Arial,sans-serif; outline:none;}
  #tg-addbtn{flex:0 0 25%; margin:0; padding:0; box-sizing:border-box; border:3px solid #000; border-radius:8px; background:var(--ink); color:#fff; font:700 .8rem Arial,sans-serif; text-transform:uppercase; letter-spacing:.5px; cursor:pointer;}
  .so-head{position:sticky; top:0; z-index:1; display:flex; padding-top:env(safe-area-inset-top); background:var(--bg); border-bottom:3px solid #000;}
  .so-head button{flex:0 0 25%; height:42px; margin:0; border:0; border-radius:0; background:var(--ink); color:#fff; cursor:pointer;
    font:600 .85rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase;}
  .so-head h2{flex:1; min-width:0; margin:0; height:42px; padding:0 calc(25% + 11px) 0 8px; background:#d9d0be; border-left:3px solid #000;
    text-align:center; font:600 .95rem/42px Georgia,serif; letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #so-body{display:flex; flex-direction:column; gap:4px; padding:4px 4px calc(16px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto;}
  .so-opt{display:flex; flex-direction:column; justify-content:center; gap:2px; height:45px; margin:0; padding:0 10px; text-align:left;
    background:var(--panel); border:3px solid #000; border-radius:8px; cursor:pointer; line-height:1.15;}
  .so-opt b{font:600 .9rem Georgia,serif; color:var(--ink);} .so-opt span{font:.62rem Arial,sans-serif; color:var(--muted);}
  .so-opt.on{background:var(--ink);} .so-opt.on b{color:#fff;} .so-opt.on span{color:#cfc8ba;}
  /* the show window's episodes sit in one wrapper card; tag tabs, when there are any, are its top strip */
  .ep-wrap{display:flex; flex-direction:column; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--unread);}
  .ep-wrap .tabs.tagtabs{height:24px; border:0; border-bottom:3px solid #000; border-radius:0;}   /* a thin strip: half the old height */
  .ep-wrap .tagtabs .tab{font-size:min(.66rem,2.7vw); line-height:1;}
  /* tags that don't fit start a new row; every tab in a row is the same width (sized to the longest tag) */
  .ep-wrap .tabs.tagtabs{height:auto; flex-wrap:wrap;}
  .ep-wrap .tagtabs .tab{flex:1 1 var(--tw,0px); height:21px; box-sizing:border-box; padding:0 6px; white-space:nowrap;}
  .tag-measure > *{flex:none !important;}
  .ep-list{display:flex; flex-direction:column; gap:4px; padding:4px;}
  .ep-list .empty{padding:24px 12px;}
  .tagtabs .tab b{font-weight:400; opacity:.7; margin-left:5px;}
  .tagpill{display:inline-block; padding:0 5px; margin-right:5px; border:1.5px solid currentColor; border-radius:4px; font:700 .54rem/1.5 Arial,sans-serif;
    letter-spacing:.4px; text-transform:uppercase; vertical-align:1px;}
  .ep.done .tagpill{color:rgba(255,255,255,.85);}
  /* edit mode: each episode becomes a small form */
  .ep-ed{display:flex; flex-direction:column; gap:4px; padding:6px; background:color-mix(in srgb, var(--cloth) 50%, transparent); border:3px solid #000; border-radius:8px;}   /* edit cards: the podcast's color at half opacity */
  .ee-top, .ee-bot{display:flex; gap:4px; height:34px;}
  .ee-bot{display:grid; grid-template-columns:1fr 1fr;}   /* date | length, even halves */
  .ee-title{flex:1; min-width:0; border:3px solid #000; border-radius:6px; padding:0 8px; background:#fff; font:600 .84rem Georgia,serif; outline:none;}
  .ee-date{flex:1 1 0; box-sizing:border-box; min-width:0; border:3px solid #000; border-radius:6px; padding:0 6px; background:#fff; font:.78rem Arial,sans-serif; outline:none;}
  .ee-tagrow{display:flex; gap:4px; align-items:stretch;}   /* the + grows with the tag rows */
  .ep-ed .ee-tag{flex:1; min-width:0; height:auto; box-sizing:border-box; flex-wrap:wrap; gap:3px; background:#000; border-width:3px; border-radius:6px;}
  .ep-ed .ee-tag::-webkit-scrollbar{display:none;}
  .ep-ed .ee-tag button{flex:1 1 var(--tw,0px); height:28px; box-sizing:border-box; font-size:.72rem; padding:0 8px; white-space:nowrap;}   /* too many for one row: a new row, all the same width */
  .ee-addtag{flex:0 0 34px; height:auto; min-height:34px; margin:0; padding:0; box-sizing:border-box; border:3px solid #000; border-radius:6px; background:var(--panel); color:var(--ink); font:700 1.2rem/1 Arial,sans-serif; cursor:pointer;}
  .ee-addtag:active{background:var(--bg);}
  .ep-ed .ee-tag button + button{border-left:0;}
  /* more than one row: rows go half height, so two rows fit the usual 34px; a third row onward adds height */
  #eps.half .ee-tag button{height:12.5px; font-size:.58rem; line-height:1;}
  .ee-reset{flex:0 0 34px; margin:0; padding:0; border:3px solid #000; border-radius:6px; background:#fff; color:var(--red); font:700 1rem Arial,sans-serif; cursor:pointer;}
  .ee-reset[hidden]{display:none;}
  /* guests: a fixed lowercase "with" then the names */
  .ee-guest{display:flex; align-items:center; gap:6px; height:34px; box-sizing:border-box; padding:0 8px; border:3px solid #000; border-radius:6px; background:#fff; cursor:text;}
  .ee-guest span{flex:none; font:.78rem Arial,sans-serif; color:var(--muted);}
  .ee-guests{flex:1; min-width:0; height:100%; border:0; padding:0; background:transparent; font:600 .78rem Arial,sans-serif; color:var(--ink); outline:none;}
  /* episode length: hours / minutes / seconds wheels, dragged up and down (as in Stack Tracker) */
  .ee-len{flex:1 1 0; min-width:0; display:flex; height:34px; box-sizing:border-box; background:var(--panel); border:3px solid #000; border-radius:6px; overflow:hidden;}
  .tw-wheel{position:relative; flex:1; min-width:0; height:100%; overflow:hidden; touch-action:none; cursor:grab; background:#fff;}
  .tw-wheel + .tw-wheel{border-left:3px solid #000;}
  .tw-wheel::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.16), rgba(0,0,0,0) 32%, rgba(0,0,0,0) 68%, rgba(0,0,0,.16));}
  .tw-wheel div{position:absolute; left:0; right:0; top:0; height:16px; text-align:center; color:var(--ink);
    font:700 14px/16px Arial,Helvetica,sans-serif; font-variant-numeric:tabular-nums; user-select:none; -webkit-user-select:none; will-change:transform;}
  .tw-wheel span{position:absolute; left:4px; top:3px; z-index:2; font:700 .5rem Arial,sans-serif; color:var(--muted); pointer-events:none;}
  .cp-row{display:flex; height:23px; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:#000; gap:3px;}
  .cp-row button{flex:1; min-width:0; margin:0; padding:0; border:0; border-radius:0; cursor:pointer; position:relative;}
  .cp-row button.on::after{content:''; position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-6px 0 0 -6px;
    border:2.5px solid #fff; border-radius:50%; box-shadow:0 0 0 1.5px rgba(0,0,0,.5);}
  /* half-height picker: the name-based card is one line, label then value */
  button.dt-card.cp-auto{cursor:pointer; height:23px; flex-direction:row; gap:6px; align-items:center; justify-content:center; text-align:center; font-size:.56rem; white-space:nowrap; overflow:hidden;}
  .dt-card.cp-auto b{font-size:.7rem; min-width:0;}
  .rm-show{cursor:pointer; margin-top:8px !important;} .dt-card.rm-show b{color:var(--red);}
  .show-ed{height:auto !important; align-items:center; padding-right:8px !important;}
  .show-ed.edited{background:#f6f2e8;}
  .show-ed .main{display:flex; flex-direction:column; gap:6px; padding:8px 0;}
  .show-ed input{width:100%; height:34px; border:3px solid #000; border-radius:6px; padding:0 8px; background:#fff; outline:none;}
  .show-ed .se-title{font:700 .95rem Georgia,serif;}
  .show-ed .se-author{font:.8rem Arial,sans-serif;}
  .show-ed .se-reset{align-self:center; height:34px;}
  .hdr-row{display:flex; align-items:stretch; gap:4px; margin:0 4px; height:45px;}
  .hdr-row > *{min-width:0;}
  .hdr-row:empty{display:none;}

  /* ---- frozen footer ---- */
  #app-footer{position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom)); background:var(--bg); border-top:3px solid #000;}
  #app-footer:empty{display:none;}

  /* ---- shared GT50 card pieces ---- */
  .card{background:var(--panel); border:3px solid #000; border-radius:8px;}
  .seg, .acts{display:flex; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .seg button, .acts button{flex:1; min-width:0; margin:0; padding:0 4px; border:none; border-radius:0; background:var(--panel);
    color:var(--ink); font-family:Arial,sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.3px; white-space:nowrap;}
  .seg button + button, .acts button + button{border-left:3px solid #000;}
  .seg button.on{background:var(--ink); color:#fff;}
  .acts button:active, .seg button:active{background:var(--bg);}
  .acts .del{color:var(--red);}
  .acts button:disabled{color:var(--muted);}
  .ink-btn{flex:0 0 auto; height:45px; padding:0 16px; border:3px solid #000; border-radius:8px; background:var(--ink); color:#fff;
    font-family:Arial,sans-serif; font-size:.8rem; font-weight:600; letter-spacing:.3px;}
  .plain-btn{flex:0 0 auto; height:45px; padding:0 12px; border:3px solid #000; border-radius:8px; background:var(--panel);
    font-family:Arial,sans-serif; font-size:.78rem; font-weight:600;}
  .field-card{flex:1; display:flex; align-items:center; height:45px; padding:0 10px; background:var(--panel); border:3px solid #000; border-radius:8px;}
  #app .field-card{flex:none;}
  .field-card input{width:100%; border:none; outline:none; background:none; font-family:Georgia,serif; font-size:.9rem;}
  .field-card svg{width:18px; height:18px; flex:none; margin-right:8px;}
  .sort-card{flex:0 0 27%; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
    background:var(--panel); border:3px solid #000; border-radius:8px; padding:0 8px; font-family:Arial,sans-serif;
    font-size:.78rem; cursor:pointer; user-select:none; white-space:nowrap;}
  .sort-card .k{color:var(--muted); font-size:.62rem; letter-spacing:.5px;}

  /* GT50 divider: no card, just a centered line split around the title */
  .list-divider{display:flex; align-items:center; gap:10px; height:45px; padding:0 4px;}
  .list-divider::before, .list-divider::after{content:''; flex:1; height:3px; background:#000; border-radius:2px;}
  .list-divider span{font-family:Georgia,serif; font-size:.9rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    max-width:75%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- a row card: 45px, progress fill behind ---- */
  .row{position:relative; display:flex; align-items:center; gap:8px; height:45px; padding:0 8px; background:var(--panel);
    border:3px solid #000; border-radius:8px; overflow:hidden; cursor:pointer; user-select:none;}
  .row:active{filter:brightness(.96);}
  .fill{position:absolute; left:-3px; top:-3px; bottom:-3px; pointer-events:none; background-color:var(--page);
    background-image:var(--lines); transition:width .3s ease;}
  .row > :not(.fill){position:relative;}
  /* cover art: a square section flush to the card's left edge, split off by a black line */
  /* cover art: runs right out to the card's edge; the border is drawn over it (::after), so the art's edges hide beneath it */
  .row.has-art, .card.show-head{position:relative; border:none; padding-left:0; padding-right:11px;}
  .row.has-art::after, .card.show-head::after{content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    border:3px solid #000; border-radius:8px;}
  .art-sec{align-self:stretch; width:45px; flex:none; border-right:3px solid #000;
    background-color:var(--unread); background-size:cover; background-position:center;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; line-height:1.15;}
  .t{font-family:Georgia,serif; font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .a{font-family:Arial,sans-serif; font-size:.66rem; color:rgba(43,38,32,.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prog{flex:none; text-align:right; display:flex; flex-direction:column; justify-content:center; line-height:1.15;
    font-family:Georgia,serif; font-size:.82rem; font-weight:600;}
  /* finished: dark fill, white text */
  .row.done .fill{background-color:var(--cloth);}
  .row.done .t, .row.done .prog{color:#fff;}
  .row.done .a{color:rgba(255,255,255,.75);}
  .row .go{flex:none; height:31px; padding:0 12px; border:3px solid #000; border-radius:6px; background:var(--ink); color:#fff;
    font-family:Arial,sans-serif; font-size:.72rem; font-weight:600;}
  .row .go.open{background:var(--panel); color:var(--ink);}

  /* episode rows */
  .ep .t{font-size:.84rem;}
  /* with guests: title, guests, then date and length, each on its own line, tightened to fit the same 45px card */
  .ep.has-g .main{line-height:1.08;}
  .ep.has-g .t{font-size:.8rem; line-height:1.05;}
  .ep.has-g .a{font-size:.6rem; line-height:1.15;}
  .ep.has-g .tagpill{font-size:.48rem; line-height:1.25; padding:0 4px;}
  /* the episode number: a section on the card's left, always the same width (room for four digits), sans-serif, equal-width digits */
  .row.ep{padding-left:0; background:color-mix(in srgb, var(--cloth) 30%, transparent);}   /* the podcast's color at 30% opacity (played cards: full color) */
  .ep-num{flex:none; align-self:stretch; width:52px; display:flex; align-items:center; justify-content:center; border-right:3px solid #000;
    background:#d9d0be; color:var(--ink); font:700 .92rem/1 Arial,Helvetica,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.2px;}
  .ep.done .ep-num{background:rgba(0,0,0,.22); color:#fff;}
  .ep-num.long{font-size:.76rem;} .ep-num.xlong{font-size:.62rem; letter-spacing:-.4px;}   /* 123.12 and longer still fit the same width */
  .ep .thru{flex:none; width:33px; height:31px; padding:0; border:3px solid #000; border-radius:6px; background:var(--panel);
    font-family:Arial,sans-serif; font-size:.7rem; font-weight:700; color:var(--ink);}
  .ep.done{background:var(--cloth);}
  .ep.done .t{color:#fff; font-weight:400;}
  .ep.done .a{color:rgba(255,255,255,.7);}
  .ep.done .thru{background:rgba(255,255,255,.18); color:#fff;}

  /* show heading */
  .show-head{display:flex; align-items:stretch; gap:10px; padding:0 10px 0 0; height:96px; overflow:hidden;}
  .show-head .art-sec{width:96px;}
  .show-head .main{padding:6px 0;}
  .show-head .t{font-size:1.05rem; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .show-head .a{font-size:.72rem; margin-top:2px;}
  /* stats card: every stat in capitals */
  .stats{display:flex; flex-direction:column; justify-content:center; gap:2px; height:45px; padding:0 10px; background:var(--panel);
    border:3px solid #000; border-radius:8px; font-family:Arial,sans-serif; font-size:.58rem; line-height:1.15; color:var(--muted);
    text-transform:uppercase;}

  .stats b{color:var(--ink);}
  .note{font-family:Arial,sans-serif; font-size:.66rem; color:var(--muted); line-height:1.4; padding:2px 4px;}
  .note.warn{color:var(--red);}

  /* footer: unified progress card */
  .pcard{position:relative; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .pcard .fill{left:0; top:0; bottom:0;}
  .pcard .ov{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-size:.82rem; font-weight:600; line-height:1.2;}
  .pcard.done .fill{background-color:var(--cloth);}

  .add-card{display:flex; align-items:center; justify-content:center; gap:8px; height:45px; background:var(--panel);
    border:3px solid #000; border-radius:8px; font-family:Arial,sans-serif; font-size:.82rem; color:var(--muted); letter-spacing:.5px; cursor:pointer;}

  /* ---- Data: Backup | Export | Import, laid out like Stack Tracker's Data page ---- */
  .tabs{display:flex; flex:1; min-width:0; gap:3px; background:#000; border:3px solid #000; border-radius:8px; overflow:hidden;}
  .tabs .tab{flex:1; display:flex; align-items:center; justify-content:center; background:#d9d0be; color:var(--ink); cursor:pointer;

  .dt-card{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; flex:none;

    background:var(--panel); border:3px solid #000; border-radius:8px; cursor:pointer; font:400 .62rem/1.15 Arial,sans-serif; text-transform:uppercase; color:var(--muted);}

  .rr-modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px;

  /* up-next cards: the border is drawn over the card (::after) so art and fills run under it */
  .oc{position:relative; display:flex; flex-direction:column; background:var(--panel); border-radius:8px; overflow:hidden; cursor:pointer; flex:none;}
  .oc::after{content:''; position:absolute; inset:0; z-index:3; pointer-events:none; border:3px solid #000; border-radius:8px;}

  button:disabled{cursor:default;}

  /* 100px tall; the art is the card's height wide, so the part you see (inside the border) is square */
  .v4{height:100px; flex-direction:row;}

  .cu-row{height:45px;}
  /* caught up: a gold check square, the circle in the podcast's color with a white check */

  .v4 .cks.gold, .v5 .cks.gold{background:var(--cloth); cursor:pointer;}

    background:linear-gradient(to top, var(--cloth) calc(3px + (100% - 6px) * var(--f,0)), var(--unread) 0); background-origin:border-box; background-clip:border-box;}
  .v5 .rnd{width:24px; height:24px; box-sizing:border-box; display:grid; place-items:center; border:3px solid #000; border-radius:50%; background:var(--panel); color:var(--ink);}
  .v5 .rnd .ck{width:12px; height:12px; stroke-width:3.6;}
  /* the Full | Simple switch under the search card */
  .seg.view-seg{flex:none; height:21px; border-radius:6px;}
  .seg.view-seg button{font:700 min(.6rem,2.5vw)/1 Arial,sans-serif; text-transform:uppercase; letter-spacing:.4px;}

  .v4 .et, .cu-row .t{white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-overflow:clip;}
  .v4 .art-sec, .cu-row .art-sec{background-position:center;}
  /* fixed heights: a wrapped title tightens its lines instead of growing the card */
  .v4 .et{font-size:.88rem; line-height:1.14;}
  .cu-row .t{font-size:.84rem; line-height:1.1;}
  .empty{padding:40px 12px; text-align:center; font-family:Arial,sans-serif; font-size:.8rem; color:var(--muted);}
  .spin{display:inline-block; width:14px; height:14px; border:3px solid var(--unread); border-top-color:var(--ink); border-radius:50%;

<script>
/* startup check: if anything stops the app from starting, say what on the screen (and in the console) instead of leaving it blank */
window.__ptStarted=false;
window.addEventListener('error',function(e){
  if(window.__ptStarted)return;
  var app=document.getElementById('app');if(!app)return;
  app.innerHTML='<div style="margin:12px 4px;padding:12px;border:3px solid #000;border-radius:8px;background:#fff;font:13px/1.4 Arial,sans-serif">'+
    '<b style="font:700 15px Georgia,serif">Pod Tracer couldn\u2019t start</b><br>'+String(e.message||e).replace(/</g,'&lt;')+
    (e.lineno?'<br><span style="color:#8a8378">line '+e.lineno+'</span>':'')+'</div>';
});

<script>
/* ======== PLACEHOLDERS: sample podcasts to look at. true = show them, false = remove them ======== */
const PLACEHOLDERS = true;

const KEY='gt50-podtracker-v1';   // same storage as v1/v2
// Stack Tracker's cloth colors: each show gets one
const CLOTHS=['#7a2f2b','#2b5752','#66304c','#303d66','#8a6a3f','#4f5b2e','#5a3d2b'];
let S={shows:{},order:[]};
let view={name:'lib',id:null,filter:'all',sort:'new',q:'',results:[],searching:false,lastTerm:'',libSort:'recent'};

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}if(!S.shows)S={shows:{},order:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage full or blocked')}}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms=2400){const t=$('#toast');t.classList.remove('act');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function fmtDate(ms){if(!ms)return'—';return new Date(ms).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}

function wishColor(title, author){

  const [f0, f1] = FAM[h1 % FAM.length], hue = Math.round(f0 + ((h1 >>> 8) % 1000) / 1000 * ((f1 - f0 + 360) % 360)) % 360;

  let lit = 22 + ((h2 >>> 8) % 21);                // 22–42% (the contrast check below darkens any that are too light)
  if(pick === 0){ sat = 8 + (h2 >>> 16) % 14; lit = 20 + (h2 >>> 4) % 14; }   // 1 in 14: a near-grey — slate, ash, charcoal
  else if(pick === 1) lit = 13 + (h2 >>> 4) % 7;   // 1 in 14: very deep — oxblood, ink, bottle green
  if(pick > 1 && hue >= 10 && hue < 60) sat = Math.max(sat, 50);   // oranges and ochres: rich rust and amber, not mud brown
  if(hue >= 70 && hue < 160) sat = Math.min(sat, 50);    // greens: never neon
  if(hue >= 40 && hue < 70){ sat = Math.min(sat, 55); lit = Math.min(lit, 32); }   // yellows: mustard and ochre, never khaki
  if(hue >= 170 && hue < 200) sat = Math.min(sat, 52);   // cyans: teal, not aqua

  let rgb = rgbOf(lit);
  while(lum(rgb) > .18 && lit > 12){ lit -= 1; rgb = rgbOf(lit); }   // white on it: 1.05 / (L + .05) ≥ 4.5
  return '#' + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
}

  ['whateverorigin',e=>`https://whateverorigin.org/get?url=${e}`,'json'],
  ['everyorigin',e=>`https://everyorigin.jwvbremen.nl/api/get?url=${e}`,'json'],

async function trackShow(i,btn){
  const p=view.results[i];
  if(S.shows[p.id]){openShow(p.id);return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Loading';
  try{
    const {eps,source}=await getEpisodes(p);
    if(!eps.length)throw new Error('No episodes found');
    S.shows[p.id]={...p,episodes:eps,played:{},source,addedAt:Date.now(),updatedAt:Date.now()};
    S.order.unshift(p.id);save();

  }catch(e){toast(e.message||'Could not load episodes');btn.disabled=false;btn.textContent='Track'}
}
// adds new episodes to a show; played marks are untouched, so Up Next stays where you are in the series
function mergeEpisodes(sh,eps,source){
  const wasCaughtUp=sh.episodes.length>0&&!upNext(sh);
  const before=new Set(sh.episodes.map(e=>e.id));
  const added=eps.filter(e=>!before.has(e.id)).length;
  if(added&&wasCaughtUp)sh.newAt=Date.now();   // caught up and something new dropped: it goes to the top
  const now=new Set(eps.map(e=>e.id));   // keep episodes that dropped out of the feed, so history isn't lost
  sh.episodes=eps.concat(sh.episodes.filter(e=>!now.has(e.id)));

  return added;
}

// background check for new episodes: on open and when the app comes back to the front, at most every 3 hours.
// Quiet: only the counts change (and a caught-up show with something new moves back to Up Next).
const AUTO_EVERY=3*3600000;
let autoBusy=false;
const STUCK_EVERY=15*60000;
async function autoRefresh(){
  if(autoBusy)return;
  const full=Date.now()-(S.lastAuto||0)>=AUTO_EVERY, stuckOnly=!full&&Date.now()-(S.lastStuck||0)>=STUCK_EVERY;
  const ids=full?[...S.order]:stuckOnly?S.order.filter(id=>S.shows[id]&&S.shows[id].source==='itunes'&&S.shows[id].feedUrl):[];
  if(!ids.length){if(stuckOnly){S.lastStuck=Date.now();save()}return}
  autoBusy=true;
  for(const id of ids){
    const sh=S.shows[id];if(!sh)continue;
    try{const {eps,source}=await getEpisodes(sh);if(S.shows[id]&&eps.length){mergeEpisodes(S.shows[id],eps,source);save()}}catch(e){}
    if(view.name==='lib')renderLibList();else if(view.name==='show'&&view.id===id){updateProgress();renderEpisodes()}
  }
  if(full)S.lastAuto=Date.now();S.lastStuck=Date.now();save();autoBusy=false;
  if(view.name==='data'&&view.dt==='feeds')dtFeeds();
}

  try{
    let perm=await backupDir.queryPermission({mode:'readwrite'});
    if(perm!=='granted'&&ask)perm=await backupDir.requestPermission({mode:'readwrite'});   // after a while away, one tap to allow it again
    if(perm!=='granted')return false;
    const fh=await backupDir.getFileHandle(name,{create:true}),w=await fh.createWritable();
    await w.write(new Blob([txt],{type:'application/json'}));await w.close();
    try{   // keep the newest 10, delete older ones (only this app's own dated backup files)
      const ours=[];for await(const [n,e] of backupDir.entries())if(e.kind==='file'&&BACKUP_FILE.test(n))ours.push(n);
      ours.sort().reverse().slice(BACKUP_KEEP).forEach(n=>backupDir.removeEntry(n).catch(()=>{}));
    }catch(e){}
    return true;
  }catch(e){return false}
}
// saves a backup: the chosen folder, else the share sheet (Save to Files / Drive), else a download.
// Returns how it went: 'folder' | 'shared' | 'downloaded' | false (cancelled or failed)
async function saveBackup(){
  const txt=libraryJSON(), name=`pod-tracer-${todayKey()}.json`;
  await fsReady;
  if(await backupToFolder(name,txt))return'folder';
  // Android only shares certain file types, and .json isn't one: try it as .json, then as .txt (Import reads either)
  for(const [n,type] of [[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']]){
    try{
      const file=new File([txt],n,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Pod Tracer backup'});return'shared'}
    }catch(e){if(e&&e.name==='AbortError')return false;}
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);return'downloaded';
  }catch(e){return false}
}
async function backUpNow(){
  const how=await saveBackup();
  if(!how){toast('Not saved — use Export › Copy to keep a copy');return}
  bk().last=Date.now();save();
  toast(how==='folder'?`Saved to ${backupDir.name}`:how==='shared'?'Backup handed to the share sheet':'Downloaded — check your Downloads folder');
  if(view.name==='data')renderData();
}
const downloadJSON=backUpNow;   // Export › Download saves the same way
// Daily/Weekly with a folder chosen: back up on its own when due (if the browser still allows it without asking)
async function autoBackup(){
  await fsReady;
  if(!backupDir||!backupDue())return false;
  try{if(await backupDir.queryPermission({mode:'readwrite'})!=='granted')return false}catch(e){return false}
  if(!await backupToFolder(`pod-tracer-${todayKey()}.json`,libraryJSON(),false))return false;
  bk().last=Date.now();save();if(view.name==='data')renderData();
  return true;
}
// the newest three backups in the folder, for the Import tab
async function folderBackups(){
  await fsReady;if(!backupDir)return{state:'none'};
  let perm='denied';try{perm=await backupDir.queryPermission({mode:'read'})}catch(e){}
  if(perm!=='granted')return{state:'ask'};
  const files=[];
  try{for await(const [n,e] of backupDir.entries())if(e.kind==='file'&&BACKUP_FILE.test(n))files.push([n,e])}catch(e){return{state:'none'}}
  files.sort((a,b)=>a[0]<b[0]?1:-1);
  const out=[];
  for(const [n,e] of files.slice(0,3)){try{const txt=await (await e.getFile()).text();const r=parseImport(txt);if(r.state==='ok')out.push({name:n,txt,msg:r.msg})}catch(err){}}
  return{state:'ok',files:out};
}

// when the next backup is due: the day after the last (Daily), or the picked weekday after it (Weekly)
function nextBackup(){
  const b=bk();if(b.every==='never')return 0;
  if(!b.last)return Date.now();
  const d=new Date(b.last);d.setHours(0,0,0,0);
  if(b.every==='day')return d.getTime()+DAY;
  let n=new Date(d.getTime()+DAY);while(n.getDay()!==b.day)n=new Date(n.getTime()+DAY);
  return n.getTime();
}
function backupDue(){const n=nextBackup();return n&&S.order.some(id=>!isPlaceholder(S.shows[id]))&&Date.now()>=n}   // only your own shows need backing up
async function checkBackup(){
  if(await autoBackup())return;
  if(!backupDue())return;
  const b=bk();
  $('#bk-modal-body').textContent=b.last?`Your last backup was ${fmtDate(b.last)}.`:"You haven't backed up your podcasts yet.";
  $('#bk-modal').classList.add('open');
}

// import: check pasted / loaded JSON, then Merge or Replace
function parseImport(txt){
  if(!txt.trim())return{state:'wait'};
  let d;txt=txt.replace(/^\uFEFF/,'').trim();
  try{d=JSON.parse(txt)}catch(e){
    const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    try{d=JSON.parse(txt.slice(a,b+1))}catch(e2){return{state:'error',msg:'Not valid JSON'}}
  }
  if(!d||typeof d.shows!=='object'||!Array.isArray(d.order))return{state:'error',msg:'Not a Pod Tracker backup'};
  d=stripPlaceholders(d);
  if(!d.order.length)return{state:'error',msg:'Only sample podcasts in this backup'};
  const shows=d.order.map(id=>d.shows[id]).filter(Boolean);
  const played=shows.reduce((n,sh)=>n+Object.keys(sh.played||{}).length,0);
  return{state:'ok',data:d,msg:`${shows.length} podcast${shows.length===1?'':'s'} · ${played} played`};
}
function mergeImport(d){
  let added=0;
  d.order.forEach(id=>{
    const inc=d.shows[id];if(!inc)return;
    const cur=S.shows[id];
    if(!cur){S.shows[id]=inc;S.order.push(id);added++;return}
    const have=new Set(cur.episodes.map(e=>e.id));
    cur.episodes=cur.episodes.concat((inc.episodes||[]).filter(e=>!have.has(e.id)));
    cur.played={...(inc.played||{}),...cur.played};
    if(inc.edits||cur.edits)cur.edits={...(inc.edits||{}),...(cur.edits||{})};
    if(inc.rename&&!cur.rename)cur.rename=inc.rename;
    if(inc.color&&!cur.color)cur.color=inc.color;
  });
  return added;
}

    return lf==='caught'?(t>0&&p===t):lf==='notstarted'?p===0:(p>0&&p<t)});
  const pct=s=>{const t=totalCount(s);return t?playedCount(s)/t:0};

/* ---------- library cards ---------- */
// how high the check square fills: the first 1% of a show takes 3% of the height (so starting is visible),
// the last 5% takes the top 10% (so the end is visible), and 1–95% spreads over the rest
function fillHeight(f){
  if(f<=0)return 0;
  if(f>=1)return 1;
  if(f<=.01)return f/.01*.03;
  if(f>=.95)return .9+(f-.95)/.05*.1;
  return .03+(f-.01)/.94*.87;
}
const CHK='<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
// an ended show you've finished: two checks stacked, the front one casting a soft shadow onto the back one
const CHK2='<svg class="ck ck2" viewBox="0 0 24 24"><path d="M2.6 12.6l3.9 3.9L14.6 8.2" stroke="#f0cf6e"/>'+
  '<path d="M8.4 12.6l3.9 3.9L20.4 8.2" stroke="rgba(0,0,0,.4)" transform="translate(-.8 .8)"/><path d="M8.4 12.6l3.9 3.9L20.4 8.2"/></svg>';   // gold behind, white in front
function info(sh){const p=playedCount(sh),t=totalCount(sh),f=t?p/t:0;return{p,t,f,left:t-p,done:t>0&&p===t,nx:upNext(sh)}}
const onCard=id=>`data-show="${id}" style="${colorVars(id)}" onclick="openShow('${id}')"`;
const onChk=id=>`onclick="listenNext('${id}',event)"`;

function libCards(shows){
  const go=shows.filter(sh=>upNext(sh)), done=shows.filter(sh=>!upNext(sh));
  let h='';
  const simple=S.libView==='simple';
  if(go.length)h+=go.map(sh=>{
    const {p,t,f,left,nx}=info(sh);
    // simple: one standard 45px card, square art | podcast, episode (one line), guests | square check that fills
    if(simple)return `<div class="oc v5" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell">${esc(nx.title)}</span>${nx.guests.length?`<span class="gu ell">${esc(guestText(nx.guests))}</span>`:''}</div>
      <span class="cks" style="--f:${fillHeight(f)}" onclick="event.stopPropagation()"><button type="button" class="rnd" ${onChk(sh.id)} aria-label="Mark listened">${CHK}</button></span></div>`;
    return `<div class="oc v4" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span>${(()=>{const sg=nx;return sg.guests.length
          ?`<span class="mid"><span class="et one">${esc(sg.title)}</span><span class="gu">${esc(guestText(sg.guests))}</span></span>`
          :`<span class="mid"><span class="et">${esc(sg.title)}</span></span>`})()}
        <span class="mt">${nx.label} · ${fmtDate(nx.date)}${nx.dur?' · '+fmtDur(nx.dur):''} · ${p}/${t} (${left})</span></div>
      <span class="cks" style="--f:${fillHeight(f)}" onclick="event.stopPropagation()"><button type="button" class="rnd" ${onChk(sh.id)} aria-label="Mark listened">${CHK}</button></span></div>`;
  }).join('');
  // caught up: the same card as the others, showing the latest episode; the check square turns gold,
  // its circle takes the podcast's color with a white check
  // caught up on shows still releasing, then a Completed section for ended shows you've finished
  const doneCard=sh=>{
    const {p,t}=info(sh);
    const lt=countedEps(sh).sort((a,b)=>b.date-a.date)[0]||{title:'',guests:[],date:0};
    const lp=lastPlayed(sh);
    const chk=`<span class="cks gold ${sh.ended?'end':''}" aria-label="${sh.ended?'Ended and finished':'Caught up'}"><span class="rnd">${sh.ended?CHK2:CHK}</span></span>`;
    if(simple)return `<div class="oc v5 cu" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell">${esc(lt.title)}</span>${lt.guests.length?`<span class="gu ell">${esc(guestText(lt.guests))}</span>`:''}</div>${chk}</div>`;
    return `<div class="oc v4 cu" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span>${lt.guests.length
          ?`<span class="mid"><span class="et one">${esc(lt.title)}</span><span class="gu">${esc(guestText(lt.guests))}</span></span>`
          :`<span class="mid"><span class="et">${esc(lt.title)}</span></span>`}
        <span class="mt">${sh.ended?'Ended':'Caught up'} · ${fmtDate(lt.date)} · ${p}/${t} (0)${lp?' · '+ago(lp):''}</span></div>${chk}</div>`;
  };
  const cu=done.filter(sh=>!sh.ended), fin=done.filter(sh=>sh.ended);
  if(cu.length)h+='<div class="list-divider"><span>Caught Up</span></div>'+cu.map(doneCard).join('');
  if(fin.length)h+='<div class="list-divider"><span>Completed</span></div>'+fin.map(doneCard).join('');
  return h;
}

/* ---------- Data › Feeds: your own relay, and shows stuck at Apple's list ---------- */
function dtFeeds(){

  $('#app').innerHTML=`
    <div class="dt-card how"><span>Feeds are fetched through public relays. When none can reach a feed,</span>

    <div class="dt-card how"><span>${S.relay?'Your relay is tried alongside the public ones.':'Stuck shows are retried every time you open the app.'}</span></div>

    ${stuck.length?stuck.map(sh=>`<div class="row has-art" style="${colorVars(sh.id)};cursor:default">${artSec(sh.art,sh.id,nm(sh))}
        <div class="main"><span class="t">${esc(nm(sh))}</span><span class="a">${sh.episodes.length} from Apple · ${sh.feedIssue==='unreadable'?'feed loaded but couldn’t be read':sh.feedIssue==='unreachable'?'no relay could reach the feed':'not checked yet, tap Retry'}</span></div>
        <button class="go" type="button" data-retry="${sh.id}">Retry</button></div>`).join('')

async function saveRelay(){

  if(!sh){toast('Relay saved');dtFeeds();return}

async function retryFeeds(ids,btn){

  {n:'Maple',c:'#d9bc8c'},{n:'Oak',c:'#b5874e'},{n:'Olive wood',c:'#a8935e'},{n:'Teak',c:'#8f6436'},{n:'Cherry',c:'#9c5236'},
  {n:'Mahogany',c:'#7a3526'},{n:'Walnut',c:'#5d3f2a'},{n:'Driftwood',c:'#a59d8f'},{n:'Barn wood',c:'#6e6458'},{n:'Ebony',c:'#2f2622'},

const f3rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);

// same lightness) it moves on to the next one, so every show gets its own wood that still reads well
function woodFor(name,color){
  const Lc=f3lum(color),Hc=f3hue(color),start=f3hash(name)%WOODS.length;
  for(let i=0;i<WOODS.length;i++){const w=WOODS[(start+i)%WOODS.length],dl=Math.abs(f3lum(w.c)-Lc),

// wood grain: long straight fibers that drift a little, soft growth bands, fine pores, a few darker lines; low contrast

function rrPath(p,hw,r){   // a square of half-width hw with corner radius r

// the cover as a canvas (WebGL can only use an image the site may read): straight from its host when allowed,

  if(F3.covers[sh.id])return F3.covers[sh.id];

  const draw=im=>{const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,k=Math.max(S/w,S/h);g.drawImage(im,(S-w*k)/2,(S-h*k)/2,w*k,h*k)};

      ...PUBLIC_RELAYS.filter(r=>r[2]==='text').map(async([,mk])=>{const r=await fetch(mk(encodeURIComponent(sh.art)),{signal:ctl.signal});
        if(!r.ok)throw 0;const b=await r.blob();if(!/^image\//.test(b.type)&&b.size<500)throw 0;return loadImg(URL.createObjectURL(b))})])}
    catch(e){im=null}finally{clearTimeout(timer);ctl.abort()}

function f3init(){

  F3.renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});F3.renderer.setPixelRatio(window.devicePixelRatio||1);
  F3.scene=new THREE.Scene();F3.camera=new THREE.PerspectiveCamera(F3_FOV,1,.1,100);F3.camera.position.set(0,0,F3_CAMZ);
  const amb=new THREE.AmbientLight(0xffffff,.62),key=new THREE.DirectionalLight(0xffffff,.75),fill=new THREE.DirectionalLight(0xfff2e0,.28);
  key.position.set(3,4,6);fill.position.set(-4,-2,3);F3.scene.add(amb,key,fill);
  // swipe to spin (momentum) / tilt (holds) / tap to put it back
  let drag=false,moved=false,lx=0,ly=0;
  canvas.addEventListener('pointerdown',e=>{if(F3.phase!=='open')return;drag=true;moved=false;lx=e.clientX;ly=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
  canvas.addEventListener('pointermove',e=>{if(!drag||F3.phase!=='open')return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    if(dx){F3.rot+=dx*.008;F3.vel=dx*.008}

  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  addEventListener('resize',()=>{if(F3.phase!=='idle')f3size()});
}
function f3size(){F3.renderer.setSize(innerWidth,innerHeight,true);F3.camera.aspect=innerWidth/innerHeight;F3.camera.updateProjectionMatrix()}
const f3unit=()=>2*F3_CAMZ*Math.tan(F3_FOV/2*Math.PI/180)/innerHeight;
// the frame, 1 unit wide. setMorph(0) = the cover card exactly; setMorph(1) = the framed photo
function buildFrame3d(sh,cover){
  const g=new THREE.Group(),D=.09,BEV=.012,color=cloth(sh.id),wood=woodFor(nm(sh),/^#[0-9a-f]{6}$/i.test(color)?color:'#555555');
  const woodMat=new THREE.MeshPhongMaterial({color:0x000000,specular:0x1c1812,shininess:18});

  const FWF=.085,INF=.5-FWF,RB=.008;

  for(let i=0;i<4;i++){const t=base.clone();t.needsUpdate=true;t.repeat.set(1.1,1.1);t.offset.set(i*.27,i*.31);
    const m=new THREE.Mesh(railGeo,new THREE.MeshPhongMaterial({map:t,color:0xd2d2d2,specular:0x1c1812,shininess:18}));m.rotation.z=i*Math.PI/2;rails.add(m);}
  const mat=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshLambertMaterial({color:0xf3eee3}));mat.position.z=D/2-.03;g.add(mat);
  const tex=new THREE.CanvasTexture(cover);tex.anisotropy=8;
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshLambertMaterial({map:tex,color:0xb4b4b4}));pic.position.z=D/2-.029;g.add(pic);   // toned to match the card, lit face-on
  const edge=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0}));edge.position.z=D/2-.0295;g.add(edge);
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,opacity:.06,specular:0xffffff,shininess:90}));glass.position.z=D/2-.016;g.add(glass);

      geo.translate(0,0,-(D-bev*2)/2-bev);mould.geometry.dispose();mould.geometry=geo;
      back.geometry.dispose();back.geometry=new THREE.ShapeGeometry(rrPath(new THREE.Shape(),.49,Math.max(0,R-.01)),k<1?6:2);
      woodMat.color.copy(black).lerp(tone,k);
      const sq=k>=.999;mould.visible=!sq;rails.visible=sq;
    }

async function openFrame3d(sh,card){

  let cover;try{cover=await coverCanvas(sh)}catch(e){F3.busy=false;return}
  if(view.name!=='show'||view.id!==sh.id||view.edit){F3.busy=false;return}   // moved on while it loaded

  $('#f3-back').classList.remove('quick');$('#f3-back').classList.add('on');card.classList.add('lifted');

function closeFrame3d(){

function removeTag(sh,k){           // its episodes go back to the feed's tag
  if(!sh.tags||!sh.tags[k])return;delete sh.tags[k];if(!Object.keys(sh.tags).length)delete sh.tags;
  if(sh.edits)for(const id in sh.edits)if(sh.edits[id].tag===k)setEdit(sh,id,'tag',null);
  if(sh.skipTags){sh.skipTags=sh.skipTags.filter(x=>x!==k);if(!sh.skipTags.length)delete sh.skipTags}
  save();
}
/* ---------- tags window (from an episode's +): the permanent tags, this podcast's own, and a box to add one.
   Tapping a tag puts it on that episode and closes the window ---------- */
const TAG_INFO={main:'Full episodes · from the feed',bonus:'Bonus episodes · from the feed',promo:'Trailers and promos · from the feed'};
function openTagPage(epId){view.tagEp=epId;paintTagPage();$('#tg-page').hidden=false;$('#tg-page').scrollTop=0}
function closeTagPage(){$('#tg-page').hidden=true;view.tagEp=null;renderEpisodes()}
function paintTagPage(){
  const sh=S.shows[view.id];if(!sh)return;
  const cur=(eps(sh).find(e=>e.id===view.tagEp)||{}).tag;
  const counts={};eps(sh).forEach(e=>counts[e.tag]=(counts[e.tag]||0)+1);
  const n=k=>counts[k]?`${counts[k]} episode${counts[k]>1?'s':''}`:'No episodes yet';
  const own=Object.entries(sh.tags||{});
  $('#tg-body').innerHTML=`<div class="list-divider"><span>Permanent tags</span></div>
    ${Object.entries(TAGS).map(([k,v])=>`<button type="button" class="so-opt ${cur===k?'on':''}" data-tag="${k}"><b>${v}</b><span>${TAG_INFO[k]} · ${n(k)}</span></button>`).join('')}
    <div class="list-divider"><span>This podcast’s tags</span></div>
    ${own.length?own.map(([k,v])=>`<div class="tg-row"><button type="button" class="so-opt ${cur===k?'on':''}" data-tag="${esc(k)}"><b>${esc(v)}</b><span>${n(k)}</span></button><button type="button" class="tg-del" data-del="${esc(k)}" aria-label="Remove ${esc(v)}">×</button></div>`).join('')
      :'<div class="tg-none">None yet. Add one below.</div>'}
    <div class="tg-add"><input id="tg-new" placeholder="New tag name" maxlength="20" enterkeyhint="done" aria-label="New tag name"><button type="button" id="tg-addbtn">Add</button></div>`;
}
$('#tg-page').addEventListener('click',e=>{
  const sh=S.shows[view.id];if(!sh)return;
  if(e.target.closest('#tg-back')){closeTagPage();return}
  const del=e.target.closest('[data-del]');if(del){removeTag(sh,del.dataset.del);paintTagPage();return}
  if(e.target.closest('#tg-addbtn')){const inp=$('#tg-new');if(addTag(sh,inp.value))paintTagPage();else inp.focus();return}
  const t=e.target.closest('.so-opt[data-tag]');if(t){if(view.tagEp)setEdit(sh,view.tagEp,'tag',t.dataset.tag);closeTagPage()}
});
$('#tg-page').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tg-new'){e.preventDefault();$('#tg-addbtn').click()}});
function addTag(sh,name){             // returns the tag's id; a name you already have reuses that tag
  name=name.trim().replace(/\s+/g,' ').slice(0,20);if(!name)return null;
  const all=tagsOf(sh);for(const k in all)if(all[k].toLowerCase()===name.toLowerCase())return k;
  sh.tags=sh.tags||{};let id='t'+Date.now().toString(36);for(let i=2;all[id];i++)id='t'+Date.now().toString(36)+i;sh.tags[id]=name;save();return id;
}
// the widest tag's natural width, so every tag cell can share it (rows wrap when they run out of room)
// measured on an invisible copy taken out of the page flow, so the real list never shifts (no jumping while you type)
function tagWidth(box){
  if(!box||!box.children.length)return 0;
  const c=box.cloneNode(true);c.removeAttribute('id');c.classList.add('tag-measure');c.setAttribute('aria-hidden','true');
  c.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;width:auto;height:auto;pointer-events:none';
  box.parentNode.appendChild(c);
  let w=0;for(const x of c.children)w=Math.max(w,x.getBoundingClientRect().width);
  c.remove();
  return Math.ceil(w);
}
function fitTags(){
  const tt=$('#tagtabs');if(tt)tt.style.setProperty('--tw',tagWidth(tt)+'px');
  const eg=$('#eps .ee-tag');
  if(eg){const tw=tagWidth(eg),W=eg.clientWidth,per=Math.max(1,Math.floor((W+3)/(tw+3)));
    $('#eps').style.setProperty('--tw',tw+'px');
    $('#eps').classList.toggle('half',eg.children.length>per)}
}
let fitW=innerWidth;   // only a change in width refits: the phone keyboard opening only changes the height
window.addEventListener('resize',()=>{if(innerWidth!==fitW){fitW=innerWidth;fitTags()}});
function renderTagTabs(all){
  const wrap=$('#tagtabs-wrap');if(!wrap)return;
  const counts={};all.forEach(e=>counts[e.tag]=(counts[e.tag]||0)+1);
  const T=tagsOf(S.shows[view.id]);const used=Object.keys(T).filter(k=>counts[k]);
  // tabs appear once anything is tagged other than Main
  if(!used.some(k=>k!=='main')){wrap.innerHTML='';view.tag='all';return}
  if(view.tag!=='all'&&!counts[view.tag])view.tag='all';
  wrap.innerHTML=`<div class="tabs tagtabs" id="tagtabs"><div class="tab ${view.tag==='all'?'active':''}" data-tag="all">All<b>${all.length}</b></div>${
    used.map(k=>`<div class="tab ${view.tag===k?'active':''}" data-tag="${k}">${esc(T[k])}<b>${counts[k]}</b></div>`).join('')}</div>`;
  fitTags();
  $('#tagtabs').onclick=e=>{const t=e.target.closest('[data-tag]');if(!t)return;view.tag=t.dataset.tag;renderEpisodes()};
}
function renderEpisodes(){
  const sh=S.shows[view.id];const el=$('#eps');if(!sh||!el)return;
  const all=eps(sh);
  if(view.edit){   // editing: every episode, newest or oldest first as last sorted, no filters
    const list=all.sort((a,b)=>view.sort==='new'?b.date-a.date:a.date-b.date);
    el.innerHTML=list.map(e=>`<div class="ep-ed ${e.edited?'edited':''}" data-id="${esc(e.id)}">
      <div class="ee-top"><input class="ee-title" value="${esc(e.title)}" aria-label="Episode title" enterkeyhint="done"></div>
      <label class="ee-guest"><span>with</span><input class="ee-guests" value="${esc(guestJoin(e.guests))}" placeholder="no guests" aria-label="Guests" enterkeyhint="done"></label>
      <div class="ee-bot"><input type="date" class="ee-date" value="${toDay(e.date)}" aria-label="Release date">
        <div class="ee-len" aria-label="Length">${twHTML(e.dur||0)}</div></div>
      <div class="ee-tagrow"><div class="seg ee-tag">${Object.entries(tagsOf(sh)).map(([k,v])=>`<button type="button" data-tag="${esc(k)}" class="${e.tag===k?'on':''}">${esc(v)}</button>`).join('')}</div>
        <button type="button" class="ee-addtag" title="Add a new tag" aria-label="Add a new tag">+</button></div></div>`).join('');
    fitTags();
    return;
  }
  renderTagTabs(all);
  const q=view.q.trim().toLowerCase();
  const list=all.filter(e=>{
    const d=!!sh.played[e.id];
    if(view.filter==='played'&&!d)return false;
    if(view.filter==='unplayed'&&d)return false;
    if(view.tag&&view.tag!=='all'&&e.tag!==view.tag)return false;
    return !q||(e.title+' '+e.guests.join(' ')).toLowerCase().includes(q);
  }).sort((a,b)=>view.sort==='new'?b.date-a.date:a.date-b.date);
  if(!list.length){el.innerHTML='<div class="empty">Nothing here.</div>';return}
  // each card's number, by release date (oldest first), whatever numbering the feed uses:
  // Main episodes count 1, 2, 3 …; a Bonus after Main 4 is 4.1, 4.2 …; a Promo after it is 4.a, 4.b … (before Main 1: 0.1, 0.a)
  const pos={};let m=0,nb=0,np=0;
  const letters=n=>{let t='';for(;n>0;n=Math.floor((n-1)/26))t=String.fromCharCode(97+(n-1)%26)+t;return t};   // 1→a … 26→z, 27→aa
  all.slice().sort((a,b)=>a.date-b.date).forEach(e=>{
    if(e.tag==='main'){m++;nb=0;np=0;pos[e.id]=String(m)}
    else if(e.tag==='promo')pos[e.id]=`${m}.${letters(++np)}`;
    else pos[e.id]=`${m}.${++nb}`;               // Bonus, and any tag you've added
  });
  el.innerHTML=list.map(e=>`<div class="row ep ${sh.played[e.id]?'done':''} ${e.guests.length?'has-g':''}" data-id="${esc(e.id)}">
    <div class="ep-num ${pos[e.id].length>6?'xlong':pos[e.id].length>4?'long':''}">${pos[e.id]}</div>
    ${(()=>{const sg=e;return `<div class="main"><span class="t">${esc(sg.title)}</span>${sg.guests.length?`<span class="a">${esc(guestText(sg.guests))}</span>`:''}<span class="a">${e.tag!=='main'?`<span class="tagpill">${esc(tagsOf(sh)[e.tag]||'')}</span>`:''}${fmtDate(e.date)}${e.dur?' · '+fmtDur(e.dur):''}</span></div>`})()}
    <button class="thru" title="Mark this and every older episode played">≤</button></div>`).join('');
}
/* ---------- length wheels: hours (0–99, stops at the ends), minutes and seconds (0–59, wrap round) ---------- */
const TW_ROW=16,TW_TOP=6;                      // row height; where the middle row sits in the 28px window
const twMod=(a,n)=>((a%n)+n)%n;
const twWrap=k=>k>0;
const twText=(k,i)=>twWrap(k)?String(twMod(i,60)).padStart(2,'0'):(i>=0&&i<=99?String(i).padStart(2,'0'):'');
function twRows(k,pos){
  const c=Math.round(pos);let h='';
  for(let i=0;i<7;i++){const idx=c-3+i;
    h+=`<div style="transform:translateY(${(TW_TOP+(idx-pos)*TW_ROW).toFixed(2)}px);opacity:${(1-Math.min(1,Math.abs(idx-pos))*.7).toFixed(2)}">${twText(k,idx)}</div>`}
  return h;
}
function twHTML(secs){
  const v=[Math.min(99,Math.floor(secs/3600)),Math.floor(secs%3600/60),Math.round(secs%60)%60];
  return v.map((x,k)=>`<div class="tw-wheel" data-k="${k}" data-v="${x}">${twRows(k,x)}<span>${'HMS'[k]}</span></div>`).join('');
}
function twPaint(w,pos){
  const k=+w.dataset.k,c=Math.round(pos),rows=w.querySelectorAll('div');
  if(w._c!==undefined&&w._c!==c){try{navigator.vibrate&&navigator.vibrate(4)}catch(_){}}
  w._c=c;
  rows.forEach((row,i)=>{const idx=c-3+i,t=twText(k,idx);
    if(row._t!==t){row.textContent=t;row._t=t}
    row.style.transform=`translateY(${(TW_TOP+(idx-pos)*TW_ROW).toFixed(2)}px)`;
    row.style.opacity=(1-Math.min(1,Math.abs(idx-pos))*.7).toFixed(2);});
}
// a wheel has settled: save the episode's length and mark the card edited (no re-render, so nothing jumps)
function twSave(w){
  const box=w.closest('.ep-ed'),sh=S.shows[view.id];if(!box||!sh)return;
  const v=[...box.querySelectorAll('.tw-wheel')].map(x=>+x.dataset.v);
  setEdit(sh,box.dataset.id,'dur',v[0]*3600+v[1]*60+v[2]);
  const on=!!(sh.edits&&sh.edits[box.dataset.id]);
  box.classList.toggle('edited',on);
}
function twSettle(w,pos,vel){
  const k=+w.dataset.k;cancelAnimationFrame(w._af);
  const clamp=p=>twWrap(k)?p:Math.max(0,Math.min(99,p));
  let last=null;
  const glide=ts=>{                              // a flick keeps it rolling, slowing down
    if(last===null){last=ts;w._af=requestAnimationFrame(glide);return}
    const dt=Math.min(.04,(ts-last)/1000);last=ts;
    const np=pos+vel*dt;vel*=Math.exp(-5*dt);
    if(!twWrap(k)&&(np<0||np>99)){pos=clamp(np);vel=0}else pos=np;   // hours stop dead at 0 or 99
    twPaint(w,pos);
    if(Math.abs(vel)<2)snap();else w._af=requestAnimationFrame(glide);
  };
  const snap=()=>{                               // then eases onto the nearest number
    const from=pos,to=clamp(Math.round(pos));let st=null;
    const f=ts=>{if(st===null)st=ts;const t=Math.min(1,(ts-st)/110);
      pos=from+(to-from)*(1-Math.pow(1-t,3));twPaint(w,pos);
      if(t<1)w._af=requestAnimationFrame(f);
      else{const v=twWrap(k)?twMod(to,60):to;w.dataset.v=v;w._pos=v;twPaint(w,v);twSave(w)}};
    w._af=requestAnimationFrame(f);
  };
  if(Math.abs(vel)<2)snap();else w._af=requestAnimationFrame(glide);
}
$('#app').addEventListener('pointerdown',e=>{
  const w=e.target.closest('.tw-wheel');if(!w||view.name!=='show'||!view.edit)return;
  cancelAnimationFrame(w._af);e.preventDefault();
  const k=+w.dataset.k,start=w._pos!=null?w._pos:+w.dataset.v,y0=e.clientY;let pos=start;
  const samples=[{t:e.timeStamp,y:e.clientY}];
  try{w.setPointerCapture(e.pointerId)}catch(_){}
  const move=ev=>{pos=start-(ev.clientY-y0)/TW_ROW;if(!twWrap(k))pos=Math.max(0,Math.min(99,pos));twPaint(w,pos);
    samples.push({t:ev.timeStamp,y:ev.clientY});while(samples.length>1&&ev.timeStamp-samples[0].t>100)samples.shift()};
  const up=()=>{w.removeEventListener('pointermove',move);w.removeEventListener('pointerup',up);w.removeEventListener('pointercancel',up);
    const a=samples[0],b=samples[samples.length-1];
    const vel=b.t>a.t?-((b.y-a.y)/(b.t-a.t))*1000/TW_ROW:0;twSettle(w,pos,vel)};
  w.addEventListener('pointermove',move);w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
});
$('#app').addEventListener('wheel',e=>{           // mouse wheel: one notch at a time
  const w=e.target.closest('.tw-wheel');if(!w||view.name!=='show'||!view.edit)return;
  e.preventDefault();cancelAnimationFrame(w._af);
  const p=(w._pos!=null?w._pos:+w.dataset.v)+(e.deltaY>0?1:-1);twSettle(w,p,0);
},{passive:false});
// edit mode: save as you go. A title saves when you leave the box, a date when it's picked, a tag when tapped
$('#app').addEventListener('change',e=>{
  const box=e.target.closest('.ep-ed');if(!box||view.name!=='show')return;
  const sh=S.shows[view.id],id=box.dataset.id,orig=sh.episodes.find(x=>x.id===id);if(!orig)return;
  if(e.target.classList.contains('ee-title'))setEdit(sh,id,'title',e.target.value.trim());
  if(e.target.classList.contains('ee-guests'))setEdit(sh,id,'guests',guestJoin(guestParse(e.target.value)));
  if(e.target.classList.contains('ee-date')){
    const v=e.target.value;
    if(!v)setEdit(sh,id,'date',null);
    else if(v===toDay(orig.date))setEdit(sh,id,'date',orig.date);          // same day as the feed: keep the feed's exact time
    else{const [y,m,d]=v.split('-').map(Number);setEdit(sh,id,'date',new Date(y,m-1,d,12).getTime())}
  }
  renderEpisodes();
});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&(e.target.classList.contains('ee-title')||e.target.classList.contains('ee-guests')))e.target.blur()});
$('#app').addEventListener('click',e=>{
  const box=e.target.closest('.ep-ed');if(!box||view.name!=='show')return;
  const sh=S.shows[view.id],id=box.dataset.id;
  const t=e.target.closest('.ee-tag [data-tag]');
  if(t){setEdit(sh,id,'tag',t.dataset.tag);renderEpisodes();return}
  if(e.target.closest('.ee-addtag')){openTagPage(id);return}   // + : the tags window
});
$('#app').addEventListener('click',e=>{
  const row=e.target.closest('.ep');if(!row||view.name!=='show')return;
  if(e.target.closest('.thru'))playedThrough(row.dataset.id);
  else toggleEp(row.dataset.id);
});

load();syncPlaceholders();render();window.__ptStarted=true;checkBackup();autoRefresh();

/* ---------- offline: the service worker keeps a copy of the app (only when served over http/https, e.g. GitHub Pages) ---------- */
try{
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    const reg=()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}};
    if(document.readyState==='complete')reg();else window.addEventListener('load',reg);
  }
}catch(e){}   // some editor previews don't allow it at all; the app works the same without it
</script>
