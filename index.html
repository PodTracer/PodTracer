<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pod Tracer</title>
<!-- installable, works offline: manifest + icons + service worker (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Pod Tracer">
<meta name="description" content="Track the podcast episodes you've listened to.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#efeadf; --wood:#8a6a4f; --ink:#2b2620; --muted:#8a8378;
    --panel:#ffffff; --unread:#e3ddce; --red:#aa3333; --line:#000;
    --lines:repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 4px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); min-height:100vh;
    padding:calc(var(--header-h,50px) + 4px) 4px calc(var(--footer-h,0px) + 4px);}
  button,input{font:inherit; color:inherit;}
  button{cursor:pointer;}
  #app{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:4px;}

  /* ---- frozen header: page tabs edge to edge, then a row of controls ---- */
  #app-header{position:fixed; top:0; left:0; right:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:0 0 4px; background:var(--bg); border-bottom:3px solid #000;}
  #app-header.bare{padding-bottom:0;}
  #tabs{display:flex; padding-top:env(safe-area-inset-top); border-bottom:3px solid #000;}
  #app-header.bare #tabs{border-bottom:none;}
  #tabs .tab{flex:1 1 0; height:42px; display:flex; align-items:center; justify-content:center; background:var(--bg);
    font-family:Arial,sans-serif; font-size:.85rem; font-weight:600; letter-spacing:.3px; cursor:pointer; user-select:none;}
  #tabs .tab + .tab{border-left:3px solid #000;}
  #tabs .tab.active{background:var(--ink); color:#fff;}
  #tabs[hidden]{display:none;}
  /* a show's own window: Back | name | Edit, like Stack Tracker's page headers */
  #ttl-bar{display:flex; padding-top:env(safe-area-inset-top); border-bottom:3px solid #000;}
  #ttl-bar[hidden]{display:none;}
  #app-header.bare #ttl-bar{border-bottom:none;}   /* nothing under the bar (edit mode): one line, not two */
  #ttl-bar button{flex:0 0 25%; height:42px; margin:0; padding:0 2px; border:0; border-radius:0; background:var(--ink); color:#fff;
    font:600 .85rem Arial,sans-serif; letter-spacing:.3px; cursor:pointer;}
  #ttl-bar button:active{filter:brightness(1.3);}
  #ttl-bar #tb-edit.on{background:#5b6633;}
  #ttl-bar #tb-back.cancel{background:var(--red);}
  #ttl-bar #tb-edit.blank{display:none;}           /* Add Podcast: no right-hand button */
  #ttl-bar:has(#tb-edit.blank) h2{border-right:none; padding-right:calc(25% + 11px);}   /* no right button: pad by Back's width so the title centers on the whole window */
  /* header text in capitals: the Library/Data tabs and the Back | title | Edit bar */
  #tabs .tab, #ttl-bar button, #ttl-bar h2{text-transform:uppercase; letter-spacing:.6px;}
  #ttl-bar h2{flex:1; min-width:0; margin:0; height:42px; padding:0 8px; background:#d9d0be; text-align:center;
    border-left:3px solid #000; border-right:3px solid #000; font:600 .95rem/42px Georgia,serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* tag tabs in a show: All, then each tag in use */
  .tabs.tagtabs{height:45px; flex:none;}
  /* search + sort/filter card (second header row of a show's window), like Stack Tracker's */
  #sf-card{flex:1; position:relative; display:flex; align-items:center; justify-content:center; gap:5px; height:45px; padding:0 40px;
    border:3px solid #000; border-radius:8px; cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden;
    --l:var(--panel); --r:var(--panel);
    background:linear-gradient(to right, var(--l) 0 39px, var(--panel) 39px calc(100% - 39px), var(--r) calc(100% - 39px)) border-box;
    font:700 min(.74rem,2.95vw) Arial,sans-serif; text-transform:uppercase;}
  #sf-card .sk{color:var(--muted);} #sf-card .sv{color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
  #sf-card .sl{display:flex; gap:5px; min-width:0;}
  /* a show's second header row: still 45px. A 45px photo square on the left; beside it two thin 21px cards, stacked
     (name and publisher on top, search + sort/filter below), like Stack Tracker's two-row header */
  .hdr-row.show-row{height:45px;}
  .photo-card{flex:none; width:45px; height:45px; position:relative; border-radius:8px; overflow:hidden; background:var(--unread);}
  .photo-card::after{content:''; position:absolute; inset:0; border:3px solid #000; border-radius:8px; pointer-events:none;}   /* border drawn over the art */
  .photo-card .art-sec{width:100%; height:100%; border-right:0;}
  .show-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .title-card{height:21px; display:flex; align-items:center; justify-content:center; gap:5px; padding:0 8px; background:var(--panel); border:3px solid #000; border-radius:6px;
    white-space:nowrap; overflow:hidden;}
  .title-card .t{min-width:0; max-width:100%; font:700 .72rem/1 Georgia,serif; letter-spacing:.5px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis;}   /* just the name, centered, in capitals */
  .title-card .a{min-width:0; font:.6rem/1 Arial,sans-serif; color:rgba(43,38,32,.7); overflow:hidden; text-overflow:ellipsis;}
  #sf-card.compact{flex:none; height:21px; border-radius:6px; padding:0 30px; gap:4px; font-size:min(.6rem,2.5vw); line-height:1;
    background:linear-gradient(to right, var(--l) 0 27px, var(--panel) 27px calc(100% - 27px), var(--r) calc(100% - 27px)) border-box;}
  #sf-card.compact .sl{gap:4px;}
  #sf-card.compact #sf-search, #sf-card.compact #sf-close{width:24px;}
  #sf-card.compact #sf-search svg, #sf-card.compact #sf-close svg{width:11px; height:11px;}
  #sf-card.compact #sfq{left:24px; right:24px; padding:0 6px; font-size:.74rem;}
  #sf-search, #sf-close{position:absolute; top:0; bottom:0; width:36px; display:flex; align-items:center; justify-content:center;}
  #sf-search{left:0; border-right:3px solid #000;} #sf-close{right:0; border-left:3px solid #000; display:none;}
  #sf-search svg, #sf-close svg{width:16px; height:16px; display:block;}
  #sfq{position:absolute; left:36px; right:36px; top:0; bottom:0; display:none; margin:0; padding:0 8px; border:0; outline:0; background:transparent;
    font:600 .9rem Georgia,serif; text-transform:none;}
  #sf-card.searching{--l:var(--ink); --r:#7a2f2b; cursor:text;}
  #sf-card.searching .sk, #sf-card.searching .sv{visibility:hidden;}
  #sf-card.searching #sf-search svg{stroke:#fff;}
  #sf-card.searching #sf-close{display:flex;}
  #sf-card.searching #sfq{display:block;}
  /* the Sort and Filter page */
  #so-page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;}
  #so-page[hidden]{display:none;}
  /* the cover lifted out as a framed photo (3D) */
  #f3-back{position:fixed; inset:0; z-index:30; background:rgba(20,16,12,.45); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity 1050ms cubic-bezier(.37,0,.63,1), visibility 0s linear 1050ms;}
  #f3-back.on{opacity:1; visibility:visible; transition:opacity 1050ms cubic-bezier(.37,0,.63,1), visibility 0s;}
  #f3-back.quick{transition-duration:780ms, 0s;}
  #f3-canvas{position:fixed; inset:0; width:100%; height:100%; z-index:31; display:none; touch-action:none; cursor:pointer;}
  #f3-canvas.on{display:block;}
  body.f3-open{overflow:hidden; touch-action:none;}
  .photo-card{cursor:pointer;} .photo-card.lifted{visibility:hidden;}
  .gear-card{flex:none; width:45px; height:45px; margin:0; padding:5px; box-sizing:border-box; border:3px solid #000; border-radius:8px; background:var(--panel); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .gear-card svg{width:100%; height:100%; display:block; transition:transform .25s;}
  .gear-card:active svg{transform:rotate(30deg);}
  #st-page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;}
  #st-page[hidden]{display:none;}
  #st-body{display:flex; flex-direction:column; gap:4px; padding:4px 4px calc(16px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;}
  /* the show: cover square, name, publisher */
  .sr-show{display:flex; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:#fff;}
  .sr-show .art-sec{width:42px;}
  .sr-show .tx{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; padding:0 10px; gap:2px;}
  .sr-show b{font:700 .8rem/1.1 Georgia,serif; letter-spacing:.4px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sr-show small{font:700 .56rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* one framed list, sections marked by thin tan strips */
  .sr-list{border:3px solid #000; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; gap:3px; background:#000;}
  .sr-sec{height:22px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; background:#d9d0be;
    font:700 .56rem Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; color:var(--ink);}
  .sr-sec span{color:rgba(43,38,32,.6);}
  /* progress: the count centered above a full-width bar in the podcast's color */
  .sr-prog{display:flex; flex-direction:column; justify-content:center; gap:5px; padding:8px 10px 10px; background:#fff;}
  .sr-prog .n{text-align:center; font:700 .6rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
  .sr-prog .n b{color:var(--ink);}
  .sr-prog .track{display:block; width:100%; height:12px; border:2px solid #000; border-radius:6px; background:var(--unread); overflow:hidden;}
  .sr-prog .sr-fill{display:block; height:100%; background:var(--cloth); transition:width .35s ease;}
  /* every row: text on the left, a square on the right */
  .sr-row{display:flex; align-items:stretch; min-height:45px; margin:0; padding:0; border:0; border-radius:0; background:#fff; width:100%; text-align:left; cursor:pointer; color:var(--ink); transition:background .15s;}
  .sr-row .tx{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:0 10px;}
  .sr-row b{font:600 .88rem/1.1 Georgia,serif;} .sr-row small{font:.62rem/1.2 Arial,sans-serif; color:var(--muted);}
  .sr-sq{flex:none; width:48px; display:grid; place-items:center; border-left:3px solid #000; background:var(--unread); transition:background .2s;}
  .sr-sq svg{width:20px; height:20px; fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
  /* check rows: an empty square; on, the podcast's color behind the check circle (only a just-tapped one pops in) */
  .sr-row.on .sr-sq{background:var(--cloth);}
  .sr-rnd{width:28px; height:28px; display:grid; place-items:center; border:3px solid #000; border-radius:50%; background:#fff;}
  .sr-rnd svg{width:14px; height:14px; stroke-width:3.4;}
  .sr-row.live .sr-rnd{animation:srpop .22s ease;}
  @keyframes srpop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}
  /* two-tap: the first tap turns the row red and asks, the second does it */
  .sr-row.armed{background:var(--red);} .sr-row.armed b,.sr-row.armed small{color:#fff;} .sr-row.armed .sr-sq{background:#7f2424;} .sr-row.armed .sr-sq svg{stroke:#fff;}
  .sr-row.danger b{color:var(--red);} .sr-row.danger .sr-sq svg{stroke:var(--red);} .sr-row.danger.armed b{color:#fff;} .sr-row.danger.armed .sr-sq svg{stroke:#fff;}
  .sr-row.busy .sr-sq svg{transform-origin:50% 50%; animation:srspin .9s linear infinite;} @keyframes srspin{to{transform:rotate(360deg)}}
  #tg-page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;}
  #tg-page[hidden]{display:none;}
  #tg-body{display:flex; flex-direction:column; gap:4px; padding:4px 4px calc(16px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto;}
  .tg-row{display:flex; gap:4px;} .tg-row .so-opt{flex:1; min-width:0;}
  .tg-del{flex:0 0 45px; height:45px; margin:0; padding:0; box-sizing:border-box; border:3px solid #000; border-radius:8px; background:#fff; color:var(--red); font:700 1.3rem/1 Arial,sans-serif; cursor:pointer;}
  .tg-none{height:45px; display:flex; align-items:center; justify-content:center; box-sizing:border-box; border:3px dashed rgba(0,0,0,.35); border-radius:8px; font:.72rem Arial,sans-serif; color:var(--muted);}
  .tg-add{display:flex; gap:4px; height:45px; margin-top:8px;}
  #tg-new{flex:1; min-width:0; box-sizing:border-box; border:3px solid #000; border-radius:8px; padding:0 10px; background:#fff; font:600 .9rem Arial,sans-serif; outline:none;}
  #tg-addbtn{flex:0 0 25%; margin:0; padding:0; box-sizing:border-box; border:3px solid #000; border-radius:8px; background:var(--ink); color:#fff; font:700 .8rem Arial,sans-serif; text-transform:uppercase; letter-spacing:.5px; cursor:pointer;}
  .so-head{position:sticky; top:0; z-index:1; display:flex; padding-top:env(safe-area-inset-top); background:var(--bg); border-bottom:3px solid #000;}
  .so-head button{flex:0 0 25%; height:42px; margin:0; border:0; border-radius:0; background:var(--ink); color:#fff; cursor:pointer;
    font:600 .85rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase;}
  .so-head h2{flex:1; min-width:0; margin:0; height:42px; padding:0 calc(25% + 11px) 0 8px; background:#d9d0be; border-left:3px solid #000;
    text-align:center; font:600 .95rem/42px Georgia,serif; letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #so-body{display:flex; flex-direction:column; gap:4px; padding:4px 4px calc(16px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto;}
  .so-opt{display:flex; flex-direction:column; justify-content:center; gap:2px; height:45px; margin:0; padding:0 10px; text-align:left;
    background:var(--panel); border:3px solid #000; border-radius:8px; cursor:pointer; line-height:1.15;}
  .so-opt b{font:600 .9rem Georgia,serif; color:var(--ink);} .so-opt span{font:.62rem Arial,sans-serif; color:var(--muted);}
  .so-opt.on{background:var(--ink);} .so-opt.on b{color:#fff;} .so-opt.on span{color:#cfc8ba;}
  /* the show window's episodes sit in one wrapper card; tag tabs, when there are any, are its top strip */
  .ep-wrap{display:flex; flex-direction:column; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--unread);}
  .ep-wrap .tabs.tagtabs{height:24px; border:0; border-bottom:3px solid #000; border-radius:0;}   /* a thin strip: half the old height */
  .ep-wrap .tagtabs .tab{font-size:min(.66rem,2.7vw); line-height:1;}
  /* tags that don't fit start a new row; every tab in a row is the same width (sized to the longest tag) */
  .ep-wrap .tabs.tagtabs{height:auto; flex-wrap:wrap;}
  .ep-wrap .tagtabs .tab{flex:1 1 var(--tw,0px); height:21px; box-sizing:border-box; padding:0 6px; white-space:nowrap;}
  .tag-measure > *{flex:none !important;}
  .ep-list{display:flex; flex-direction:column; gap:4px; padding:4px;}
  .ep-list .empty{padding:24px 12px;}
  .tagtabs .tab b{font-weight:400; opacity:.7; margin-left:5px;}
  .tagpill{display:inline-block; padding:0 5px; margin-right:5px; border:1.5px solid currentColor; border-radius:4px; font:700 .54rem/1.5 Arial,sans-serif;
    letter-spacing:.4px; text-transform:uppercase; vertical-align:1px;}
  .ep.done .tagpill{color:rgba(255,255,255,.85);}
  /* edit mode: each episode becomes a small form */
  .ep-ed{display:flex; flex-direction:row; gap:4px; padding:4px; background:color-mix(in srgb, var(--cloth) 50%, transparent); border:3px solid #000; border-radius:8px;}   /* edit cards: the podcast's color at half opacity */
  /* edit footer: the parts of an episode card, each one on or off for every card */
  .ed-fields{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px;}   /* two rows of three, all the same width */
  .ed-fields button{height:24px; margin:0; padding:0 4px; box-sizing:border-box; border:3px solid #000; border-radius:6px; background:#fff; color:var(--muted);
    font:700 min(.66rem, 2.7vw)/1 Arial,sans-serif; letter-spacing:.3px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
  .ed-fields button.on{background:var(--cloth); color:#fff;}
  /* a part turned off disappears from every card; the other half of a pair then takes the whole row */
  #eps.x-title .ee-top, #eps.x-guests .ee-body > .ee-guest, #eps.x-tags .ee-tagrow, #eps.x-date .ee-date, #eps.x-time .ee-len,
  #eps.x-se .ee-se, #eps.x-date.x-time .ee-bot{display:none;}
  #eps.x-date .ee-bot, #eps.x-time .ee-bot{grid-template-columns:minmax(0,1fr);}
  .ee-body{justify-content:center;} .ep-ed{min-height:var(--edmin,46px);}   /* with nearly everything off, every card keeps room for the longest number (all the same height) */
  .ed-chunk{display:flex; flex-direction:column; gap:4px; flex:none;}   /* a group of 20 edit cards (or an empty spacer of their height) */
  .ee-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .ee-no{flex:none; width:27px; margin:-4px 0 -4px -4px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; background:var(--cloth); border-right:3px solid #000;}   /* the episode's number, read sideways: a section of the card in the podcast's color */
  .ee-no span{writing-mode:vertical-rl; transform:rotate(180deg); font:700 .78rem/1 Arial,Helvetica,sans-serif; letter-spacing:.6px; color:#fff; white-space:nowrap;}
  .ep-ed{overflow:hidden;}   /* the number section's corners follow the card's rounding */
  .ee-top, .ee-bot{display:flex; gap:4px; height:34px;}
  .ee-bot{display:grid; grid-template-columns:1fr 1fr;}   /* date | length, even halves */
  .ee-title{flex:1; min-width:0; box-sizing:border-box; height:34px; border:3px solid #000; border-radius:6px; padding:6px 8px; background:#fff; font:600 .84rem/1.2 Georgia,serif; color:var(--ink); outline:none; resize:none; overflow:hidden; display:block;}
  .ee-title.two{padding:1px 8px; font-size:.7rem; line-height:1.12;}   /* a long title: two lines in the same height */
  .ee-date{flex:1 1 0; box-sizing:border-box; min-width:0; width:100%; cursor:pointer; border:3px solid #000; border-radius:6px; padding:0 6px; background:#fff; font:.78rem Arial,sans-serif; outline:none;}
  .ee-tagrow{display:flex; gap:4px; align-items:stretch;}   /* the + grows with the tag rows */
  .ep-ed .ee-tag{flex:1; min-width:0; height:auto; box-sizing:border-box; flex-wrap:wrap; gap:3px; background:#000; border-width:3px; border-radius:6px;}
  .ep-ed .ee-tag::-webkit-scrollbar{display:none;}
  .ep-ed .ee-tag button{flex:1 1 var(--tw,0px); height:28px; box-sizing:border-box; font-size:.72rem; padding:0 8px; white-space:nowrap;}   /* too many for one row: a new row, all the same width */
  .ee-addtag{flex:0 0 34px; height:auto; min-height:34px; margin:0; padding:0; box-sizing:border-box; border:3px solid #000; border-radius:6px; background:var(--panel); color:var(--ink); font:700 1.2rem/1 Arial,sans-serif; cursor:pointer;}
  .ee-addtag:active{background:var(--bg);}
  .ep-ed .ee-tag button + button{border-left:0;}
  /* more than one row: rows go half height, so two rows fit the usual 34px; a third row onward adds height */
  #eps.half .ee-tag button{height:12.5px; font-size:.58rem; line-height:1;}
  .ee-reset{flex:0 0 34px; margin:0; padding:0; border:3px solid #000; border-radius:6px; background:#fff; color:var(--red); font:700 1rem Arial,sans-serif; cursor:pointer;}
  .ee-reset[hidden]{display:none;}
  /* guests: a fixed lowercase "with" then the names */
  .ee-se{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px;} .ee-se .ee-guest{min-width:0;}   /* season | episode, even halves */
  .ee-se .ee-guest span{text-transform:lowercase;}
  .ee-num{flex:1; min-width:0; height:100%; border:0; padding:0; background:transparent; font:700 .82rem Arial,sans-serif; color:var(--ink); outline:none; font-variant-numeric:tabular-nums;}
  .ee-guest{display:flex; align-items:center; gap:6px; height:34px; box-sizing:border-box; padding:0 8px; border:3px solid #000; border-radius:6px; background:#fff; cursor:text;}
  .ee-guest span{flex:none; font:.78rem Arial,sans-serif; color:var(--muted);}
  .ee-guests{flex:1; min-width:0; height:100%; border:0; padding:0; background:transparent; font:600 .78rem Arial,sans-serif; color:var(--ink); outline:none;}
  /* episode length: hours / minutes / seconds wheels, dragged up and down (as in Stack Tracker) */
  .ee-len{position:relative; flex:1 1 0; min-width:0; display:flex; height:34px; box-sizing:border-box; background:var(--panel); border:3px solid #000; border-radius:6px; overflow:hidden;}
  .tw-wheel{position:relative; flex:1; min-width:0; height:100%; overflow:hidden; cursor:grab; background:#fff;}
  .ee-len.active .tw-wheel{touch-action:none;}   /* only the active wheels catch drags; the others let the page scroll */
  /* locked until tapped: fogged glass over the wheels; one set of wheels is live at a time, fading in and out */
  .ee-fog{position:absolute; inset:0; z-index:3; margin:0; padding:0; border:0; border-radius:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:rgba(239,234,223,.55);
    -webkit-backdrop-filter:blur(2.5px) saturate(.8); backdrop-filter:blur(2.5px) saturate(.8);
    font:700 .58rem/1 Arial,sans-serif; letter-spacing:.7px; text-transform:uppercase; color:var(--ink);
    opacity:1; transition:opacity .28s ease;}
  .ee-len.active .ee-fog{opacity:0; pointer-events:none;}
  .tw-wheel + .tw-wheel{border-left:3px solid #000;}
  .tw-wheel::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.16), rgba(0,0,0,0) 32%, rgba(0,0,0,0) 68%, rgba(0,0,0,.16));}
  .tw-wheel div{position:absolute; left:0; right:0; top:0; height:16px; text-align:center; color:var(--ink);
    font:700 14px/16px Arial,Helvetica,sans-serif; font-variant-numeric:tabular-nums; user-select:none; -webkit-user-select:none; will-change:transform;}
  .tw-wheel span{position:absolute; left:4px; top:3px; z-index:2; font:700 .5rem Arial,sans-serif; color:var(--muted); pointer-events:none;}
  .cp-pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px; flex:none;}   /* colors | tones, side by side */
  .cp-row{display:flex; height:23px; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:#000; gap:3px;}
  .cp-row button{flex:1; min-width:0; margin:0; padding:0; border:0; border-radius:0; cursor:pointer; position:relative;}
  .cp-row button.on::after{content:''; position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-6px 0 0 -6px;
    border:2.5px solid #fff; border-radius:50%; box-shadow:0 0 0 1.5px rgba(0,0,0,.5);}
  /* half-height picker: the name-based card is one line, label then value */
  button.dt-card.cp-auto{cursor:pointer; height:23px; flex-direction:row; gap:6px; align-items:center; justify-content:center; text-align:center; font-size:.56rem; white-space:nowrap; overflow:hidden;}
  .dt-card.cp-auto b{font-size:.7rem; min-width:0;}
  .rm-show{cursor:pointer; margin-top:8px !important;} .dt-card.rm-show b{color:var(--red);}
  .show-ed{height:auto !important; align-items:center; padding-right:8px !important;}
  .show-ed.edited{background:#f6f2e8;}
  .show-ed .main{display:flex; flex-direction:column; gap:6px; padding:8px 0;}
  .show-ed input{width:100%; height:34px; border:3px solid #000; border-radius:6px; padding:0 8px; background:#fff; outline:none;}
  .show-ed .se-title{font:700 .95rem Georgia,serif;}
  .show-ed .se-author{font:.8rem Arial,sans-serif;}
  .show-ed .se-reset{align-self:center; height:34px;}
  .hdr-row{display:flex; align-items:stretch; gap:4px; margin:0 4px; height:45px;}
  .hdr-row > *{min-width:0;}
  .hdr-row:empty{display:none;}

  /* ---- frozen footer ---- */
  #app-footer{position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom)); background:var(--bg); border-top:3px solid #000;}
  #app-footer:empty{display:none;}

  /* ---- shared GT50 card pieces ---- */
  .card{background:var(--panel); border:3px solid #000; border-radius:8px;}
  .seg, .acts{display:flex; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .seg button, .acts button{flex:1; min-width:0; margin:0; padding:0 4px; border:none; border-radius:0; background:var(--panel);
    color:var(--ink); font-family:Arial,sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.3px; white-space:nowrap;}
  .seg button + button, .acts button + button{border-left:3px solid #000;}
  .seg button.on{background:var(--ink); color:#fff;}
  .acts button:active{background:var(--bg);}   /* tabs and segmented cards: no tap color, only the selected one is colored */
  .acts .del{color:var(--red);}
  .acts button:disabled{color:var(--muted);}
  .ink-btn{flex:0 0 auto; height:45px; padding:0 16px; border:3px solid #000; border-radius:8px; background:var(--ink); color:#fff;
    font-family:Arial,sans-serif; font-size:.8rem; font-weight:600; letter-spacing:.3px;}
  .plain-btn{flex:0 0 auto; height:45px; padding:0 12px; border:3px solid #000; border-radius:8px; background:var(--panel);
    font-family:Arial,sans-serif; font-size:.78rem; font-weight:600;}
  .field-card{flex:1; display:flex; align-items:center; height:45px; padding:0 10px; background:var(--panel); border:3px solid #000; border-radius:8px;}
  #app .field-card{flex:none;}
  .field-card input{width:100%; border:none; outline:none; background:none; font-family:Georgia,serif; font-size:.9rem;}
  .field-card svg{width:18px; height:18px; flex:none; margin-right:8px;}
  .sort-card{flex:0 0 27%; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
    background:var(--panel); border:3px solid #000; border-radius:8px; padding:0 8px; font-family:Arial,sans-serif;
    font-size:.78rem; cursor:pointer; user-select:none; white-space:nowrap;}
  .sort-card .k{color:var(--muted); font-size:.62rem; letter-spacing:.5px;}

  /* GT50 divider: no card, just a centered line split around the title */
  .list-divider{display:flex; align-items:center; gap:10px; height:45px; padding:0 4px;}
  .list-divider::before, .list-divider::after{content:''; flex:1; height:3px; background:#000; border-radius:2px;}
  .list-divider span{font-family:Georgia,serif; font-size:.9rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    max-width:75%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- a row card: 45px, progress fill behind ---- */
  .row{position:relative; display:flex; align-items:center; gap:8px; height:45px; padding:0 8px; background:var(--panel);
    border:3px solid #000; border-radius:8px; overflow:hidden; cursor:pointer; user-select:none;}
  .row:active{filter:brightness(.96);}
  .fill{position:absolute; left:-3px; top:-3px; bottom:-3px; pointer-events:none; background-color:var(--page);
    background-image:var(--lines); transition:width .3s ease;}
  .row > :not(.fill){position:relative;}
  /* cover art: a square section flush to the card's left edge, split off by a black line */
  /* cover art: runs right out to the card's edge; the border is drawn over it (::after), so the art's edges hide beneath it */
  .row.has-art, .card.show-head{position:relative; border:none; padding-left:0; padding-right:11px;}
  .row.has-art::after, .card.show-head::after{content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    border:3px solid #000; border-radius:8px;}
  .art-sec{align-self:stretch; width:45px; flex:none; border-right:3px solid #000;
    background-color:var(--unread); background-size:cover; background-position:center;}
  .row.has-art .fill{left:0; top:0; bottom:0;}
  .main{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; line-height:1.15;}
  .t{font-family:Georgia,serif; font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .a{font-family:Arial,sans-serif; font-size:.66rem; color:rgba(43,38,32,.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prog{flex:none; text-align:right; display:flex; flex-direction:column; justify-content:center; line-height:1.15;
    font-family:Georgia,serif; font-size:.82rem; font-weight:600;}
  /* finished: dark fill, white text */
  .row.done .fill{background-color:var(--cloth);}
  .row.done .t, .row.done .prog{color:#fff;}
  .row.done .a{color:rgba(255,255,255,.75);}
  .row .go{flex:none; height:31px; padding:0 12px; border:3px solid #000; border-radius:6px; background:var(--ink); color:#fff;
    font-family:Arial,sans-serif; font-size:.72rem; font-weight:600;}
  .row .go.open{background:var(--panel); color:var(--ink);}

  /* episode rows */
  .ep .t{font-size:.84rem;}
  /* with guests: title, guests, then date and length, each on its own line, tightened to fit the same 45px card */
  .ep.has-g .main{line-height:1.08;}
  .ep.has-g .t{font-size:.8rem; line-height:1.05;}
  .ep.has-g .a{font-size:.6rem; line-height:1.15;}
  .ep.has-g .tagpill{font-size:.48rem; line-height:1.25; padding:0 4px;}
  /* the episode number: a section on the card's left, always the same width (room for four digits), sans-serif, equal-width digits */
  .row.ep{padding-left:0; background:color-mix(in srgb, var(--cloth) 30%, transparent);}   /* the podcast's color at 30% opacity (played cards: full color) */
  .ep-num{flex:none; align-self:stretch; width:52px; display:flex; align-items:center; justify-content:center; border-right:3px solid #000;
    background:var(--cloth); color:#fff; font:700 .76rem/1 Arial,Helvetica,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.3px;}   /* the podcast's color, white numbers; one size for every number, with or without a letter (1240.ab still fits) */
  .ep.done .ep-num{background:rgba(0,0,0,.22); color:#fff;}
  /* with season data: the overall number on top, a short rounded bar, then season and episode */
  .ep-num.se{flex-direction:column; gap:3px;} .ep-num.se b{font:inherit;}
  .ep-num.se i{display:block; width:75%; height:2px; border-radius:1px; background:#fff;}
  .ep-num.se small{font:700 .52rem/1 Arial,Helvetica,sans-serif; letter-spacing:.1px; white-space:nowrap;}
  /* played through here: a square section on the card's right end, in the podcast's color, a play mark pointing left with chevrons trailing it.
     First tap arms it (white, the icon in reds), a second tap within 3 seconds marks this and every older episode played */
  .ep .thru{flex:none; align-self:stretch; width:42px; margin:0 -8px 0 0; padding:0; border:0; border-left:3px solid #000; border-radius:0;
    background:var(--cloth); display:grid; place-items:center; cursor:pointer; transition:background .15s;}
  .ep .thru svg{width:24px; height:24px; display:block; overflow:visible;}
  .ep .thru path{fill:none; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke .15s;}
  .ep .thru .c1{stroke:#fff;} .ep .thru .c2{stroke:#d6d0c6;} .ep .thru .c3{stroke:#a9a39a;} .ep .thru .tri{fill:#fff;}
  .ep .thru.armed{background:#fff;}
  .ep .thru.armed .tri{stroke:#a82c2c; fill:#a82c2c;} .ep .thru.armed .c2{stroke:#cf5d5d;} .ep .thru.armed .c3{stroke:#e8a0a0;}
  .ep.done{background:var(--cloth);}
  .ep.done .t{color:#fff; font-weight:400;}
  .ep.done .a{color:rgba(255,255,255,.7);}
  .ep.done .thru:not(.armed){background:rgba(0,0,0,.22);}   /* on a played card (already the podcast's color): a shade darker */

  /* show heading */
  .show-head{display:flex; align-items:stretch; gap:10px; padding:0 10px 0 0; height:96px; overflow:hidden;}
  .show-head .art-sec{width:96px;}
  .show-head .main{padding:6px 0;}
  .show-head .t{font-size:1.05rem; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .show-head .a{font-size:.72rem; margin-top:2px;}
  /* stats card: every stat in capitals */
  .stats{display:flex; flex-direction:column; justify-content:center; gap:2px; height:45px; padding:0 10px; background:var(--panel);
    border:3px solid #000; border-radius:8px; font-family:Arial,sans-serif; font-size:.58rem; line-height:1.15; color:var(--muted);
    text-transform:uppercase;}
  .stats .sr{display:flex; justify-content:space-between; gap:8px; white-space:nowrap;}
  .stats b{color:var(--ink);}
  .note{font-family:Arial,sans-serif; font-size:.66rem; color:var(--muted); line-height:1.4; padding:2px 4px;}
  .note.warn{color:var(--red);}

  /* footer: unified progress card */
  .pcard{position:relative; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .pcard .fill{left:0; top:0; bottom:0;}
  .pcard .ov{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-size:.82rem; font-weight:600; line-height:1.2;}
  .pcard.done .fill{background-color:var(--cloth);}
  .pcard.done .ov{color:#fff;}
  .add-card{display:flex; align-items:center; justify-content:center; gap:8px; height:45px; background:var(--panel);
    border:3px solid #000; border-radius:8px; font-family:Arial,sans-serif; font-size:.82rem; color:var(--muted); letter-spacing:.5px; cursor:pointer;}
  .add-card b{font-size:1.1rem; color:var(--ink);}

  /* ---- Data: Backup | Export | Import, laid out like Stack Tracker's Data page ---- */
  .tabs{display:flex; flex:1; min-width:0; gap:3px; background:#000; border:3px solid #000; border-radius:8px; overflow:hidden;}
  .tabs .tab{flex:1; display:flex; align-items:center; justify-content:center; background:#d9d0be; color:var(--ink); cursor:pointer;
    font-family:Arial,sans-serif; font-size:min(.74rem, 2.95vw); font-weight:700; user-select:none;}
  .tabs .tab.active{background:var(--ink); color:#fff;}
  #app.fit{height:calc(100dvh - var(--header-h,50px) - var(--footer-h,0px) - 8px);}
  .dt-card{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; flex:none;
    height:45px; padding:0 8px; background:var(--panel); border:3px solid #000; border-radius:8px;
    font-family:Arial,sans-serif; font-size:.62rem; color:var(--muted); line-height:1.15;}
  button.dt-card{width:100%; margin:0; cursor:pointer;}
  .dt-card.bk-loc{flex-direction:row; align-items:stretch; padding:0; overflow:hidden;}
  .dt-card.bk-loc button{margin:0; border:0; border-radius:0; background:transparent; cursor:pointer; font-family:Arial,sans-serif;}
  .dt-card.bk-loc button:active{background:var(--bg);}
  #bk-loc-pick{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 8px; font-size:.62rem; color:var(--muted); line-height:1.15;}
  #bk-loc-pick b{max-width:100%;}
  #bk-loc-clear{flex:0 0 39px; padding:0; border-left:3px solid #000 !important; color:var(--red); font-size:1rem; font-weight:700;}
  #dt-restore{flex:none; display:flex; flex-direction:column; gap:4px; padding:4px; background:var(--bg); border:3px solid #000; border-radius:8px;}
  #dt-restore:empty{display:none;}
  .rs-card{display:flex; flex-direction:column; justify-content:center; gap:2px; width:100%; height:45px; margin:0; padding:0 8px; text-align:left;
    background:var(--panel); border:3px solid #000; border-radius:8px; cursor:pointer; font:400 .62rem/1.15 Arial,sans-serif; text-transform:uppercase; color:var(--muted);}
  .rs-card:active{background:var(--bg);}
  .rs-card .rs-when{font:700 .66rem/1.1 Arial,sans-serif; color:var(--ink);}
  .rs-card.on{background:var(--ink); color:#d6cfc2;}
  .rs-card.on .rs-when{color:#fff;}
  button.dt-card:active{background:var(--bg);}
  .dt-card b{font-family:Georgia,serif; font-size:.9rem; font-weight:600; color:var(--ink); max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dt-card.error b{color:var(--red);}
  .dt-card.when{flex-direction:row; align-items:stretch; padding:0;}
  .dt-card.when > span{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 8px;}
  .dt-card.when > span + span{border-left:3px solid #000;}
  .dt-card.how{gap:3px; font-size:min(.62rem, 2.55vw); color:var(--ink);}
  .dt-card.how > span{max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dt-text{flex:1; min-height:0; width:100%; resize:none; margin:0; padding:8px; background:var(--panel); color:var(--ink);
    border:3px solid #000; border-radius:8px; outline:none; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.7rem;
    line-height:1.4; white-space:pre; overflow:auto;}
  .dt-split{display:flex; height:45px; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .dt-split button{flex:1; margin:0; padding:0; border:none; border-radius:0; background:var(--panel); color:var(--ink);
    font-family:Arial,sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.3px;}
  .dt-split button + button{border-left:3px solid #000;}
  .dt-split button.on{background:var(--ink); color:#fff;}
  /* Weekly, when picked: label on top, the day to back up on below it */
  .dt-split .wk{display:flex; flex-direction:column; align-items:stretch; justify-content:center;}
  .dt-split .wk-days{display:none;}
  .dt-split .wk.on .wk-label{flex:1; display:flex; align-items:center; justify-content:center; font-size:.72rem;}
  .dt-split .wk.on .wk-days{display:flex; flex:1; border-top:1.5px solid rgba(255,255,255,.28);}
  .dt-split .wk-days i{flex:1; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:.6rem; font-weight:700;}
  .dt-split .wk-days i + i{border-left:1.5px solid rgba(255,255,255,.28);}
  .dt-split .wk-days i.on{background:#5a4c40;}
  /* bookcloth buttons: the cloth color with a woven texture, label in spaced serif capitals */
  .dt-pair{display:flex; gap:4px;}
  .cloth-btn{position:relative; overflow:hidden; flex:1 1 0; min-width:0; height:45px; margin:0; padding:0; border:3px solid #000;
    border-radius:8px; color:#fff; cursor:pointer; background-color:var(--cloth);
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.12));
    font:700 min(1rem, 4vw)/1 Georgia,'Times New Roman',serif; letter-spacing:.14em; text-transform:uppercase;}
  .dt-pair:has(> :nth-child(3)) > .cloth-btn{font-size:min(.86rem, 3vw); letter-spacing:.08em; white-space:nowrap;}
  .cloth-btn:active{filter:brightness(.92);}
  .cloth-btn:disabled{filter:grayscale(.8) brightness(1.15); opacity:.6; cursor:default;}
  /* backup reminder */
  .rr-modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(20,16,12,.45); opacity:0; pointer-events:none; transition:opacity .2s;}
  .rr-modal.open{opacity:1; pointer-events:auto;}
  .rr-box{width:100%; max-width:340px; background:var(--panel); border:3px solid #000; border-radius:10px; padding:16px;}
  .rr-title{font-family:Georgia,serif; font-size:1.05rem; margin-bottom:6px;}
  .rr-body{font-family:Arial,sans-serif; font-size:.78rem; color:var(--muted); line-height:1.4; margin-bottom:14px;}
  .rr-note{margin-top:10px; font-family:Arial,sans-serif; font-size:.64rem; color:var(--muted);}

  /* up-next cards: the border is drawn over the card (::after) so art and fills run under it */
  .oc{position:relative; display:flex; flex-direction:column; background:var(--panel); border-radius:8px; overflow:hidden; cursor:pointer; flex:none;}
  .oc::after{content:''; position:absolute; inset:0; z-index:3; pointer-events:none; border:3px solid #000; border-radius:8px;}
  .oc .sec{position:relative; display:flex; align-items:stretch; min-width:0;}
  .oc .sec > :not(.fill){position:relative;}
  .oc .fill{left:0; top:0; bottom:0;}
  .pill{flex:none; padding:1px 5px; background:#d9d0be; border:2px solid #000; border-radius:5px; font:700 .64rem/1.2 Arial,sans-serif; color:var(--ink); white-space:nowrap;}
  .ell{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .k{font:700 .56rem/1.1 Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
  button.rnd{margin:0; padding:0; cursor:pointer; font:inherit;}   /* only the circle marks an episode; the square around it does nothing */
  .ck{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
  button:disabled{cursor:default;}

  /* 100px tall; the art is the card's height wide, so the part you see (inside the border) is square */
  .v4{height:100px; flex-direction:row;}
  .v4 .art-sec{width:100px;}
  /* podcast name pinned to the top, episode details to the bottom, episode title centered between them */
  .v4 .bd{flex:1; min-width:0; display:grid; grid-template-rows:auto 1fr auto; padding:9px 8px 9px 10px;}
  .v4 .bd > .k{align-self:start;}
  .v4 .bd > .mid{align-self:center; min-width:0; display:flex; flex-direction:column;}
  /* with a guest: the title keeps to one line so the guest line fits under it */
  .v4 .et{-webkit-line-clamp:3 !important;}     /* Up Next title: up to three lines… */
  .v4 .et.one{-webkit-line-clamp:2 !important;} /* …or two when a guest line sits under it */
  .v4 .gu{font:italic .68rem/1.2 Georgia,serif; color:rgba(43,38,32,.75); overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:var(--gl,1);}
  .v4 .bd > .mt{align-self:end;}
  .v4 .et{font:700 .95rem/1.15 Georgia,serif;}
  .v4 .mt{font:.62rem Arial,sans-serif; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* the check: a narrow strip on the right */
  .v4 .cks{flex:none; width:49px; margin:0; padding:0 3px 0 0; border:none; border-left:3px solid #000; border-radius:0;
    display:grid; place-items:center;
    /* progress fills the square from the bottom up; measured over the part you can see (the card's border covers 3px top and bottom) */
    background:linear-gradient(to top, var(--cloth) calc(3px + (100% - 6px) * var(--f,0)), var(--unread) 0);
    background-origin:border-box; background-clip:border-box;}
  .v4 .rnd{width:30px; height:30px; display:grid; place-items:center; border:3px solid #000; border-radius:50%;
    background:var(--panel); color:var(--ink);}
  .v4 .rnd .ck{width:16px; height:16px; stroke-width:3.4;}
  .cu-row{height:45px;}
  /* caught up: a gold check square, the circle in the podcast's color with a white check */
  /* caught up: the square in the podcast's color, a black circle with a gold check (ended: gold and white double check) */
  .v4 .cks.gold, .v5 .cks.gold{background:var(--cloth); cursor:pointer;}
  .oc .cks.gold .rnd .ck2{width:21px; height:21px; stroke-width:1.8;}
  .oc.v5 .cks.gold .rnd .ck2{width:17px; height:17px;}
  /* a new episode since you caught up (under two weeks old): green check */
  .oc .rnd.fresh{background:#fff; border-color:#000; color:#2f8a45;}
  .oc .et.cu-say{font-style:italic; color:rgba(43,38,32,.72);}
  .oc .cks.gold .rnd{background:#000; border:2px solid #fff; color:#f0cf6e;}
  .oc .cks.gold.end .rnd{color:#fff;}
  /* simple cards: the standard 45px, square art on the left, square check on the right */
  .v5{height:45px; flex-direction:row;}
  .v5 .art-sec{width:45px;}
  .v5.bare{cursor:default;} .v5.bare .bd{padding-left:10px;}
  .tri-sec{flex:none; width:45px; align-self:stretch; margin:0; border:0; border-radius:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--cloth); border-right:3px solid #000; padding:0 0 0 3px; box-sizing:border-box;}   /* left pad = the card's border, so they sit centered in what you see */
  .tri-sec svg{width:38px; height:38px; overflow:visible;}
  .ep.flash{animation:epflash 1.4s ease .25s;}
  @keyframes epflash{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}30%{box-shadow:0 0 0 3px var(--cloth)}}
  .tri-sec polygon{filter:drop-shadow(0 1.6px 1.2px rgba(0,0,0,.5));}
  #show-next{flex:none;}
  /* podcast name pinned to the top, details to the bottom, episode title centered between */
  .v5 .bd{flex:1; min-width:0; display:grid; grid-template-rows:auto 1fr auto; padding:4px 8px 4px 9px; line-height:1.1;}
  .v5 .bd > .et{align-self:center;}
  .v5 .mt{font:700 .6rem/1.1 Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}   /* same size and weight as the podcast name */
  .v5 .k{font-size:.6rem; line-height:1.1;}
  .v5 .et{font:700 .8rem/1.1 Georgia,serif; color:var(--ink);}
  .v5 .gu{font:italic .6rem/1.15 Georgia,serif; color:rgba(43,38,32,.75);}
  .v5 .cks{flex:none; width:45px; margin:0; padding:0 3px 0 0; border:none; border-left:3px solid #000; border-radius:0; display:grid; place-items:center;
    background:linear-gradient(to top, var(--cloth) calc(3px + (100% - 6px) * var(--f,0)), var(--unread) 0); background-origin:border-box; background-clip:border-box;}
  .v5 .rnd{width:24px; height:24px; box-sizing:border-box; display:grid; place-items:center; border:3px solid #000; border-radius:50%; background:var(--panel); color:var(--ink);}
  .v5 .rnd .ck{width:12px; height:12px; stroke-width:3.6;}
  /* list cards: two short lines (podcast name, then the episode), a check square on the right, and a thin progress bar along the bottom of the text side */
  .v6{height:38px; flex-direction:row;}
  .v6 .bd{position:relative; flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 8px 6px 10px; background:color-mix(in srgb, var(--cloth) 20%, var(--panel));}   /* the podcast's color at 20% */
  .v6 .k{font-size:.56rem; line-height:1;}
  .v6 .et{font:700 .76rem/1.05 Georgia,serif; color:var(--ink);}
  .v6 .cks{flex:none; width:38px; margin:0; padding:0 3px 0 0; border:none; border-left:3px solid #000; border-radius:0; display:grid; place-items:center; background:#000;}   /* the check square stays black */
  .v6 .rnd{width:22px; height:22px; box-sizing:border-box; display:grid; place-items:center; border:3px solid #000; border-radius:50%; background:var(--panel); color:var(--ink);}
  .v6 .rnd .ck{width:11px; height:11px; stroke-width:3.8;}
  .v6 .cks.gold{background:#000;}
  .oc.v6 .cks.gold .rnd .ck2{width:15px; height:15px;}
  /* the list's own check: the ended double check's thin style, single, white, on a circle in the podcast's color with a white rim */
  .oc.v6 .cks:not(.gold) .rnd{width:22px; height:22px; border:2px solid #fff; background:var(--cloth); color:#fff;}
  .oc.v6 .cks:not(.gold) .rnd.fresh{background:#fff; color:#2f8a45;}   /* new since you caught up: still white with a green check */
  .oc.v6 .rnd .ck1{width:15px; height:15px; stroke-width:1.8;}
  /* the left end: played over total, a short rounded bar between them; white on black, the same width as the check square, room for four digits */
  .v6 .lst{flex:none; width:38px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:0 0 0 3px; border-right:3px solid #000; background:#000; font:700 .66rem/1 Arial,sans-serif; color:#fff; font-variant-numeric:tabular-nums;}
  .v6 .lst i{display:block; width:75%; height:5px; border-top:2px solid #fff; border-radius:50% 50% 0 0 / 100% 100% 0 0;}   /* a thin arch between the numbers */
  .v6 .bd{padding-left:9px;}
  .v6 .lbar{position:absolute; left:0; right:0; bottom:0; height:9px; pointer-events:none; background:rgba(0,0,0,.2); border-radius:10px 10px 0 0 / 6px 6px 0 0; overflow:hidden;}   /* runs under the card's border so it always meets it; 6px shows */
  /* how much you've played: a full dome from the first episode (its two round ends need 20px), then every episode adds its share of the rest */
  .v6 .lbar .fl{position:absolute; left:0; top:0; bottom:0; width:calc(20px + var(--f,0) * (100% - 20px)); background:var(--cloth); border-radius:10px 10px 0 0 / 6px 6px 0 0;}
  .v6 .lbar .fl:not(.on){display:none;}   /* nothing played, no fill */
  /* the Full | Simple | List switch under the search card */
  .seg.view-seg{flex:none; height:21px; border-radius:6px;}
  .seg.view-seg button{font:700 min(.6rem,2.5vw)/1 Arial,sans-serif; text-transform:uppercase; letter-spacing:.4px;}

  .v4 .et, .cu-row .t{white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-overflow:clip;}
  .v4 .art-sec, .cu-row .art-sec{background-position:center;}
  /* fixed heights: a wrapped title tightens its lines instead of growing the card */
  .v4 .et{font-size:.88rem; line-height:1.14;}
  .cu-row .t{font-size:.84rem; line-height:1.1;}
  .empty{padding:40px 12px; text-align:center; font-family:Arial,sans-serif; font-size:.8rem; color:var(--muted);}
  .spin{display:inline-block; width:14px; height:14px; border:3px solid var(--unread); border-top-color:var(--ink); border-radius:50%;
    animation:sp 1s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed; left:50%; top:calc(var(--header-h,50px) + 8px); transform:translate(-50%,-20px); opacity:0; z-index:50;
    background:var(--ink); color:#fff; border:3px solid #000; border-radius:8px; padding:10px 16px; font-family:Arial,sans-serif;
    font-size:.8rem; pointer-events:none; transition:opacity .2s, transform .2s; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%,0);}


  /* ---- headers and footers, styled like Stack Tracker's (plain colors, no cloth textures) ---- */
  :root{--band:#6b4a32; --hdr-cell:#d9d0be;}
  /* the bars: walnut, boxed in black top and bottom, with a soft shadow cast onto the page */
  #app-header{background:var(--band); border-top:3px solid #000;}
  #app-footer{background:var(--band); border-bottom:3px solid #000; box-shadow:inset 0 calc(-1 * env(safe-area-inset-bottom)) 0 #000;}   /* the phone's home-bar strip stays black */
  #app-header::after, #app-footer::before{content:''; position:absolute; left:0; right:0; height:16px; pointer-events:none;}   /* tucked 2px under the black edge, so no sliver of page shows between them on any screen */
  #app-header::after{top:100%; margin-top:1px; background:linear-gradient(180deg, rgba(0,0,0,.32), rgba(0,0,0,.12) 40%, rgba(0,0,0,0));}
  #app-footer::before{bottom:100%; margin-bottom:1px; background:linear-gradient(0deg, rgba(0,0,0,.32), rgba(0,0,0,.12) 40%, rgba(0,0,0,0));}
  /* page tabs: one dark strip, no dividing lines; each tab a card on it, white when not picked,
     its own color with white words when picked */
  #ttl-bar, .so-head{background:#000;}
  #tabs{gap:4px; padding:calc(4px + env(safe-area-inset-top)) 4px 4px; background:var(--ink); border-bottom:3px solid #000;}
  #tabs .tab, #tabs .tab + .tab{height:34px; border:2.5px solid #000; border-radius:6px; background:#fff; color:var(--ink);
    font:700 min(.74rem, 2.95vw)/1.1 Arial,sans-serif; letter-spacing:0; text-transform:uppercase;}
  #tabs .tab.active{background:var(--cloth,#7a2f2b); color:#fff;}
  /* page bars (a podcast, Settings, Tags, Sort): brick on the left, the title in tan, forest on the right */
  #ttl-bar button, .so-head button{background:#7a2f2b; background-clip:padding-box; color:#fff; font:700 min(.74rem, 2.95vw)/1.1 Arial,sans-serif; letter-spacing:0; text-transform:uppercase;}
  #ttl-bar #tb-edit{background:#2e4636;}
  #ttl-bar #tb-edit.on{background:#5b6633;}
  #ttl-bar #tb-back.cancel{background:var(--red);}
  #ttl-bar h2, .so-head h2{background:var(--hdr-cell); font:700 min(.74rem, 2.95vw)/42px Arial,sans-serif; letter-spacing:0; text-transform:uppercase; color:var(--ink);}
  /* Add New Podcast: olive, its words in the covers' serif, bold, in spaced capitals */
  #app-footer .add-card{background:#5b6633; color:#fff; font:700 min(1rem, 4vw)/1 Georgia,'Times New Roman',serif; letter-spacing:.14em; text-transform:uppercase;}
  #app-footer .add-card b{color:#fff; font-size:1.15em;}
  #app-footer .add-card:active{filter:brightness(.92);}
  #app-footer .cloth-btn{background-image:none;}   /* footer buttons in plain color, no weave */
</style>
</head>

<script>

  const ph=placeholderArt(id,title);
  const layers=(src?`url("${esc(src)}"), `:'')+`url("${ph}")`;
  return `<div class="art-sec" style='background-image:${layers}'></div>`;
}
// progress fill for an art card: starts after the art section, so 0% shows no fill
function artFill(f){return f?`calc(45px + (100% - 45px) * ${f})`:'0'}   // under the art, then across the rest of the card
// progress only counts episodes whose tag counts (Settings › Counts toward progress; every tag counts until you turn one off)
function countedEps(sh){const a=eps(sh),sk=sh.skipTags;return sk&&sk.length?a.filter(e=>!sk.includes(e.tag)):a}
function playedCount(sh){return countedEps(sh).reduce((n,e)=>n+(sh.played[e.id]?1:0),0)}
function totalCount(sh){return countedEps(sh).length}
async function fetchTimeout(url,ms=12000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{signal:c.signal})}finally{clearTimeout(t)}}

/* ---------- placeholder podcasts (switch at the top of the script) ----------
   Marked demo:true. They never fetch anything, and they're left out of every export, backup and import. */
const isPlaceholder=sh=>!!(sh&&sh.demo);
const DEMO_POOL=[
  ['d1','The Long Middle','Placeholder Audio',64],['d2','Kitchen Table Physics','Demo Network',38],
  ['d3','Night Shift Stories','Sample Studios',120],['d4','Small Town Ledger','Placeholder Audio',22],
  ['d5','Folk Roots Hour','Demo Network',1240],   // a big daily show, for trying out long lists
].map(([id,title,author,count])=>({id,title,author,art:'',feedUrl:'',count,demo:true}));
const TOPICS=['What we got wrong about the long winter, and what comes after it','The first draft','A conversation with the people who still repair old radios by hand','Why it broke','Listener mail','A long walk','The archive','Behind the counter','Old maps','Low tide','The second take','Odds and ends','Season finale','Starting over'];
// guests written the ways real feeds do it (every 4th episode), so the guest line shows up
const GUEST_FORMS=[n=>` (with ${n})`,n=>` w/ ${n}`,n=>` feat. ${n}`,n=>` - with Guest ${n}`,n=>` (${n})`,n=>` with ${n}`];
const GUEST_POOL=['Maria Garcia','Tom Lee & Sara Kim','Patti Smith','Dr. Jane Goodall','Mike Lee, Sara Kim & Tom Ford','José García','Ken Burns','Monty Don'];
const FIRST_EP={d1:'Starting out (with Maria Garcia)',d2:'Lunch with John',d3:'Pilot w/ Tom Lee & Sara Kim',d4:'Behind the counter',
  d5:'What we got wrong about the long winter, and what comes after it'};
function demoEpisodes(p){
  const DAY=86400000, now=Date.now(), off=p.id.charCodeAt(1);
  return Array.from({length:p.count},(_,i)=>{const n=p.count-i, seasons=p.id==='d3';
    let title=n===1&&FIRST_EP[p.id]||TOPICS[(n*5+off*3)%TOPICS.length], type='full';
    if(n>1&&(n+off)%4===0)title+=GUEST_FORMS[(n+off)%GUEST_FORMS.length](GUEST_POOL[(n*3+off)%GUEST_POOL.length]);
    if(n>1&&n%9===0){type='bonus';title='Bonus: '+title}                                // some bonus episodes
    if((p.id==='d1'||p.id==='d3')&&n===20){type='trailer';title='Coming up next season'} // and a promo, so tag tabs show
    return {id:`${p.id}-e${n}`,title,date:now-(i*(p.id==='d5'?1:7)+3)*DAY,dur:1500+(n*977)%3600,
      ep:seasons?((n-1)%20)+1:n,season:seasons?Math.ceil(n/20):0,type};});
}
// on: add any placeholder that's missing (0 played). Off: remove them. Your own shows are never touched.
function syncPlaceholders(){
  let changed=false;
  if(PLACEHOLDERS){
    for(const p of DEMO_POOL){const ex=S.shows[p.id];
      if(!ex){
        S.shows[p.id]={...p,episodes:demoEpisodes(p),played:{},source:'rss',addedAt:Date.now(),updatedAt:Date.now()};
        S.order.push(p.id);changed=true;
      }else if(isPlaceholder(ex)&&ex.count!==p.count){   // a placeholder whose size changed: new episode list, your played marks and edits kept
        ex.count=p.count;ex.episodes=demoEpisodes(p);const ids=new Set(ex.episodes.map(e=>e.id));
        for(const k in ex.played)if(!ids.has(k))delete ex.played[k];changed=true;
      }
    }
  }else{
    const before=S.order.length;
    S.order=S.order.filter(id=>S.shows[id]&&!isPlaceholder(S.shows[id]));
    for(const id in S.shows)if(isPlaceholder(S.shows[id])){delete S.shows[id];changed=true}
    if(S.order.length!==before)changed=true;
  }
  delete S.phVer;
  if(changed)save();
}

async function searchPodcasts(term){
  const r=await fetchTimeout(`https://itunes.apple.com/search?media=podcast&entity=podcast&limit=30&term=${encodeURIComponent(term)}`);
  if(!r.ok)throw new Error('Search failed');
  const j=await r.json();

// Most feeds don't let a web page read them directly, so the feed is fetched through relays.
// All of them are tried at once and the first full feed wins (big feeds get up to 45s); your own relay, if set, is one of them.
const PUBLIC_RELAYS=[
  ['allorigins',e=>`https://api.allorigins.win/raw?url=${e}`,'text'],
  ['allorigins (json)',e=>`https://api.allorigins.win/get?url=${e}`,'json'],
  ['corsproxy.io',e=>`https://corsproxy.io/?url=${e}`,'text'],
  ['codetabs',e=>`https://api.codetabs.com/v1/proxy?quest=${e}`,'text'],
  ['cors.eu.org',e=>`https://cors.eu.org/${decodeURIComponent(e)}`,'text'],
  ['cors.lol',e=>`https://api.cors.lol/?url=${e}`,'text'],
  ['whateverorigin',e=>`https://whateverorigin.org/get?url=${e}`,'json'],
  ['everyorigin',e=>`https://everyorigin.jwvbremen.nl/api/get?url=${e}`,'json'],
  ['thingproxy',e=>`https://thingproxy.freeboard.io/fetch/${decodeURIComponent(e)}`,'text'],
];
function relayURL(relay,feed){return relay.includes('{url}')?relay.replace('{url}',encodeURIComponent(feed)):relay+encodeURIComponent(feed)}
let lastFeedVia='';
async function fetchFeedText(url,ms=45000){
  const e=encodeURIComponent(url), ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),ms);
  const tries=[['direct',url,'text']];
  if(S.relay)tries.unshift(['your relay',relayURL(S.relay,url),'text']);
  for(const [name,mk,kind] of PUBLIC_RELAYS)tries.push([name,mk(e),kind]);
  const attempt=async([name,u,kind])=>{
    const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw new Error(name+' '+r.status);
    let t=await r.text();
    if(kind==='json'||/^\s*\{/.test(t)){try{const j=JSON.parse(t);t=[j.contents,j.html,j.data,j.body].find(v=>typeof v==='string')||''}catch(e){}}
    if(!/<item[\s>]/i.test(t))throw new Error(name+' gave no episodes');
    return [name,t];
  };
  try{const [name,t]=await Promise.any(tries.map(attempt));lastFeedVia=name;return t}
  catch(err){lastFeedVia='';return null}
  finally{clearTimeout(timer);ctl.abort()}   // stop the slower ones once one has the feed
}
// reads a feed even when it isn't strictly valid XML (a bare "&" or an HTML "&nbsp;" makes the browser reject the whole file)
function parseFeedLoose(xml){
  const strict=parseFeed(xml);if(strict&&strict.length)return strict;
  const fixed=xml.replace(/&nbsp;/gi,'&#160;').replace(/&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-f]+);)/gi,'&amp;');
  const again=parseFeed(fixed);if(again&&again.length)return again;
  // last resort: pull each <item> out by pattern
  const dec=v=>v.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/<[^>]+>/g,'')
    .replace(/&#(\d+);/g,(m,n)=>String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi,(m,n)=>String.fromCodePoint(parseInt(n,16)))
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim();
  const tag=(blk,t)=>{const m=blk.match(new RegExp('<'+t+'(?:\\s[^>]*)?>([\\s\\S]*?)</'+t+'>','i'));return m?dec(m[1]):''};
  const out=[],seen=new Set();
  for(const m of xml.matchAll(/<item[\s>][\s\S]*?<\/item>/gi)){
    const blk=m[0], title=tag(blk,'title')||'Untitled episode';
    const enc=blk.match(/<enclosure[^>]*\surl=["']([^"']+)["']/i);
    let id=tag(blk,'guid')||(enc&&dec(enc[1]))||tag(blk,'link')||title;
    if(seen.has(id))id=id+'#'+out.length;seen.add(id);
    out.push({id,title,date:Date.parse(tag(blk,'pubDate'))||0,dur:parseDur(tag(blk,'itunes:duration')),ep:parseInt(tag(blk,'itunes:episode'))||0,season:parseInt(tag(blk,'itunes:season'))||0,type:tag(blk,'itunes:episodeType').toLowerCase()});
  }
  return out.length?out:null;
}
function parseFeed(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('parsererror'))return null;
  const out=[],seen=new Set();
  doc.querySelectorAll('item').forEach(it=>{
    const g=k=>{const n=it.getElementsByTagName(k)[0];return n?n.textContent.trim():''};
    const title=g('title')||'Untitled episode';
    const enc=it.getElementsByTagName('enclosure')[0];
    let id=g('guid')||(enc&&enc.getAttribute('url'))||g('link')||title;
    if(seen.has(id))id=id+'#'+out.length;seen.add(id);
    out.push({id,title,date:Date.parse(g('pubDate'))||0,dur:parseDur(g('itunes:duration')),ep:parseInt(g('itunes:episode'))||0,season:parseInt(g('itunes:season'))||0,type:g('itunes:episodeType').toLowerCase()});
  });
  return out;
}
async function itunesEpisodes(id){
  const r=await fetchTimeout(`https://itunes.apple.com/lookup?id=${id}&media=podcast&entity=podcastEpisode&limit=200`);
  const j=await r.json();
  return (j.results||[]).filter(x=>x.wrapperType==='podcastEpisode').map(x=>({id:x.episodeGuid||String(x.trackId),title:x.trackName,date:Date.parse(x.releaseDate)||0,dur:Math.round((x.trackTimeMillis||0)/1000)}));
}
// show.feedIssue records why a show is on Apple's list: 'unreachable' (no relay got the feed) or 'unreadable' (got it, couldn't read it)
async function getEpisodes(show){
  if(show.demo)return{eps:demoEpisodes(show),source:'rss'};
  if(show.feedUrl){
    const t=await fetchFeedText(show.feedUrl);
    if(t){const eps=parseFeedLoose(t);if(eps&&eps.length){delete show.feedIssue;return{eps,source:'rss'}}show.feedIssue='unreadable'}
    else show.feedIssue='unreachable';
  }
  return{eps:await itunesEpisodes(show.id),source:'itunes'};
}

const NOT_NAME=new Set(`a about after again all an and any at back bad before best big bonus but by can chat cut day days death dead director's dinosaurs do down edition end ep episode every everyone extended family final finale first flags for friends from fun future god good great grief guest guests her here his home how i in into is it its kids last life listener listeners live love me mix mom dad more most my new news next night no not now of old on one or our out over part people power q&a re-release recap robots season so special stars strangers that the their them these they this time to today together trailer two under up us we what when who why will win without world you your`.split(/\s+/));

// one name: 1-4 capitalized words (plus particles, initials, Dr., Jr.); strict: 2+ words and a known first name
function parseName(str,strict){
  const toks=str.trim().split(/\s+/).filter(Boolean);
  if(!toks.length||toks.length>6)return null;
  let core=[];
  for(const t of toks){
    const lw=t.toLowerCase();
    if(HONORIFICS.has(lw)&&!core.length)continue;
    if(SUFFIXES.has(lw)&&core.length)continue;
    if(PARTICLES.has(lw)&&core.length)continue;
    if(/\d/.test(t))return null;
    if(!/^\p{Lu}[\p{L}'’\-.]*$/u.test(t))return null;   // must start with a capital
    if(NOT_NAME.has(lw)||NOT_GUEST.has(lw))return null;
    core.push(t);
  }
  if(!core.length||core.length>4)return null;
  if(strict&&(core.length<2||!FIRST_NAMES.has(core[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f.'’]/g,''))))return null;
  return toks.join(' ');
}
// one or more names: "A B", "A B and C D", "A B, C D & E F"
function parseNames(str,strict){
  str=str.replace(/[!?]+$/,'').trim();
  if(!str)return null;
  const parts=str.split(/\s*,\s*(?:and\s+|&\s*)?|\s+and\s+|\s*&\s*|\s+\+\s+/).filter(Boolean);
  const out=[];
  for(const p of parts){const n=parseName(p,strict);if(!n)return null;out.push(n)}
  return out.length?out:null;
}
const MARK_STRONG=/^(?:w\/|feat\.?|featuring|ft\.?|(?:with\s+)?(?:special\s+)?guests?:?)\s*/i;   // always means a guest
const tidy=t=>t.replace(/[\s\-–—|:•·,]+$/,'').trim();
// inside an explicit bracket like "[with …]" the marker already says it's a guest, so names are taken as written:
// bands ("The Mountain Goats"), lowercase names ("bell hooks"), "Will Smith". Only things that clearly aren't people are refused.
const NOT_GUEST=new Set(`lyrics commentary bonus subtitles captions transcript transcripts video audio music sound ads notes extras director's cut`.split(/\s+/));
function looseNames(str){
  str=str.replace(/[!?.]+$/,'').trim();
  if(!str)return null;
  const parts=str.split(/\s*,\s*(?:and\s+|&\s*)?|\s+and\s+|\s*&\s*|\s+\+\s+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length)return null;
  for(const p of parts){
    const w=p.split(/\s+/);
    if(w.length>8)return null;
    if(w.every(x=>{const l=x.toLowerCase().replace(/[.,'’]/g,'');return NOT_NAME.has(l)||NOT_GUEST.has(l)}))return null;   // "Friends", "Lyrics", "the Kids"
  }
  return parts;
}
// returns {title, guests} — guests is [] when the title has none
function splitGuest(title){
  const raw=String(title||'').trim();
  const none={title:raw,guests:[]};
  if(!raw)return none;
  // 0. a marked bracket anywhere in the title: "[with Jane Doe]", "(w/ X)", "[feat. X]", "(Guest: X)" — start, middle or end
  const bm=raw.match(/[(\[]\s*(?:w\/|with\s+(?:special\s+)?guests?:?|with|feat\.?|featuring|ft\.?|(?:special\s+)?guests?:?)\s*([^()\[\]]+?)\s*[)\]]/i);
  if(bm){
    const g=looseNames(bm[1]);
    const rest=tidy(raw.slice(0,bm.index).concat(' ',raw.slice(bm.index+bm[0].length)).replace(/\s{2,}/g,' ').replace(/\s([\-–—|•·])(?:\s+[\-–—|•·])+\s/g,' $1 ').replace(/^[\s\-–—|:•·,]+/,''));
    if(g&&/[\p{L}\d]/u.test(rest))return{title:rest,guests:g};
  }
  // 1. a trailing bracket: "(with Jane Doe)", "[feat. X]", or a bare "(Jane Doe)"
  let m=raw.match(/^(.*\S)\s*[(\[]\s*([^()\[\]]+?)\s*[)\]]\s*$/);
  if(m){
    const inner=m[2];let g=null;
    if(MARK_STRONG.test(inner)&&inner.replace(MARK_STRONG,''))g=parseNames(inner.replace(MARK_STRONG,''),false);
    else if(/^with\s+/i.test(inner))g=parseNames(inner.replace(/^with\s+/i,''),false);
    else g=parseNames(inner,true);
    const rest=tidy(m[1]);
    if(g&&/[\p{L}\d]/u.test(rest))return{title:rest,guests:g};
  }
  // 2. after a separator: "Episode 12 - with Jane Doe", "Ep 5: w/ Jane", "#212 | with Guest Ken Burns"
  m=raw.match(/^(.*\S)\s*(?:\s[-–—|•·]\s|:\s)\s*((?:w\/|with|feat\.?|featuring|ft\.?|(?:special\s+)?guests?)\b.*)$/i);
  if(m){
    let clause=m[2],g=null;
    if(MARK_STRONG.test(clause))g=parseNames(clause.replace(MARK_STRONG,''),false);
    else{clause=clause.replace(/^with\s+/i,'');g=parseNames(clause,false)}
    const rest=tidy(m[1]);
    if(g&&/[\p{L}\d]/u.test(rest))return{title:rest,guests:g};
  }
  // 3. trailing, no separator: "Big Night feat. DJ Shadow", "Lunch w/ John", "Lunch with John Smith"
  m=raw.match(/^(.*\S)\s+(w\/|feat\.?|featuring|ft\.?|with\s+(?:special\s+)?guests?:?|with)\s+(\S.*)$/i);
  if(m){
    const plain=/^with$/i.test(m[2]);
    const g=parseNames(m[3],plain);   // plain "with": two-part name starting with a known first name
    const rest=tidy(m[1]);
    if(g&&/[\p{L}\d]/u.test(rest))return{title:rest,guests:g};
  }
  return none;
}
// "(with JANE DOE)", "(with JANE DOE & JOHN ROE)", "(with A, B & C)"
const guestText=g=>{if(!g.length)return'';const n=g.length===1?g[0]:`${g.slice(0,-1).join(', ')} & ${g[g.length-1]}`;return `(with ${n.toLocaleUpperCase()})`};

const pad2=n=>String(n).padStart(2,'0');
// the next episode: the first unplayed one after the newest you've played; if there's none, the oldest unplayed
/* ---------- episode tags and your edits ---------- */
// every episode is Main, Bonus or Promo. The feed's own type sets it (bonus -> Bonus, trailer -> Promo); your edits win.
const TAGS={main:'Main',bonus:'Bonus',promo:'Promo'};
// a show's tags: the three built in, then any you've added (sh.tags: {id: name})
const tagsOf=sh=>Object.assign({},TAGS,(sh&&sh.tags)||{});
const feedTag=e=>e.type==='bonus'?'bonus':(e.type==='trailer'||e.type==='promo')?'promo':'main';
// the episodes as you see them: your title, date and tag over the feed's. Edits live in sh.edits, so a feed refresh never undoes them
// each episode's title split into the title and its guests (kept, so long lists don't re-parse every time)
const gMemo=new Map();
const partsOf=t=>{let p=gMemo.get(t);if(!p){p=splitGuest(t);gMemo.set(t,p)}return p};
const guestJoin=g=>g.length<2?(g[0]||''):g.slice(0,-1).join(', ')+' & '+g[g.length-1];
const guestParse=s=>String(s||'').replace(/^\s*with\s+/i,'').split(/\s*(?:,|&|\+)\s*/).map(x=>x.trim()).filter(Boolean);
// older edits kept the guests inside the title: split them out once
function migrateGuests(sh){
  if(sh.gv)return;sh.gv=1;
  for(const id in sh.edits||{}){const x=sh.edits[id],o=sh.episodes.find(e=>e.id===id);
    if(!o||x.title==null||x.guests!=null)continue;
    const sp=splitGuest(x.title),op=partsOf(o.title);
    x.title=sp.title;if(x.title===op.title)delete x.title;
    if(guestJoin(sp.guests)!==guestJoin(op.guests))x.guests=guestJoin(sp.guests);}
}
// .title is the title without guests, .guests the guest names (yours if you've edited them, else read from the feed's title)
function eps(sh){
  migrateGuests(sh);
  const ed=sh.edits||{};
  return sh.episodes.map(e=>{const x=ed[e.id],op=partsOf(e.title);
    const or=(v,d)=>v==null?d:v;
    if(!x)return {...e,title:op.title,guests:op.guests,tag:feedTag(e)};

// the tapped card glides up beneath the others while they shift down together to open the space at the top

function slideEase(t){
  const x1=.45,y1=0,x2=.4,y2=1,bx=u=>3*x1*u*(1-u)**2+3*x2*u*u*(1-u)+u**3,by=u=>3*y1*u*(1-u)**2+3*y2*u*u*(1-u)+u**3;

// when, during the 0.9s slide, the moving card is (nearly) covered by the cards above it: [delay, length] in seconds
function coverWindow(moves,mover){
  const D=.9,list=[...document.querySelectorAll('#liblist > *')];
  const info=list.map(el=>{const r=el.getBoundingClientRect(),m=moves.find(x=>x[0]===el),dy=m?m[1]:0;return{el,top:r.top-dy,h:r.height,dy}});   // top = where it ends up (the rect still carries the start offset)
  const me=info.find(x=>x.el===mover);if(!me)return[.2,.45];
  const cov=[];
  for(let i=0;i<=90;i++){const k=1-slideEase(i/90),mt=me.top+me.dy*k,mb=mt+me.h;
    const segs=info.filter(x=>x!==me).map(x=>{const t=x.top+x.dy*k;return[Math.max(t,mt),Math.min(t+x.h,mb)]}).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);

function slideLib(before,movedId,oldBd){

    const dy=before.get(k)-el.getBoundingClientRect().top;if(Math.abs(dy)<1)return;moves.push([el,dy])});
  if(!moves.length)return;
  moves.forEach(([el,dy])=>{el.style.transition='none';el.style.transform=`translateY(${dy}px)`;
    el.style.position='relative';el.style.zIndex=el.dataset.show===movedId?'1':el.dataset.show?'2':'0'});

  const divs=[...document.querySelectorAll('#liblist > .list-divider')];
  divs.forEach(d=>{d.style.position='relative';d.style.zIndex='0'});

  const mv=moves.find(([el])=>el.dataset.show===movedId);

  if(mv&&oldBd){const [fd,fl]=coverWindow(moves,mv[0]),c=mv[0].getBoundingClientRect();   // only while it's actually hidden under the others
    oldBd.forEach(([q,html])=>{const now=mv[0].querySelector(q);if(!now||!html)return;
      const r=now.getBoundingClientRect(),tmp=document.createElement('div');tmp.innerHTML=html;const old=tmp.firstElementChild;
      old.style.position='absolute';old.style.left=(r.left-c.left)+'px';old.style.top=(r.top-c.top)+'px';old.style.width=r.width+'px';old.style.height=r.height+'px';
      old.style.boxSizing='border-box';old.style.zIndex='2';old.style.pointerEvents='none';old.style.transition=`opacity ${fl.toFixed(3)}s linear ${fd.toFixed(3)}s`;
      if(q==='.bd'){const bg=getComputedStyle(now).backgroundColor;old.style.background=bg&&bg!=='rgba(0, 0, 0, 0)'?bg:'var(--panel)'}   // its own tint, if it has one
      old.removeAttribute('onclick');old.classList.add('bd-old');mv[0].appendChild(old);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{old.style.opacity='0'}));
      setTimeout(()=>old.remove(),960);});}
  void document.body.offsetHeight;
  moves.forEach(([el])=>{el.style.transition='transform .9s cubic-bezier(.45,0,.4,1)';   /* the card going up and the ones going down move together, same timing */el.style.transform=''});
  setTimeout(()=>{moves.forEach(([el])=>{el.style.transition='';el.style.zIndex='';el.style.position=''});divs.forEach(d=>{d.style.zIndex='';d.style.position=''})},960);
}

// adds new episodes to a show; played marks are untouched, so Up Next stays where you are in the series
function mergeEpisodes(sh,eps,source){
  const wasCaughtUp=sh.episodes.length>0&&!upNext(sh);
  const before=new Set(sh.episodes.map(e=>e.id));
  const fresh=eps.filter(e=>!before.has(e.id)),added=fresh.length;
  if(added&&wasCaughtUp){sh.newAt=Date.now();sh.newEps=fresh.map(e=>e.id)}   // caught up and something new dropped: it goes to the top, marked new
  const now=new Set(eps.map(e=>e.id));   // keep episodes that dropped out of the feed, so history isn't lost
  sh.episodes=eps.concat(sh.episodes.filter(e=>!now.has(e.id)));

}

const DAY=86400000;
function bk(){if(!S.backup)S.backup={every:'week',day:new Date().getDay(),last:0};return S.backup}

/* ---------- backup location: a folder you pick once (where the browser allows it), kept for next time (same as Stack Tracker) ---------- */
const FS_OK=typeof window.showDirectoryPicker==='function';
const fsDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('pod-tracer-fs',1);

  v===undefined?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
let backupDir=null;

const BACKUP_FILE=/^pod-tracer-\d{4}-\d{2}-\d{2}\.json$/;
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const fsReady=FS_OK?fsGet('backupDir').then(h=>{backupDir=h||null}).catch(()=>{}):Promise.resolve();
async function pickBackupFolder(){

async function clearBackupFolder(){backupDir=null;try{await fsPut('backupDir',undefined)}catch(e){}if(view.name==='data')renderData()}
// writes the backup into the chosen folder; false if there isn't one or the browser won't allow it right now
async function backupToFolder(name,txt,ask=true){
  if(!backupDir)return false;
  try{
    let perm=await backupDir.queryPermission({mode:'readwrite'});
    if(perm!=='granted'&&ask)perm=await backupDir.requestPermission({mode:'readwrite'});   // after a while away, one tap to allow it again
    if(perm!=='granted')return false;
    const fh=await backupDir.getFileHandle(name,{create:true}),w=await fh.createWritable();
    await w.write(new Blob([txt],{type:'application/json'}));await w.close();
    try{   // keep the newest 10, delete older ones (only this app's own dated backup files)
      const ours=[];for await(const [n,e] of backupDir.entries())if(e.kind==='file'&&BACKUP_FILE.test(n))ours.push(n);
      ours.sort().reverse().slice(BACKUP_KEEP).forEach(n=>backupDir.removeEntry(n).catch(()=>{}));
    }catch(e){}
    return true;
  }catch(e){return false}
}
// saves a backup: the chosen folder, else the share sheet (Save to Files / Drive), else a download.
// Returns how it went: 'folder' | 'shared' | 'downloaded' | false (cancelled or failed)
async function saveBackup(){
  const txt=libraryJSON(), name=`pod-tracer-${todayKey()}.json`;
  await fsReady;
  if(await backupToFolder(name,txt))return'folder';
  // Android only shares certain file types, and .json isn't one: try it as .json, then as .txt (Import reads either)
  for(const [n,type] of [[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']]){
    try{
      const file=new File([txt],n,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Pod Tracer backup'});return'shared'}
    }catch(e){if(e&&e.name==='AbortError')return false;}
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);return'downloaded';
  }catch(e){return false}
}

  await fsReady;if(!backupDir)return{state:'none'};

// when the next backup is due: the day after the last (Daily), or the picked weekday after it (Weekly)
function nextBackup(){

  const d=new Date(b.last);d.setHours(0,0,0,0);
  if(b.every==='day')return d.getTime()+DAY;
  let n=new Date(d.getTime()+DAY);while(n.getDay()!==b.day)n=new Date(n.getTime()+DAY);
  return n.getTime();

// import: check pasted / loaded JSON, then Merge or Replace
function parseImport(txt){
  if(!txt.trim())return{state:'wait'};
  let d;txt=txt.replace(/^\uFEFF/,'').trim();
  try{d=JSON.parse(txt)}catch(e){
    const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    try{d=JSON.parse(txt.slice(a,b+1))}catch(e2){return{state:'error',msg:'Not valid JSON'}}
  }
  if(!d||typeof d.shows!=='object'||!Array.isArray(d.order))return{state:'error',msg:'Not a Pod Tracker backup'};
  d=stripPlaceholders(d);
  if(!d.order.length)return{state:'error',msg:'Only sample podcasts in this backup'};
  const shows=d.order.map(id=>d.shows[id]).filter(Boolean);
  const played=shows.reduce((n,sh)=>n+Object.keys(sh.played||{}).length,0);
  return{state:'ok',data:d,msg:`${shows.length} podcast${shows.length===1?'':'s'} · ${played} played`};
}
function mergeImport(d){
  let added=0;
  d.order.forEach(id=>{
    const inc=d.shows[id];if(!inc)return;
    const cur=S.shows[id];
    if(!cur){S.shows[id]=inc;S.order.push(id);added++;return}
    const have=new Set(cur.episodes.map(e=>e.id));
    cur.episodes=cur.episodes.concat((inc.episodes||[]).filter(e=>!have.has(e.id)));
    cur.played={...(inc.played||{}),...cur.played};
    if(inc.edits||cur.edits)cur.edits={...(inc.edits||{}),...(cur.edits||{})};
    if(inc.rename&&!cur.rename)cur.rename=inc.rename;
    if(inc.color&&!cur.color)cur.color=inc.color;
  });
  return added;
}

  const t=$('#dt-import-text');if(!t)return;
  t.value=txt;updateImportStatus();
  if(parseImport(txt).state!=='ok')toast(`${f.name} isn’t a Pod Tracer backup`);
});

// title and guest share three lines: a one-line title leaves the guests two lines, a two-line title leaves them one
function fitGuests(){
  document.querySelectorAll('.v4 .gu').forEach(gu=>{
    const et=gu.previousElementSibling;if(!et)return;
    const lh=parseFloat(getComputedStyle(et).lineHeight)||16;
    const lines=Math.round(et.getBoundingClientRect().height/lh);
    gu.style.setProperty('--gl',lines<=1?2:1);
  });
}
