function renderLibList(){
  let shows=S.order.map(id=>S.shows[id]).filter(Boolean);
  const q=(view.libQ||'').trim().toLowerCase();
  if(q)shows=shows.filter(s=>(nm(s)+' '+au(s)).toLowerCase().includes(q));
  const lf=view.libFilter||'all';
  if(lf!=='all')shows=shows.filter(s=>{const p=playedCount(s),t=totalCount(s);
    return lf==='caught'?(t>0&&p===t):lf==='notstarted'?p===0:(p>0&&p<t)});
  const pct=s=>{const t=totalCount(s);return t?playedCount(s)/t:0};
  const recency=sh=>Math.max(lastPlayed(sh),sh.newAt||0);   // last played, or when a new episode woke a caught-up show
  if(view.libSort==='recent')shows.sort((a,b)=>recency(b)-recency(a));
  if(view.libSort==='title')shows.sort((a,b)=>nm(a).localeCompare(nm(b)));
  if(view.libSort==='progress')shows.sort((a,b)=>pct(b)-pct(a));
  if(view.libSort==='updated')shows.sort((a,b)=>Math.max(...b.episodes.map(e=>e.date),0)-Math.max(...a.episodes.map(e=>e.date),0));
  let h='';

}

/* ---------- library cards ---------- */
// how high the check square fills: the first 1% of a show takes 3% of the height (so starting is visible),
// the last 5% takes the top 10% (so the end is visible), and 1–95% spreads over the rest
function fillHeight(f){
  if(f<=0)return 0;
  if(f>=1)return 1;
  if(f<=.01)return f/.01*.03;
  if(f>=.95)return .9+(f-.95)/.05*.1;
  return .03+(f-.01)/.94*.87;
}
const CHK='<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
// an ended show you've finished: two checks stacked, the front one casting a soft shadow onto the back one
const CHK1='<svg class="ck ck1" viewBox="0 0 24 24"><path d="M5.5 12.6l3.9 3.9L17.5 8.2" stroke="rgba(0,0,0,.4)" transform="translate(-.8 .8)"/><path d="M5.5 12.6l3.9 3.9L17.5 8.2"/></svg>';   // the list's single check, drawn like the white one of the pair
const CHK2='<svg class="ck ck2" viewBox="0 0 24 24"><path d="M2.6 12.6l3.9 3.9L14.6 8.2" stroke="#f0cf6e"/>'+
  '<path d="M8.4 12.6l3.9 3.9L20.4 8.2" stroke="rgba(0,0,0,.4)" transform="translate(-.8 .8)"/><path d="M8.4 12.6l3.9 3.9L20.4 8.2"/></svg>';   // gold behind, white in front
function info(sh){const p=playedCount(sh),t=totalCount(sh),f=t?p/t:0;return{p,t,f,left:t-p,done:t>0&&p===t,nx:upNext(sh)}}
const onCard=id=>`data-show="${id}" style="${colorVars(id)}" onclick="openShow('${id}')"`;
const onChk=id=>`onclick="listenNext('${id}',event)"`;

// a new episode that dropped while you were caught up, still under two weeks old and not yet checked: its check shows green
const NEW_FOR=14*86400000;
const isFresh=(sh,nx)=>!!(nx&&sh.newEps&&sh.newEps.includes(nx.id)&&Date.now()-(nx.date||0)<NEW_FOR);
// the left square of the podcast window's card: the show's color with three stacked downward triangles, white to grey, each casting a shadow
// white at the top to grey at the bottom; drawn bottom first so the top one lies over the others and its shadow falls on them.
// Tapping it scrolls the list to the next episode
const TRI_SEC=`<button type="button" class="tri-sec" onclick="goToNext()" aria-label="Show the next episode in the list"><svg viewBox="0 0 40 40" aria-hidden="true">${
  [['#a9a59e',21.5],['#d6d3ce',15],['#ffffff',8.5]].map(([c,y])=>`<polygon points="7.5,${y} 32.5,${y} 20,${y+12}" fill="${c}" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>`).join('')}</svg></button>`;
// bring the next episode into view, centered between the header and the bottom of the screen (or as near as scrolling allows);
// if a filter, tab or search is hiding it, those are cleared first
function goToNext(){
  const sh=S.shows[view.id];const nx=sh&&upNext(sh);if(!nx)return;
  const find=()=>document.querySelector(`#eps .ep[data-id="${CSS.escape(nx.id)}"]`);
  let row=find();
  if(!row){view.filter='all';view.tag='all';view.q='';const q=$('#sfq');if(q){q.value='';$('#sf-card').classList.remove('searching')}
    if($('#sf-fname'))$('#sf-fname').textContent=SF.show.filters.all[1];renderEpisodes();row=find();}
  if(!row)return;
  const hh=$('#app-header').getBoundingClientRect().bottom,r=row.getBoundingClientRect();
  const y=scrollY+r.top+r.height/2-(hh+(innerHeight-hh)/2);
  scrollTo({top:Math.max(0,y),behavior:'smooth'});
  row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');
}
// the podcast window's own simple card: name, next episode, stats, and the check (or the caught-up / completed state)
function showNextCard(sh){
  const {p,t,f,left,nx}=info(sh);
  if(nx)return `<div class="oc v5 bare">${TRI_SEC}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell">${esc(nx.title)}</span><span class="mt ell">${nx.label} · ${fmtDate(nx.date)}${nx.dur?' · '+fmtDur(nx.dur):''} · ${p}/${t} (${left})</span></div>
      <span class="cks" style="--f:${fillHeight(f)}"><button type="button" class="rnd ${isFresh(sh,nx)?'fresh':''}" onclick="showListenNext()" aria-label="Mark listened">${CHK}</button></span></div>`;
  const lt=countedEps(sh).sort((a,b)=>b.date-a.date)[0]||{date:0},lp=lastPlayed(sh);
  return `<div class="oc v5 bare cu">${TRI_SEC}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell cu-say">${sh.ended?'Completed':'Coming soon…'}</span><span class="mt ell">${sh.ended?'Ended':'Caught up'} · ${fmtDate(lt.date)} · ${p}/${t} (0)${lp?' · '+ago(lp):''}</span></div>
      <span class="cks gold ${sh.ended?'end':''}"><span class="rnd">${sh.ended?CHK2:CHK}</span></span></div>`;
}
function showListenNext(){
  const sh=S.shows[view.id];const nx=sh&&upNext(sh);if(!nx)return;
  sh.played[nx.id]=Date.now();save();renderEpisodes();updateProgress();
}
function libCards(shows){
  const go=shows.filter(sh=>upNext(sh)), done=shows.filter(sh=>!upNext(sh));
  let h='';
  const simple=S.libView==='simple',list=S.libView==='list';
  if(go.length)h+=go.map(sh=>{
    const {p,t,f,left,nx}=info(sh);
    // list: podcast name over the episode, check square, thin progress bar along the bottom of the text side
    if(list)return `<div class="oc v6" ${onCard(sh.id)}><span class="lst"><b>${p}</b><i></i><b>${t}</b></span><div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell">${esc(nx.title)}</span><span class="lbar" style="--f:${f.toFixed(4)}"><span class="fl ${p?'on':''}"></span></span></div>
      <span class="cks" onclick="event.stopPropagation()"><button type="button" class="rnd ${isFresh(sh,nx)?'fresh':''}" ${onChk(sh.id)} aria-label="${isFresh(sh,nx)?'New episode: mark listened':'Mark listened'}">${CHK1}</button></span></div>`;
    // simple: one standard 45px card, square art | podcast, episode (one line), guests | square check that fills
    if(simple)return `<div class="oc v5" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell">${esc(nx.title)}</span><span class="mt ell">${nx.label} · ${fmtDate(nx.date)}${nx.dur?' · '+fmtDur(nx.dur):''} · ${p}/${t} (${left})</span></div>
      <span class="cks" style="--f:${fillHeight(f)}" onclick="event.stopPropagation()"><button type="button" class="rnd ${isFresh(sh,nx)?'fresh':''}" ${onChk(sh.id)} aria-label="${isFresh(sh,nx)?'New episode: mark listened':'Mark listened'}">${CHK}</button></span></div>`;
    return `<div class="oc v4" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span>${(()=>{const sg=nx;return sg.guests.length
          ?`<span class="mid"><span class="et one">${esc(sg.title)}</span><span class="gu">${esc(guestText(sg.guests))}</span></span>`
          :`<span class="mid"><span class="et">${esc(sg.title)}</span></span>`})()}
        <span class="mt">${nx.label} · ${fmtDate(nx.date)}${nx.dur?' · '+fmtDur(nx.dur):''} · ${p}/${t} (${left})</span></div>
      <span class="cks" style="--f:${fillHeight(f)}" onclick="event.stopPropagation()"><button type="button" class="rnd ${isFresh(sh,nx)?'fresh':''}" ${onChk(sh.id)} aria-label="${isFresh(sh,nx)?'New episode: mark listened':'Mark listened'}">${CHK}</button></span></div>`;
  }).join('');
  // caught up: the same card as the others, showing the latest episode; the check square turns gold,
  // its circle takes the podcast's color with a white check
  // caught up on shows still releasing, then a Completed section for ended shows you've finished
  const doneCard=sh=>{
    const {p,t}=info(sh);
    const lt=countedEps(sh).sort((a,b)=>b.date-a.date)[0]||{title:'',guests:[],date:0};
    const lp=lastPlayed(sh);
    const chk=`<span class="cks gold ${sh.ended?'end':''}" aria-label="${sh.ended?'Ended and finished':'Caught up'}"><span class="rnd">${sh.ended?CHK2:CHK}</span></span>`;
    // no episode names here: a finished, ended show just says so; a caught-up one is waiting for what's next
    const say=sh.ended?'Completed':'Coming soon…';
    if(list)return `<div class="oc v6 cu" ${onCard(sh.id)}><span class="lst"><b>${p}</b><i></i><b>${t}</b></span><div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell cu-say">${say}</span><span class="lbar" style="--f:1"><span class="fl on"></span></span></div>${sh.ended?chk:chk.replace(CHK,CHK1)}</div>`;   // caught up: the same thin check, in gold
    if(simple)return `<div class="oc v5 cu" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="et ell cu-say">${say}</span><span class="mt ell">${sh.ended?'Ended':'Caught up'} · ${fmtDate(lt.date)} · ${p}/${t} (0)${lp?' · '+ago(lp):''}</span></div>${chk}</div>`;
    return `<div class="oc v4 cu" ${onCard(sh.id)}>${artSec(sh.art,sh.id,nm(sh))}
      <div class="bd"><span class="k ell">${esc(nm(sh))}</span><span class="mid"><span class="et cu-say">${say}</span></span>
        <span class="mt">${sh.ended?'Ended':'Caught up'} · ${fmtDate(lt.date)} · ${p}/${t} (0)${lp?' · '+ago(lp):''}</span></div>${chk}</div>`;
  };
  const cu=done.filter(sh=>!sh.ended), fin=done.filter(sh=>sh.ended);
  if(cu.length)h+='<div class="list-divider"><span>Caught Up</span></div>'+cu.map(doneCard).join('');
  if(fin.length)h+='<div class="list-divider"><span>Completed</span></div>'+fin.map(doneCard).join('');
  return h;
}

      <input id="relay-url" placeholder="Your relay, e.g. https://feeds.you.workers.dev/?url=" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.relay||'')}"></div>

        <div class="main"><span class="t">${esc(nm(sh))}</span><span class="a">${sh.episodes.length} from Apple · ${sh.feedIssue==='unreadable'?'feed loaded but couldn’t be read':sh.feedIssue==='unreachable'?'no relay could reach the feed':'not checked yet, tap Retry'}</span></div>

// Data › Feeds › Refresh all: every podcast's feed, one after another, with a running count
const RA={busy:''};
async function refreshAll(){
  if(RA.busy)return;   // runs even if the quiet background check is going; merging twice is harmless
  const ids=[...S.order];let n=0,added=0;
  for(const id of ids){
    n++;RA.busy=`Checking ${n} of ${ids.length}…`;if(view.name==='data'&&view.dt==='feeds')dtFeeds();
    const sh=S.shows[id];if(!sh)continue;
    try{const {eps,source}=await getEpisodes(sh);if(S.shows[id]&&eps.length){added+=mergeEpisodes(S.shows[id],eps,source);save()}}catch(e){}
  }
  S.lastAuto=Date.now();S.lastStuck=Date.now();save();RA.busy='';
  toast(added?`${added} new episode${added>1?'s':''} across your podcasts`:'Everything is up to date',3000);
  if(view.name==='data'&&view.dt==='feeds')dtFeeds();else if(view.name==='lib')renderLibList();
}
async function saveRelay(){
  const v=$('#relay-url').value.trim();
  if(v&&!/^https:\/\//i.test(v)){toast('The relay needs to start with https://');return}
  S.relay=v||undefined;save();
  if(!v){toast('Relay removed');dtFeeds();return}
  // test it on a real feed: one of yours if you have any
  const sh=S.order.map(id=>S.shows[id]).find(x=>x&&x.feedUrl);
  if(!sh){toast('Relay saved');dtFeeds();return}
  toast('Testing your relay…',20000);
  let ok=false;
  try{const r=await fetchTimeout(relayURL(v,sh.feedUrl),30000);ok=r.ok&&/<item[\s>]/i.test(await r.text())}catch(e){}
  toast(ok?`Relay works: it loaded ${nm(sh)}`:'Saved, but the relay didn’t return a feed. Check the address.',4000);
  dtFeeds();
}
async function retryFeeds(ids,btn){
  if(btn){btn.disabled=true;btn.textContent='Loading…'}
  let fixed=0;
  for(const id of ids){
    const sh=S.shows[id];if(!sh)continue;
    try{const {eps,source}=await getEpisodes(sh);if(eps.length){mergeEpisodes(sh,eps,source);save();if(source==='rss')fixed++}}catch(e){}
  }
  toast(fixed?`Full list loaded for ${fixed} show${fixed===1?'':'s'}`:'Still couldn’t reach '+(ids.length===1?'that feed':'those feeds'),3500);
  if(view.name==='data'&&view.dt==='feeds')dtFeeds();
}

function updateImportStatus(){

async function paintRestore(){
  const box=$('#dt-restore');if(!box)return;
  const r=await folderBackups();if(!$('#dt-restore'))return;
  if(r.state==='ask'){
    box.innerHTML=`<button type="button" class="rs-card"><span class="rs-when">Show backups</span><span>Tap to allow the ${esc(backupDir.name)} folder</span></button>`;
    box.firstChild.onclick=async()=>{try{if(await backupDir.requestPermission({mode:'readwrite'})==='granted')paintRestore()}catch(e){}};
    return;
  }
  if(r.state!=='ok'||!r.files.length){box.innerHTML='';return}
  box.innerHTML=r.files.map((f,i)=>{const m=f.name.match(/(\d{4})-(\d{2})-(\d{2})/),d=new Date(+m[1],+m[2]-1,+m[3]);

async function pasteImport(){
  const t=$('#dt-import-text');

    const txt=await navigator.clipboard.readText();

    t.value=txt;updateImportStatus();
  }catch(e){t.focus();toast('Press and hold in the box below, then Paste')}
}

// what Edit can change on a show (episode edits, its name and publisher, its color), kept so Cancel can put it back
function takeEditSnapshot(sh){view.snap={id:sh.id,data:JSON.stringify({edits:sh.edits||null,rename:sh.rename||null,color:sh.color||null,colorHS:sh.colorHS||null,tags:sh.tags||null})}}
function restoreEditSnapshot(sh){
  if(!view.snap||view.snap.id!==sh.id)return;
  const d=JSON.parse(view.snap.data);
  for(const k of ['edits','rename','color','colorHS','tags'])if(d[k]==null)delete sh[k];else sh[k]=d[k];
  view.snap=null;save();
}
function renderShow(){

  $('#tb-title').textContent=view.edit?'Edit Podcast':'Podcast';   // the bar names the window; the podcast's name is in the card below

  const backBtn=$('#tb-back');backBtn.textContent=view.edit?'Cancel':'Back';backBtn.classList.toggle('cancel',!!view.edit);
  backBtn.onclick=()=>{
    if(!view.edit){go('lib');return}
    if(document.activeElement)document.activeElement.blur();   // a box still being typed in saves first, then gets undone with the rest

  };
  const editBtn=$('#tb-edit');editBtn.textContent=view.edit?'Done':'Edit';editBtn.classList.toggle('on',!!view.edit);
  editBtn.onclick=()=>{
    if(document.activeElement)document.activeElement.blur();

          <input class="se-author" value="${esc(au(sh))}" placeholder="${esc(sh.author||'Publisher')}" aria-label="Publisher" enterkeyhint="done"></div>
        <button type="button" class="ee-reset se-reset" title="Back to the feed’s name and publisher" ${renamed?'':'hidden'}>↺</button></div>

      <button type="button" class="dt-card rm-show" id="rm-show">Remove this podcast<b>${esc(nm(sh))} and its played history</b></button>`;
    $('#rm-show').onclick=()=>{view.edit=false;view.snap=null;removeShow()};

    <div class="show-col"><div class="title-card"><span class="t">${esc(nm(sh))}</span></div>${sfCard(true)}</div>
    <button type="button" class="gear-card" id="st-open" style="${colorVars(sh.id)}" title="Settings for this podcast" aria-label="Settings for this podcast">${GEAR}</button>`;
  wireSfCard();

function colorCards(sh){
  const cur=cloth(sh.id), hi=nearestHue(cur);
  const [h,sat]=sh.colorHS||hexToHsl(cur), tones=tonesFor(h,sat), ti=toneIndex(tones,cur);
  return `<div class="cp-pair"><div class="cp-row" id="cp-hues" aria-label="Color">${HUES.map(([n,c],i)=>`<button type="button" data-color="${c}" title="${n}" style="background:${c}" class="${i===hi?'on':''}"></button>`).join('')}</div>
    <div class="cp-row" id="cp-tones" aria-label="Tone">${tones.map((c,i)=>`<button type="button" data-color="${c}" style="background:${c}" class="${i===ti?'on':''}"></button>`).join('')}</div></div>
    <button type="button" class="dt-card cp-auto" id="cp-auto"><span>${sh.color?'Tap here for name-based color':'Using the name-based color'} ·</span><b>${sh.color?'Custom color '+cur.toUpperCase():'Generated from “'+esc(sh.title)+'”'}</b></button>`;
}
function setShowColor(sh,hex){if(hex)sh.color=hex;else delete sh.color;save();renderShow()}
$('#app').addEventListener('click',e=>{
  if(view.name!=='show'||!view.edit)return;
  const sh=S.shows[view.id];if(!sh)return;
  const hb=e.target.closest('#cp-hues [data-color]');
  // a new color keeps the tone you're on: same step along its ten tones, just in the new color
  if(hb){const cur=cloth(sh.id),[ch,cs]=sh.colorHS||hexToHsl(cur),ti=toneIndex(tonesFor(ch,cs),cur);
    const [h,s]=hexToHsl(hb.dataset.color);sh.colorHS=[h,s];setShowColor(sh,tonesFor(h,s)[ti]);return}
  const tb=e.target.closest('#cp-tones [data-color]');
  if(tb){if(!sh.colorHS){const [h,s]=hexToHsl(cloth(sh.id));sh.colorHS=[h,s]}setShowColor(sh,tb.dataset.color);return}
  if(e.target.closest('#cp-auto')&&sh.color){delete sh.colorHS;setShowColor(sh,null)}
});

/* ---------- a podcast's settings (the gear): what counts toward progress, mark all / clear all, remove ---------- */
const GEAR=(()=>{   // a chunky cartoon gear: eight rounded teeth, thick outline, the podcast's color
  const pts=[],N=8;
  for(let i=0;i<N;i++){const a=i*2*Math.PI/N;
    for(const [d,r] of [[-.30,33],[-.20,45],[.20,45],[.30,33]])pts.push([50+r*Math.cos(a+d),50+r*Math.sin(a+d)]);}
  const path='M'+pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${path}" fill="color-mix(in srgb, var(--cloth) 62%, #fff)" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="13" fill="#efeadf" stroke="#000" stroke-width="6"/><path d="M33 38 A20 20 0 0 1 44 31" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="5" stroke-linecap="round"/></svg>`;
})();

let fogTimer=0;
function fogWheels(){clearTimeout(fogTimer);document.querySelectorAll('#eps .ee-len.active').forEach(x=>x.classList.remove('active'))}
function wheelIdle(){clearTimeout(fogTimer);fogTimer=setTimeout(fogWheels,5000)}
document.addEventListener('pointerdown',e=>{
  const a=document.querySelector('#eps .ee-len.active');if(!a)return;
  if(a.contains(e.target))wheelIdle();else if(!e.target.closest('.ee-fog'))fogWheels();
},true);
function twSave(w){
  const box=w.closest('.ep-ed'),sh=S.shows[view.id];if(!box||!sh)return;
  const v=[...box.querySelectorAll('.tw-wheel')].map(x=>+x.dataset.v);
  setEdit(sh,box.dataset.id,'dur',v[0]*3600+v[1]*60+v[2]);
  const on=!!(sh.edits&&sh.edits[box.dataset.id]);
  box.classList.toggle('edited',on);
}
function twSettle(w,pos,vel){
  const k=+w.dataset.k;cancelAnimationFrame(w._af);
  const clamp=p=>twWrap(k)?p:Math.max(0,Math.min(99,p));
  let last=null;
  const glide=ts=>{                              // a flick keeps it rolling, slowing down
    if(last===null){last=ts;w._af=requestAnimationFrame(glide);return}
    const dt=Math.min(.04,(ts-last)/1000);last=ts;
    const np=pos+vel*dt;vel*=Math.exp(-5*dt);
    if(!twWrap(k)&&(np<0||np>99)){pos=clamp(np);vel=0}else pos=np;   // hours stop dead at 0 or 99
    twPaint(w,pos);
    if(Math.abs(vel)<2)snap();else w._af=requestAnimationFrame(glide);
  };
  const snap=()=>{                               // then eases onto the nearest number
    const from=pos,to=clamp(Math.round(pos));let st=null;
    const f=ts=>{if(st===null)st=ts;const t=Math.min(1,(ts-st)/110);
      pos=from+(to-from)*(1-Math.pow(1-t,3));twPaint(w,pos);
      if(t<1)w._af=requestAnimationFrame(f);
      else{const v=twWrap(k)?twMod(to,60):to;w.dataset.v=v;w._pos=v;twPaint(w,v);twSave(w)}};
    w._af=requestAnimationFrame(f);
  };
  if(Math.abs(vel)<2)snap();else w._af=requestAnimationFrame(glide);
}
$('#app').addEventListener('pointerdown',e=>{
  const w=e.target.closest('.tw-wheel');if(!w||view.name!=='show'||!view.edit||!w.closest('.ee-len.active'))return;
  cancelAnimationFrame(w._af);e.preventDefault();
  const k=+w.dataset.k,start=w._pos!=null?w._pos:+w.dataset.v,y0=e.clientY;let pos=start;
  const samples=[{t:e.timeStamp,y:e.clientY}];
  try{w.setPointerCapture(e.pointerId)}catch(_){}
  const move=ev=>{wheelIdle();pos=start-(ev.clientY-y0)/TW_ROW;if(!twWrap(k))pos=Math.max(0,Math.min(99,pos));twPaint(w,pos);
    samples.push({t:ev.timeStamp,y:ev.clientY});while(samples.length>1&&ev.timeStamp-samples[0].t>100)samples.shift()};
  const up=()=>{w.removeEventListener('pointermove',move);w.removeEventListener('pointerup',up);w.removeEventListener('pointercancel',up);
    const a=samples[0],b=samples[samples.length-1];
    const vel=b.t>a.t?-((b.y-a.y)/(b.t-a.t))*1000/TW_ROW:0;twSettle(w,pos,vel)};
  w.addEventListener('pointermove',move);w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
});
$('#app').addEventListener('wheel',e=>{           // mouse wheel: one notch at a time
  const w=e.target.closest('.tw-wheel');if(!w||view.name!=='show'||!view.edit||!w.closest('.ee-len.active'))return;
  e.preventDefault();cancelAnimationFrame(w._af);
  const p=(w._pos!=null?w._pos:+w.dataset.v)+(e.deltaY>0?1:-1);twSettle(w,p,0);
},{passive:false});
// edit mode: save as you go. A title saves when you leave the box, a date when it's picked, a tag when tapped
$('#app').addEventListener('change',e=>{
  const box=e.target.closest('.ep-ed');if(!box||view.name!=='show')return;
  const sh=S.shows[view.id],id=box.dataset.id,orig=sh.episodes.find(x=>x.id===id);if(!orig)return;
  if(e.target.classList.contains('ee-title'))setEdit(sh,id,'title',e.target.value.trim());
  if(e.target.classList.contains('ee-guests'))setEdit(sh,id,'guests',guestJoin(guestParse(e.target.value)));
  // season and episode numbers (optional): from the feed when it has them; clear the box to go back to the feed's
  if(e.target.classList.contains('ee-num')){const v=parseInt(e.target.value.replace(/\D/g,''),10);setEdit(sh,id,e.target.dataset.f,v>0?v:null)}
  if(e.target.classList.contains('ee-date')){
    const v=e.target.value;
    if(!v)setEdit(sh,id,'date',null);
    else if(v===toDay(orig.date))setEdit(sh,id,'date',orig.date);          // same day as the feed: keep the feed's exact time
    else{const [y,m,d]=v.split('-').map(Number);setEdit(sh,id,'date',new Date(y,m-1,d,12).getTime())}
  }
  renderEpisodes();
});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&(e.target.classList.contains('ee-title')||e.target.classList.contains('ee-guests')||e.target.classList.contains('ee-num')))e.target.blur()});
$('#app').addEventListener('click',e=>{
  const box=e.target.closest('.ep-ed');if(!box||view.name!=='show')return;
  const dt=e.target.closest('.ee-date');if(dt){try{dt.showPicker&&dt.showPicker()}catch(_){}return}   // anywhere on the date opens the calendar
  const sh=S.shows[view.id],id=box.dataset.id;
  const t=e.target.closest('.ee-tag [data-tag]');
  if(t){setEdit(sh,id,'tag',t.dataset.tag);renderEpisodes();return}
  if(e.target.closest('.ee-addtag')){openTagPage(id);return}
  const fog=e.target.closest('.ee-fog');
  if(fog){fogWheels();fog.parentElement.classList.add('active');wheelIdle();return}   // + : the tags window
});
$('#app').addEventListener('click',e=>{
  const row=e.target.closest('.ep');if(!row||view.name!=='show')return;
  const th=e.target.closest('.thru');
  if(th){   // two taps: the first arms it, the second (within 3 seconds) does it
    if(th.classList.contains('armed')){th.classList.remove('armed');playedThrough(row.dataset.id);return}
    document.querySelectorAll('#eps .thru.armed').forEach(x=>x.classList.remove('armed'));
    th.classList.add('armed');clearTimeout(th._t);th._t=setTimeout(()=>th.classList.remove('armed'),3000);return}
  else toggleEp(row.dataset.id);
});

load();syncPlaceholders();render();window.__ptStarted=true;checkBackup();autoRefresh();

/* ---------- offline: the service worker keeps a copy of the app (only when served over http/https, e.g. GitHub Pages) ---------- */
try{
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    const reg=()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}};
    if(document.readyState==='complete')reg();else window.addEventListener('load',reg);
  }
}catch(e){}   // some editor previews don't allow it at all; the app works the same without it
</script>
