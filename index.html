<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pod Tracer</title>
<!-- installable, works offline: manifest + icons + service worker (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Pod Tracer">
<meta name="description" content="Track the podcast episodes you've listened to.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#efeadf; --wood:#8a6a4f; --ink:#2b2620; --muted:#8a8378;
    --panel:#ffffff; --unread:#e3ddce; --red:#aa3333; --line:#000;
    --lines:repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 4px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); min-height:100vh;
    padding:calc(var(--header-h,50px) + 4px) 4px calc(var(--footer-h,0px) + 4px);}
  button,input{font:inherit; color:inherit;}
  button{cursor:pointer;}
  #app{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:4px;}

  /* ---- frozen header: page tabs edge to edge, then a row of controls ---- */
  #app-header{position:fixed; top:0; left:0; right:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:0 0 4px; background:var(--bg); border-bottom:3px solid #000;}
  #app-header.bare{padding-bottom:0;}
  #tabs{display:flex; padding-top:env(safe-area-inset-top); border-bottom:3px solid #000;}
  #app-header.bare #tabs{border-bottom:none;}
  #tabs .tab{flex:1 1 0; height:42px; display:flex; align-items:center; justify-content:center; background:var(--bg);
    font-family:Arial,sans-serif; font-size:.85rem; font-weight:600; letter-spacing:.3px; cursor:pointer; user-select:none;}
  #tabs .tab + .tab{border-left:3px solid #000;}
  #tabs .tab.active{background:var(--ink); color:#fff;}
  .hdr-row{display:flex; align-items:stretch; gap:4px; margin:0 4px; height:45px;}
  .hdr-row > *{min-width:0;}
  .hdr-row:empty{display:none;}

  /* ---- frozen footer ---- */
  #app-footer{position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom)); background:var(--bg); border-top:3px solid #000;}
  #app-footer:empty{display:none;}

  /* ---- shared GT50 card pieces ---- */
  .card{background:var(--panel); border:3px solid #000; border-radius:8px;}
  .seg, .acts{display:flex; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .seg button, .acts button{flex:1; min-width:0; margin:0; padding:0 4px; border:none; border-radius:0; background:var(--panel);
    color:var(--ink); font-family:Arial,sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.3px; white-space:nowrap;}
  .seg button + button, .acts button + button{border-left:3px solid #000;}
  .seg button.on{background:var(--ink); color:#fff;}
  .acts button:active, .seg button:active{background:var(--bg);}
  .acts .del{color:var(--red);}
  .acts button:disabled{color:var(--muted);}
  .ink-btn{flex:0 0 auto; height:45px; padding:0 16px; border:3px solid #000; border-radius:8px; background:var(--ink); color:#fff;
    font-family:Arial,sans-serif; font-size:.8rem; font-weight:600; letter-spacing:.3px;}
  .plain-btn{flex:0 0 auto; height:45px; padding:0 12px; border:3px solid #000; border-radius:8px; background:var(--panel);
    font-family:Arial,sans-serif; font-size:.78rem; font-weight:600;}
  .field-card{flex:1; display:flex; align-items:center; height:45px; padding:0 10px; background:var(--panel); border:3px solid #000; border-radius:8px;}
  #app .field-card{flex:none;}
  .field-card input{width:100%; border:none; outline:none; background:none; font-family:Georgia,serif; font-size:.9rem;}
  .field-card svg{width:18px; height:18px; flex:none; margin-right:8px;}
  .sort-card{flex:0 0 27%; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
    background:var(--panel); border:3px solid #000; border-radius:8px; padding:0 8px; font-family:Arial,sans-serif;
    font-size:.78rem; cursor:pointer; user-select:none; white-space:nowrap;}
  .sort-card .k{color:var(--muted); font-size:.62rem; letter-spacing:.5px;}

  /* GT50 divider: no card, just a centered line split around the title */
  .list-divider{display:flex; align-items:center; gap:10px; height:45px; padding:0 4px;}
  .list-divider::before, .list-divider::after{content:''; flex:1; height:3px; background:#000; border-radius:2px;}
  .list-divider span{font-family:Georgia,serif; font-size:.9rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    max-width:75%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- a row card: 45px, progress fill behind ---- */
  .row{position:relative; display:flex; align-items:center; gap:8px; height:45px; padding:0 8px; background:var(--panel);
    border:3px solid #000; border-radius:8px; overflow:hidden; cursor:pointer; user-select:none;}
  .row:active{filter:brightness(.96);}
  .fill{position:absolute; left:-3px; top:-3px; bottom:-3px; pointer-events:none; background-color:var(--page);
    background-image:var(--lines); transition:width .3s ease;}
  .row > :not(.fill){position:relative;}
  /* cover art: a square section flush to the card's left edge, split off by a black line */
  /* cover art: runs right out to the card's edge; the border is drawn over it (::after), so the art's edges hide beneath it */
  .row.has-art, .card.show-head{position:relative; border:none; padding-left:0; padding-right:11px;}
  .row.has-art::after, .card.show-head::after{content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    border:3px solid #000; border-radius:8px;}
  .art-sec{align-self:stretch; width:45px; flex:none; border-right:3px solid #000;
    background-color:var(--unread); background-size:cover; background-position:center;}
  .row.has-art .fill{left:0; top:0; bottom:0;}
  .main{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; line-height:1.15;}
  .t{font-family:Georgia,serif; font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .a{font-family:Arial,sans-serif; font-size:.66rem; color:rgba(43,38,32,.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prog{flex:none; text-align:right; display:flex; flex-direction:column; justify-content:center; line-height:1.15;
    font-family:Georgia,serif; font-size:.82rem; font-weight:600;}
  /* finished: dark fill, white text */
  .row.done .fill{background-color:var(--cloth);}
  .row.done .t, .row.done .prog{color:#fff;}
  .row.done .a{color:rgba(255,255,255,.75);}
  .row .go{flex:none; height:31px; padding:0 12px; border:3px solid #000; border-radius:6px; background:var(--ink); color:#fff;
    font-family:Arial,sans-serif; font-size:.72rem; font-weight:600;}
  .row .go.open{background:var(--panel); color:var(--ink);}

  /* episode rows */
  .ep .t{font-size:.84rem;}
  .ep .thru{flex:none; width:33px; height:31px; padding:0; border:3px solid #000; border-radius:6px; background:var(--panel);
    font-family:Arial,sans-serif; font-size:.7rem; font-weight:700; color:var(--ink);}
  .ep.done{background:var(--cloth);}
  .ep.done .t{color:#fff; font-weight:400;}
  .ep.done .a{color:rgba(255,255,255,.7);}
  .ep.done .thru{background:rgba(255,255,255,.18); color:#fff;}

  /* show heading */
  .show-head{display:flex; align-items:stretch; gap:10px; padding:0 10px 0 0; height:96px; overflow:hidden;}
  .show-head .art-sec{width:96px;}
  .show-head .main{padding:6px 0;}
  .show-head .t{font-size:1.05rem; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .show-head .a{font-size:.72rem; margin-top:2px;}
  /* stats card: every stat in capitals */
  .stats{display:flex; flex-direction:column; justify-content:center; gap:2px; height:45px; padding:0 10px; background:var(--panel);
    border:3px solid #000; border-radius:8px; font-family:Arial,sans-serif; font-size:.58rem; line-height:1.15; color:var(--muted);
    text-transform:uppercase;}
  .stats .sr{display:flex; justify-content:space-between; gap:8px; white-space:nowrap;}
  .stats b{color:var(--ink);}
  .note{font-family:Arial,sans-serif; font-size:.66rem; color:var(--muted); line-height:1.4; padding:2px 4px;}
  .note.warn{color:var(--red);}

  /* footer: unified progress card */
  .pcard{position:relative; height:45px; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .pcard .fill{left:0; top:0; bottom:0;}
  .pcard .ov{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-size:.82rem; font-weight:600; line-height:1.2;}
  .pcard.done .fill{background-color:var(--cloth);}
  .pcard.done .ov{color:#fff;}
  .add-card{display:flex; align-items:center; justify-content:center; gap:8px; height:45px; background:var(--panel);
    border:3px solid #000; border-radius:8px; font-family:Arial,sans-serif; font-size:.82rem; color:var(--muted); letter-spacing:.5px; cursor:pointer;}
  .add-card b{font-size:1.1rem; color:var(--ink);}

  /* ---- Data: Backup | Export | Import, laid out like Stack Tracker's Data page ---- */
  .tabs{display:flex; flex:1; min-width:0; gap:3px; background:#000; border:3px solid #000; border-radius:8px; overflow:hidden;}
  .tabs .tab{flex:1; display:flex; align-items:center; justify-content:center; background:#d9d0be; color:var(--ink); cursor:pointer;
    font-family:Arial,sans-serif; font-size:min(.74rem, 2.95vw); font-weight:700; user-select:none;}
  .tabs .tab.active{background:var(--ink); color:#fff;}
  #app.fit{height:calc(100dvh - var(--header-h,50px) - var(--footer-h,0px) - 8px);}
  .dt-card{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; flex:none;
    height:45px; padding:0 8px; background:var(--panel); border:3px solid #000; border-radius:8px;
    font-family:Arial,sans-serif; font-size:.62rem; color:var(--muted); line-height:1.15;}
  .dt-card b{font-family:Georgia,serif; font-size:.9rem; font-weight:600; color:var(--ink); max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dt-card.error b{color:var(--red);}
  .dt-card.when{flex-direction:row; align-items:stretch; padding:0;}
  .dt-card.when > span{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 8px;}
  .dt-card.when > span + span{border-left:3px solid #000;}
  .dt-card.how{gap:3px; font-size:min(.62rem, 2.55vw); color:var(--ink);}
  .dt-card.how > span{max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dt-text{flex:1; min-height:0; width:100%; resize:none; margin:0; padding:8px; background:var(--panel); color:var(--ink);
    border:3px solid #000; border-radius:8px; outline:none; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.7rem;
    line-height:1.4; white-space:pre; overflow:auto;}
  .dt-split{display:flex; height:45px; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:var(--panel);}
  .dt-split button{flex:1; margin:0; padding:0; border:none; border-radius:0; background:var(--panel); color:var(--ink);
    font-family:Arial,sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.3px;}
  .dt-split button + button{border-left:3px solid #000;}
  .dt-split button.on{background:var(--ink); color:#fff;}
  /* Weekly, when picked: label on top, the day to back up on below it */
  .dt-split .wk{display:flex; flex-direction:column; align-items:stretch; justify-content:center;}
  .dt-split .wk-days{display:none;}
  .dt-split .wk.on .wk-label{flex:1; display:flex; align-items:center; justify-content:center; font-size:.72rem;}
  .dt-split .wk.on .wk-days{display:flex; flex:1; border-top:1.5px solid rgba(255,255,255,.28);}
  .dt-split .wk-days i{flex:1; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:.6rem; font-weight:700;}
  .dt-split .wk-days i + i{border-left:1.5px solid rgba(255,255,255,.28);}
  .dt-split .wk-days i.on{background:#5a4c40;}
  /* bookcloth buttons: the cloth color with a woven texture, label in spaced serif capitals */
  .dt-pair{display:flex; gap:4px;}
  .cloth-btn{position:relative; overflow:hidden; flex:1 1 0; min-width:0; height:45px; margin:0; padding:0; border:3px solid #000;
    border-radius:8px; color:#fff; cursor:pointer; background-color:var(--cloth);
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.12));
    font:700 min(1rem, 4vw)/1 Georgia,'Times New Roman',serif; letter-spacing:.14em; text-transform:uppercase;}
  .dt-pair:has(> :nth-child(3)) > .cloth-btn{font-size:min(.86rem, 3vw); letter-spacing:.08em; white-space:nowrap;}
  .cloth-btn:active{filter:brightness(.92);}
  /* backup reminder */
  .rr-modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(20,16,12,.45); opacity:0; pointer-events:none; transition:opacity .2s;}
  .rr-modal.open{opacity:1; pointer-events:auto;}
  .rr-box{width:100%; max-width:340px; background:var(--panel); border:3px solid #000; border-radius:10px; padding:16px;}
  .rr-title{font-family:Georgia,serif; font-size:1.05rem; margin-bottom:6px;}
  .rr-body{font-family:Arial,sans-serif; font-size:.78rem; color:var(--muted); line-height:1.4; margin-bottom:14px;}
  .rr-note{margin-top:10px; font-family:Arial,sans-serif; font-size:.64rem; color:var(--muted);}

  /* up-next cards: the border is drawn over the card (::after) so art and fills run under it */
  .oc{position:relative; display:flex; flex-direction:column; background:var(--panel); border-radius:8px; overflow:hidden; cursor:pointer; flex:none;}
  .oc::after{content:''; position:absolute; inset:0; z-index:3; pointer-events:none; border:3px solid #000; border-radius:8px;}
  .oc .sec{position:relative; display:flex; align-items:stretch; min-width:0;}
  .oc .sec > :not(.fill){position:relative;}
  .oc .fill{left:0; top:0; bottom:0;}
  .pill{flex:none; padding:1px 5px; background:#d9d0be; border:2px solid #000; border-radius:5px; font:700 .64rem/1.2 Arial,sans-serif; color:var(--ink); white-space:nowrap;}
  .ell{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .k{font:700 .56rem/1.1 Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
  .ck{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
  button:disabled{cursor:default;}

  .v4{height:66px; flex-direction:row;}
  .v4 .art-sec{width:66px;}
  /* podcast name pinned to the top, episode details to the bottom, episode title centered between them */
  .v4 .bd{flex:1; min-width:0; display:grid; grid-template-rows:auto 1fr auto; padding:7px 6px 7px 10px;}
  .v4 .bd > .k{align-self:start;}
  .v4 .bd > .mid{align-self:center; min-width:0; display:flex; flex-direction:column;}
  /* with a guest: the title keeps to one line so the guest line fits under it */
  .v4 .et.one{-webkit-line-clamp:1;}
  .v4 .gu{font:italic .68rem/1.2 Georgia,serif; color:rgba(43,38,32,.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .v4 .bd > .mt{align-self:end;}
  .v4 .et{font:700 .95rem/1.15 Georgia,serif;}
  .v4 .mt{font:.62rem Arial,sans-serif; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* the check: its own square section on the right, mirroring the art on the left */
  .v4 .cks{flex:none; width:66px; margin:0; padding:0 3px 0 0; border:none; border-left:3px solid #000; border-radius:0;
    display:grid; place-items:center;
    /* progress fills the square from the bottom up; measured over the part you can see (the card's border covers 3px top and bottom) */
    background:linear-gradient(to top, var(--cloth) calc(3px + (100% - 6px) * var(--f,0)), var(--unread) 0);
    background-origin:border-box; background-clip:border-box;}
  .v4 .rnd{width:38px; height:38px; display:grid; place-items:center; border:3px solid #000; border-radius:50%;
    background:var(--panel); color:var(--ink);}
  .v4 .cks:active .rnd{background:var(--cloth); color:#fff;}
  .cu-row{height:45px;}

  .v4 .et, .cu-row .t{white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-overflow:clip;}
  .v4 .art-sec, .cu-row .art-sec{background-position:center;}
  /* fixed heights: a wrapped title tightens its lines instead of growing the card */
  .v4 .et{font-size:.8rem; line-height:1.12;}
  .cu-row .t{font-size:.84rem; line-height:1.1;}
  .empty{padding:40px 12px; text-align:center; font-family:Arial,sans-serif; font-size:.8rem; color:var(--muted);}
  .spin{display:inline-block; width:14px; height:14px; border:3px solid var(--unread); border-top-color:var(--ink); border-radius:50%;
    animation:sp 1s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed; left:50%; top:calc(var(--header-h,50px) + 8px); transform:translate(-50%,-20px); opacity:0; z-index:50;
    background:var(--ink); color:#fff; border:3px solid #000; border-radius:8px; padding:10px 16px; font-family:Arial,sans-serif;
    font-size:.8rem; pointer-events:none; transition:opacity .2s, transform .2s; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

</style>
</head>
<body>
<div id="app-header">
  <div id="tabs">
    <div class="tab" data-v="lib">Library</div>
    <div class="tab" data-v="data">Data</div>
  </div>
  <div class="hdr-row" id="hdr-row"></div>
</div>
<main id="app"></main>
<div id="app-footer"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
<div class="rr-modal" id="bk-modal"><div class="rr-box">
  <div class="rr-title">Back up your podcasts?</div>
  <div class="rr-body" id="bk-modal-body">It's been a while since your last backup.</div>
  <div class="dt-split"><button id="bk-later">Later</button><button id="bk-go" class="on">Back Up</button></div>
  <div class="rr-note">Turn off in Data, Backup.</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='gt50-podtracker-v1';   // same storage as v1/v2
// Stack Tracker's cloth colors: each show gets one
const CLOTHS=['#7a2f2b','#2b5752','#66304c','#303d66','#8a6a3f','#4f5b2e','#5a3d2b'];
let S={shows:{},order:[]};
let view={name:'lib',id:null,filter:'all',sort:'new',q:'',results:[],searching:false,lastTerm:'',libSort:'recent'};

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}if(!S.shows)S={shows:{},order:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage full or blocked')}}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms=2400){const t=$('#toast');t.classList.remove('act');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function fmtDate(ms){if(!ms)return'—';return new Date(ms).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function parseDur(v){if(v==null||v==='')return 0;v=String(v).trim();if(/^\d+$/.test(v))return+v;const p=v.split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,b)=>a*60+b,0)}
function fmtDur(s){if(!s)return'';const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h}h ${m}m`:`${m}m`}
// a podcast's color comes from its name (and author), the same way Stack Tracker colors wishlist books:
// a hash picks one of fourteen color families, then a shade within it, darkened until white text reads on it
function wishColor(title, author){
  const s = (String(title || '').trim() + '|' + String(author || '').trim()).toLowerCase().replace(/\s+/g, ' ');
  let h1 = 2166136261, h2 = 5381;
  for(const ch of s){ const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 16777619); h2 = (Math.imul(h2, 33) + c) | 0; }
  // mixed well, so near-identical words still land far apart
  const mix = h => { h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return h >>> 0; };
  h1 = mix(h1); h2 = mix(h2 ^ 0x9e3779b9);
  // the hue: first one of fourteen colour families, each as likely as the next (greens are only olive, green
  // and teal — 3 in 14 — rather than the third of the wheel they'd otherwise take), then a spot within it

  const now=new Set(eps.map(e=>e.id));   // keep episodes that dropped out of the feed, so history isn't lost
  sh.episodes=eps.concat(sh.episodes.filter(e=>!now.has(e.id)));
  if(!(source==='itunes'&&sh.source==='rss'))sh.source=source;   // a failed feed check doesn't downgrade a full list
  sh.updatedAt=Date.now();
  return added;
}
async function refreshShow(btn){
  const sh=S.shows[view.id];if(!sh)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Refreshing';
  try{
    const {eps,source}=await getEpisodes(sh);
    const added=mergeEpisodes(sh,eps,source);save();
    toast(added?`${added} new episode${added>1?'s':''}`:'Up to date');
  }catch(e){toast('Refresh failed')}
  render();
}
// background check for new episodes: on open and when the app comes back to the front, at most every 3 hours.
// Quiet: only the counts change (and a caught-up show with something new moves back to Up Next).
const AUTO_EVERY=3*3600000;
let autoBusy=false;
async function autoRefresh(){
  if(autoBusy||Date.now()-(S.lastAuto||0)<AUTO_EVERY)return;
  autoBusy=true;
  for(const id of [...S.order]){
    const sh=S.shows[id];if(!sh||sh.demo)continue;
    try{const {eps,source}=await getEpisodes(sh);if(S.shows[id]&&eps.length){mergeEpisodes(S.shows[id],eps,source);save()}}catch(e){}
    if(view.name==='lib')renderLibList();else if(view.name==='show'&&view.id===id){updateProgress();renderEpisodes()}
  }
  S.lastAuto=Date.now();save();autoBusy=false;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefresh()});
function removeShow(){
  const sh=S.shows[view.id];if(!sh)return;
  if(!confirm(`Remove "${sh.title}" and its played history?`))return;
  delete S.shows[view.id];S.order=S.order.filter(x=>x!==view.id);save();go('lib');
}
function toggleEp(epId){
  const sh=S.shows[view.id];
  if(sh.played[epId])delete sh.played[epId];else sh.played[epId]=Date.now();
  save();
  const row=document.querySelector(`.ep[data-id="${CSS.escape(epId)}"]`);
  if(row){row.classList.toggle('done',!!sh.played[epId]);if(view.filter!=='all')row.remove()}
  updateProgress();
}
function playedThrough(epId){
  const sh=S.shows[view.id];const target=sh.episodes.find(e=>e.id===epId);if(!target)return;
  let n=0;sh.episodes.forEach(e=>{if(e.date<=target.date&&!sh.played[e.id]){sh.played[e.id]=Date.now();n++}});
  save();toast(`Marked ${n} episode${n===1?'':'s'} played`);renderEpisodes();updateProgress();
}
function markAll(val){
  const sh=S.shows[view.id];
  if(!confirm(val?'Mark every episode played?':'Clear all played marks?'))return;
  sh.played={};if(val)sh.episodes.forEach(e=>sh.played[e.id]=Date.now());
  save();renderEpisodes();updateProgress();
}

/* ---------- backup ---------- */
const DAY=86400000;
function bk(){if(!S.backup)S.backup={every:'week',day:new Date().getDay(),last:0};return S.backup}
function libraryJSON(){const {backup,...rest}=S;return JSON.stringify(rest,null,1)}
function downloadJSON(){
  const b=new Blob([libraryJSON()],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`pod-tracer-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function backUpNow(){downloadJSON();bk().last=Date.now();save();toast('Backup saved');if(view.name==='data')renderData()}
// when the next backup is due: the day after the last (Daily), or the picked weekday after it (Weekly)
function nextBackup(){
  const b=bk();if(b.every==='never')return 0;
  if(!b.last)return Date.now();
  const d=new Date(b.last);d.setHours(0,0,0,0);
  if(b.every==='day')return d.getTime()+DAY;
  let n=new Date(d.getTime()+DAY);while(n.getDay()!==b.day)n=new Date(n.getTime()+DAY);
  return n.getTime();
}
function backupDue(){const n=nextBackup();return n&&S.order.length&&Date.now()>=n}
function checkBackup(){
  if(!backupDue())return;
  const b=bk();
  $('#bk-modal-body').textContent=b.last?`Your last backup was ${fmtDate(b.last)}.`:"You haven't backed up your podcasts yet.";
  $('#bk-modal').classList.add('open');
}
$('#bk-later').onclick=()=>$('#bk-modal').classList.remove('open');
$('#bk-go').onclick=()=>{$('#bk-modal').classList.remove('open');backUpNow()};

// import: check pasted / loaded JSON, then Merge or Replace
function parseImport(txt){
  if(!txt.trim())return{state:'wait'};
  let d;try{d=JSON.parse(txt)}catch(e){return{state:'error',msg:'Not valid JSON'}}
  if(!d||typeof d.shows!=='object'||!Array.isArray(d.order))return{state:'error',msg:'Not a Pod Tracker backup'};
  const shows=d.order.map(id=>d.shows[id]).filter(Boolean);
  const played=shows.reduce((n,sh)=>n+Object.keys(sh.played||{}).length,0);
  return{state:'ok',data:d,msg:`${shows.length} podcast${shows.length===1?'':'s'} · ${played} played`};
}
function mergeImport(d){
  let added=0;
  d.order.forEach(id=>{
    const inc=d.shows[id];if(!inc)return;
    const cur=S.shows[id];
    if(!cur){S.shows[id]=inc;S.order.push(id);added++;return}
    const have=new Set(cur.episodes.map(e=>e.id));
    cur.episodes=cur.episodes.concat((inc.episodes||[]).filter(e=>!have.has(e.id)));
    cur.played={...(inc.played||{}),...cur.played};
  });
  return added;
}

  const f=e.target.files[0];if(!f)return;
  const t=$('#dt-import-text');if(t){t.value=await f.text();updateImportStatus()}
  e.target.value='';
});

const LIB_SORTS={recent:'Recently played',added:'Date added',title:'Title',progress:'Progress',updated:'New episodes'};
function renderLib(){
  const keys=Object.keys(LIB_SORTS);
  $('#hdr-row').innerHTML=S.order.length?`<div class="field-card">${SEARCH_ICON}<input id="libq" placeholder="Search library" autocomplete="off" value="${esc(view.libQ||'')}"></div>
    <div class="sort-card" id="libsort"><span class="k">Sort by:</span><span>${LIB_SORTS[view.libSort]}</span></div>`:'';
  if(S.order.length){
    $('#libq').oninput=e=>{view.libQ=e.target.value;renderLibList()};
    $('#libsort').onclick=()=>{view.libSort=keys[(keys.indexOf(view.libSort)+1)%keys.length];renderLib();syncBars()};
  }
  $('#app-footer').innerHTML=`<div class="add-card" id="addPod"><b>+</b>Add New Podcast</div>`;

  $('#app').innerHTML='<div id="liblist" style="display:flex;flex-direction:column;gap:4px"></div>';

}
function renderLibList(){
  let shows=S.order.map(id=>S.shows[id]).filter(Boolean);
  const q=(view.libQ||'').trim().toLowerCase();
  if(q)shows=shows.filter(s=>(s.title+' '+s.author).toLowerCase().includes(q));
  const pct=s=>s.episodes.length?playedCount(s)/s.episodes.length:0;
  const recency=sh=>Math.max(lastPlayed(sh),sh.newAt||0);   // last played, or when a new episode woke a caught-up show
  if(view.libSort==='recent')shows.sort((a,b)=>recency(b)-recency(a));
  if(view.libSort==='title')shows.sort((a,b)=>a.title.localeCompare(b.title));
  if(view.libSort==='progress')shows.sort((a,b)=>pct(b)-pct(a));
  if(view.libSort==='updated')shows.sort((a,b)=>Math.max(...b.episodes.map(e=>e.date),0)-Math.max(...a.episodes.map(e=>e.date),0));
  let h='';
  if(!S.order.length)h='<div class="empty">No podcasts tracked yet.<br>Tap “Add New Podcast” to find one.</div>';
  else{
    if(!shows.length)h+='<div class="empty">No matches.</div>';
    else h+=libCards(shows);
  }
  $('#liblist').innerHTML=h;
}

/* ---------- library cards ---------- */
// how high the check square fills: the first 1% of a show takes 3% of the height (so starting is visible),
// the last 5% takes the top 10% (so the end is visible), and 1–95% spreads over the rest
function fillHeight(f){
  if(f<=0)return 0;
  if(f>=1)return 1;
  if(f<=.01)return f/.01*.03;
  if(f>=.95)return .9+(f-.95)/.05*.1;
  return .03+(f-.01)/.94*.87;
}
const CHK='<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function info(sh){const p=playedCount(sh),t=sh.episodes.length,f=t?p/t:0;return{p,t,f,left:t-p,done:t>0&&p===t,nx:upNext(sh)}}
const onCard=id=>`data-show="${id}" style="${colorVars(id)}" onclick="openShow('${id}')"`;
const onChk=id=>`onclick="listenNext('${id}',event)"`;

function libCards(shows){
  const go=shows.filter(sh=>upNext(sh)), done=shows.filter(sh=>!upNext(sh));
  let h='';
  if(go.length)h+='<div class="list-divider"><span>Up Next</span></div>'+go.map(sh=>{
    const {p,t,f,left,nx}=info(sh);
    return `<div class="oc v4" ${onCard(sh.id)}>${artSec(sh.art,sh.id,sh.title)}
      <div class="bd"><span class="k ell">${esc(sh.title)}</span>${(()=>{const sg=splitGuest(nx.title);return sg.guests.length
          ?`<span class="mid"><span class="et one">${esc(sg.title)}</span><span class="gu">${esc(guestText(sg.guests))}</span></span>`
          :`<span class="mid"><span class="et">${esc(sg.title)}</span></span>`})()}
        <span class="mt">${nx.label} · ${fmtDate(nx.date)}${nx.dur?' · '+fmtDur(nx.dur):''} · ${p}/${t} (${left})</span></div>
      <button class="cks" type="button" style="--f:${fillHeight(f)}" ${onChk(sh.id)} aria-label="Mark listened"><span class="rnd">${CHK}</span></button></div>`;
  }).join('');
  if(done.length)h+='<div class="list-divider"><span>Caught Up</span></div>'+done.map(sh=>{
    const {t}=info(sh);
    return `<div class="row has-art done cu-row" style="${colorVars(sh.id)}" onclick="openShow('${sh.id}')">
      <div class="fill" style="width:100%"></div>${artSec(sh.art,sh.id,sh.title)}
      <div class="main"><span class="t">${esc(sh.title)}</span><span class="a">${esc(sh.author)}</span></div>
      <div class="prog"><span>${t} / ${t}</span><span>${lastPlayed(sh)?ago(lastPlayed(sh)):''}</span></div></div>`;
  }).join('');
  return h;
}

function dtBackup(){
  const b=bk(), n=nextBackup();

    <div class="dt-card when"><span>Last backup<b>${b.last?fmtDate(b.last):'Never'}</b></span><span>Next backup<b>${next}</b></span></div>
    <div class="dt-split" id="bk-every">
      <button data-every="day" class="${b.every==='day'?'on':''}">Daily</button>
      <button data-every="week" class="wk ${b.every==='week'?'on':''}"><span class="wk-label">Weekly</span><span class="wk-days">${days}</span></button>
      <button data-every="never" class="${b.every==='never'?'on':''}">Never</button>

function updateProgress(){

function renderEpisodes(){

  if(!list.length){el.innerHTML='<div class="empty">Nothing here.</div>';return}
  el.innerHTML=list.map(e=>`<div class="row ep ${sh.played[e.id]?'done':''}" data-id="${esc(e.id)}">

}

});

/* ---------- offline: the service worker keeps a copy of the app (only when served over http/https, e.g. GitHub Pages) ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const reg=()=>navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(document.readyState==='complete')reg();else window.addEventListener('load',reg);
}
